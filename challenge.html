// ============================================================
// TAKE COUNTER
// ============================================================

const TAKE_COUNTER_DEFAULT = 'Day X, Take [n]';

function tcTemplateKey(challenge) { return 'takeTemplate_' + (challenge || 'global'); }
function tcNKey(challenge)        { return 'takeN_' + (challenge || 'global'); }

function getTakeTemplate(challenge) {
  return localStorage.getItem(tcTemplateKey(challenge)) || '';
}
function setTakeTemplate(challenge, val) {
  localStorage.setItem(tcTemplateKey(challenge), val);
}
function getTakeN(challenge) {
  return parseInt(localStorage.getItem(tcNKey(challenge)) || '1', 10);
}
function setTakeN(challenge, n) {
  localStorage.setItem(tcNKey(challenge), String(n));
}
function incrementTakeN(challenge) {
  setTakeN(challenge, getTakeN(challenge) + 1);
}

function renderTakeDisplay() {
  const el = document.getElementById('take-counter-display');
  const versionEl = document.getElementById('version-display');
  const onSelect = document.getElementById('screen-select').classList.contains('active');
  // Version stamp visible only on the select screen
  if (versionEl) versionEl.style.display = onSelect ? 'block' : 'none';
  // Take counter hidden on select screen
  const template = getTakeTemplate(currentChallenge);
  if (onSelect || !template) {
    el.style.display = 'none';
    return;
  }
  const n = getTakeN(currentChallenge);
  el.textContent = template.replace(/\[n\]/gi, n);
  el.style.display = 'block';
}

function openTakeSheet() {
  const sheet   = document.getElementById('take-counter-sheet');
  const input   = document.getElementById('take-counter-input');
  const nInput  = document.getElementById('take-counter-n-input');
  input.value   = getTakeTemplate(currentChallenge);
  nInput.value  = getTakeN(currentChallenge);
  sheet.classList.add('visible');
  setTimeout(() => input.focus(), 80);
}

function closeTakeSheet() {
  const input  = document.getElementById('take-counter-input');
  const nInput = document.getElementById('take-counter-n-input');
  setTakeTemplate(currentChallenge, input.value.trim());
  const n = parseInt(nInput.value, 10);
  if (!isNaN(n) && n >= 1) setTakeN(currentChallenge, n);
  document.getElementById('take-counter-sheet').classList.remove('visible');
  renderTakeDisplay();
}

document.getElementById('take-counter-btn').onclick = openTakeSheet;
document.getElementById('take-counter-close').onclick = closeTakeSheet;
document.getElementById('take-counter-backdrop').onclick = closeTakeSheet;
document.getElementById('take-counter-done').onclick = closeTakeSheet;

function resetTakeN() {
  document.getElementById('take-counter-n-input').value = '1';
}

document.getElementById('take-counter-input').addEventListener('input', resetTakeN);

document.getElementById('take-counter-input-clear').onclick = () => {
  document.getElementById('take-counter-input').value = '';
  document.getElementById('take-counter-input').focus();
  resetTakeN();
};

document.getElementById('take-counter-use-template').onclick = () => {
  document.getElementById('take-counter-input').value = TAKE_COUNTER_DEFAULT;
  document.getElementById('take-counter-input').focus();
  resetTakeN();
};

function openCustomPromptPanel() {
  if (!challengeSupportsCustomPrompt()) return;
  const overlay = document.getElementById('custom-prompt-overlay');
  const input = document.getElementById('custom-prompt-input');
  input.value = currentCustomPromptText || '';
  overlay.classList.add('visible');
  setTimeout(() => input.focus(), 80);
}

function closeCustomPromptPanel() {
  document.getElementById('custom-prompt-overlay').classList.remove('visible');
}

function launchCustomPromptChallenge(rawPrompt) {
  const prompt = rawPrompt.trim();
  if (!prompt || !challengeSupportsCustomPrompt()) return;

  currentCustomPromptText = prompt;
  usedPromptText = prompt;

  if (currentChallenge === 'story') {
    currentStoryWords = null;
    currentPlotText   = null;
  } else if (currentChallenge === 'topic') {
    currentTopicSentence = null;
    currentTopicText     = null;
  }

  document.getElementById('prompt-label').textContent = '';
  document.getElementById('prompt-display').innerHTML =
    `<p class="prompt-text">${getEffectivePromptHTML()}</p>`;
  timerTotal = getEffectiveTime(currentChallenge);

  if (prepTimeEnabled && challengeSupportsPrep() && !currentFramework?.disablePrepTime) {
    document.getElementById('prep-prompt-label').textContent = '';
    document.getElementById('prep-prompt-display').innerHTML =
      `<p class="prompt-text">${getEffectivePromptHTML()}</p>`;
    showScreen('screen-prep');
    startPrepTimer();
    return;
  }

  startActiveChallenge();
}

document.getElementById('custom-prompt-btn').onclick = () => { playPop(); openCustomPromptPanel(); };
document.getElementById('custom-prompt-close').onclick = closeCustomPromptPanel;
document.getElementById('custom-prompt-overlay').onclick = (e) => {
  if (e.target.id === 'custom-prompt-overlay') closeCustomPromptPanel();
};
document.getElementById('custom-prompt-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('custom-prompt-form').requestSubmit();
  }
});
document.getElementById('custom-prompt-form').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('custom-prompt-input');
  if (!input.value.trim()) {
    input.focus();
    return;
  }
  closeCustomPromptPanel();
  launchCustomPromptChallenge(input.value);
});

let uiHidden = false;
let visTouchStartX = 0;
let visTouchStartY = 0;
let visLastTapTime = 0;
const VIS_DOUBLE_TAP_MS = 300;
let wasTimerRunning = false;
let wasPrepTimerRunning = false;
let slideOutScreen = null;
let creatorAutoMarkerTimeout = null;
let noteMarkerActive = false;
let noteTouchStartX = 0;
let noteTouchStartY = 0;
let suppressRestoreClickUntil = 0;

const visBtn = document.getElementById('vis-toggle-btn');
const appEl  = document.getElementById('app');
const restoreOverlay = document.getElementById('ui-restore-overlay');
const creatorAutoMarkerEl = document.getElementById('creator-auto-marker');
const creatorNoteMarkerEl = document.getElementById('creator-note-marker');

function formatMarkerTimestamp(date = new Date()) {
  const day = date.getDate();
  const month = date.toLocaleString('en-GB', { month: 'short' });
  const hh = String(date.getHours()).padStart(2, '0');
  const mm = String(date.getMinutes()).padStart(2, '0');
  const ss = String(date.getSeconds()).padStart(2, '0');
  return `${day} ${month}, ${hh}:${mm}:${ss}`;
}

function getCurrentTakeDisplayText(challenge = currentChallenge) {
  const template = getTakeTemplate(challenge);
  if (!template) return '';
  return template.replace(/\[n\]/gi, getTakeN(challenge));
}

function buildCreatorMarkerData() {
  const onSelectScreen = document.getElementById('screen-select').classList.contains('active');
  const challengeLabel = getChallengeConfig(currentChallenge).label || '';
  return {
    challengeName: onSelectScreen ? 'Selection Menu' : challengeLabel,
    frameworkName: onSelectScreen ? '' : (currentFramework?.name || ''),
    promptTypeName: onSelectScreen ? '' : (currentPromptType?.name || ''),
    takeText: onSelectScreen ? '' : getCurrentTakeDisplayText(currentChallenge),
    timestamp: formatMarkerTimestamp(),
  };
}

function renderCreatorMarker(el, title, data) {
  const lines = [];
  if (data.challengeName) lines.push(`<div class="creator-marker-line"><strong>Challenge:</strong> ${data.challengeName}</div>`);
  if (data.frameworkName) lines.push(`<div class="creator-marker-line"><strong>Framework:</strong> ${data.frameworkName}</div>`);
  if (data.promptTypeName) lines.push(`<div class="creator-marker-line"><strong>Prompt Type:</strong> ${data.promptTypeName}</div>`);
  if (data.takeText) lines.push(`<div class="creator-marker-line"><strong>Take:</strong> ${data.takeText}</div>`);

  el.innerHTML =
    `<div class="creator-marker-head">`
      + `<span class="creator-marker-time">${data.timestamp}</span>`
    + `</div>`
    + `<div class="creator-marker-title">${title}</div>`
    + `<div class="creator-marker-lines">${lines.join('')}</div>`;
}

function showAutoTakeEndMarker() {
  clearTimeout(creatorAutoMarkerTimeout);
  renderCreatorMarker(creatorAutoMarkerEl, 'Take end marker', buildCreatorMarkerData());
  creatorAutoMarkerEl.classList.add('visible');
  creatorAutoMarkerTimeout = setTimeout(() => {
    creatorAutoMarkerEl.classList.remove('visible');
  }, 1500);
}

function showNoteMarker() {
  noteMarkerActive = true;
  renderCreatorMarker(creatorNoteMarkerEl, 'Note marker', buildCreatorMarkerData());
  creatorNoteMarkerEl.classList.add('visible');
}

function clearNoteMarker() {
  noteMarkerActive = false;
  creatorNoteMarkerEl.classList.remove('visible');
}

function toggleNoteMarker() {
  if (noteMarkerActive) {
    clearNoteMarker();
  } else {
    showNoteMarker();
  }
}

function isLowerThirdTouch(clientY) {
  const rect = appEl.getBoundingClientRect();
  const pct = (clientY - rect.top) / rect.height;
  return pct >= 0.67;
}

function hideUI(slideMode) {
  uiHidden = true;
  wasTimerRunning     = timerRunning;
  wasPrepTimerRunning = prepTimerRunning;
  if (timerRunning)     pauseTimer();
  if (prepTimerRunning) pausePrepTimer();

  if (slideMode) {
    const activeScreen = document.querySelector('.screen.active');
    slideOutScreen = activeScreen || null;
    if (activeScreen) {
      activeScreen.classList.add('ui-slide-out');
      // After animation: hide app, then remove slide class (invisible, so no flicker)
      setTimeout(() => {
        appEl.classList.add('ui-hidden');
        requestAnimationFrame(() => activeScreen.classList.remove('ui-slide-out'));
      }, 350);
    } else {
      appEl.classList.add('ui-hidden');
    }
  } else {
    slideOutScreen = null;
    appEl.classList.add('ui-hidden');
  }
  restoreOverlay.style.display = 'block';
}

function restoreUI(slideMode) {
  uiHidden = false;
  restoreOverlay.style.display = 'none';
  clearNoteMarker();

  if (slideMode && slideOutScreen) {
    // Slide back in from left
    const screen = slideOutScreen;
    slideOutScreen = null;
    appEl.classList.remove('ui-hidden');
    screen.classList.add('ui-slide-in');
    setTimeout(() => screen.classList.remove('ui-slide-in'), 360);
  } else {
    slideOutScreen = null;
    appEl.classList.remove('ui-hidden');
  }

  if (wasTimerRunning)     resumeTimer();
  if (wasPrepTimerRunning) resumePrepTimer();
  wasTimerRunning     = false;
  wasPrepTimerRunning = false;
}

// Touch anywhere on screen (not on interactive elements) to show/hide UI
appEl.addEventListener('touchstart', e => {
  if (uiHidden) return;
  visTouchStartX = e.touches[0].clientX;
  visTouchStartY = e.touches[0].clientY;
}, { passive: true });

appEl.addEventListener('touchend', e => {
  if (uiHidden) return;
  // Pass through if touch landed on any interactive element or open sheet/overlay
  if (e.target.closest('button, input, label, a, select, #framework-active-wrap, .framework-picker-overlay, .take-counter-sheet-overlay')) return;
  // Only trigger in the middle vertical third of the app container
  const rect = appEl.getBoundingClientRect();
  const pct = (visTouchStartY - rect.top) / rect.height;
  if (pct < 0.33 || pct > 0.67) return;
  const dx = e.changedTouches[0].clientX - visTouchStartX;
  const dy = e.changedTouches[0].clientY - visTouchStartY;
  const isTap       = Math.abs(dx) < 12 && Math.abs(dy) < 12;
  if (isTap) {
    const now = Date.now();
    if (now - visLastTapTime < VIS_DOUBLE_TAP_MS) {
      visLastTapTime = 0;
      hideUI(false);
    } else {
      visLastTapTime = now;
    }
  }
}, { passive: true });

// Desktop fallback — click on empty area
appEl.addEventListener('click', e => {
  if (uiHidden || ('ontouchstart' in window)) return;
  if (e.target.closest('button, input, label, a, select, #framework-active-wrap')) return;
  hideUI(false);
});

restoreOverlay.addEventListener('touchstart', e => {
  noteTouchStartX = e.touches[0].clientX;
  noteTouchStartY = e.touches[0].clientY;
}, { passive: true });

restoreOverlay.addEventListener('touchend', e => {
  if (!uiHidden) return;
  suppressRestoreClickUntil = Date.now() + 500;
  const touch = e.changedTouches[0];
  const dx = touch.clientX - noteTouchStartX;
  const dy = touch.clientY - noteTouchStartY;
  const isTap = Math.abs(dx) < 12 && Math.abs(dy) < 12;
  if (!isTap) return;
  if (isLowerThirdTouch(noteTouchStartY)) {
    toggleNoteMarker();
    return;
  }
  restoreUI(false);
}, { passive: true });

restoreOverlay.addEventListener('click', e => {
  if (!uiHidden) return;
  if (Date.now() < suppressRestoreClickUntil) return;
  if (isLowerThirdTouch(e.clientY)) {
    toggleNoteMarker();
    return;
  }
  restoreUI(false);
});

    prepTimerRemaining = 10;
    prepTimerTotal     = 10;
    prepTimerStartWall = performance.now();
    prepTimerRunning   = true;
    prepBeepsPlayed    = new Set();
    prepTimerRAF       = requestAnimationFrame(prepTimerTick);

  const elapsed = (performance.now() - prepTimerStartWall) / 1000;

  prepBeepsPlayed    = new Set();
};

function launchChallenge() {
  clearCustomPromptState();
  if (currentChallenge === 'story') {
    // Pick prompt content based on selected prompt type
    if (currentPromptType?.id === '3-words') {
      const words = pickRandom(WORDS, 3);
      currentStoryWords = words;
      usedPromptText    = words.join(', ');
    } else if (currentPromptType?.id === 'basic-plot') {
      const plot = pickRandom(PLOTS, 1)[0];
      currentPlotText = plot;
      usedPromptText  = plot;
    } else {
      usedPromptText = '';
    }

    document.getElementById('prompt-label').textContent = '';
    document.getElementById('prompt-display').innerHTML =
      `<p class="prompt-text">${getEffectivePromptHTML()}</p>`;
    timerTotal = getEffectiveTime('story');

    if (prepTimeEnabled && challengeSupportsPrep() && !currentFramework?.disablePrepTime) {
      document.getElementById('prep-prompt-label').textContent = '';
      document.getElementById('prep-prompt-display').innerHTML =
        `<p class="prompt-text">${getPrepDescHTML()}</p>`;
      showScreen('screen-prep');
      startPrepTimer();
      return;
    }

    startActiveChallenge();
    return;
  } else if (currentChallenge === 'topic') {
    const topic = pickRandom(TOPICS, 1)[0];
    usedPromptText = topic;
    currentTopicText     = topic;
    currentTopicSentence = 'Talk about ' + topic;
    document.getElementById('prompt-label').textContent = '';
    document.getElementById('prompt-display').innerHTML =
      `<p class="prompt-text">${getEffectivePromptHTML()}</p>`;
    timerTotal = getEffectiveTime();
    if (prepTimeEnabled && challengeSupportsPrep() && !currentFramework?.disablePrepTime) {
      document.getElementById('prep-prompt-label').textContent = '';
      document.getElementById('prep-prompt-display').innerHTML =
        `<p class="prompt-text">${getPrepDescHTML()}</p>`;
      showScreen('screen-prep');
      startPrepTimer();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'selfknowledge') {
    const prompt = pickRandom(SELF_KNOWLEDGE, 1)[0];
    usedPromptText = prompt;
    document.getElementById('prompt-label').textContent = 'Your prompt';
    document.getElementById('prompt-display').innerHTML =
      `<div class="words-list"><p class="twister-text">${prompt}</p></div>`;
    timerTotal = getEffectiveTime();
    if (prepTimeEnabled && challengeSupportsPrep()) {
      document.getElementById('prep-prompt-label').textContent = 'Your prompt';
      document.getElementById('prep-prompt-display').innerHTML =
        `<p class="twister-text">${prompt}</p>`;
      showScreen('screen-prep');
      startPrepTimer();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'interview') {
    const q = pickRandom(INTERVIEW_QUESTIONS, 1)[0];
    usedPromptText = q;
    document.getElementById('prompt-label').textContent = 'Your question';
    document.getElementById('prompt-display').innerHTML = `<p class="twister-text">${q}</p>`;
    timerTotal = getEffectiveTime();
    if (prepTimeEnabled && challengeSupportsPrep()) {
      document.getElementById('prep-prompt-label').textContent = 'Your question';
      document.getElementById('prep-prompt-display').innerHTML = `<p class="twister-text">${q}</p>`;
      showScreen('screen-prep');
      startPrepTimer();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'gratitude') {
    const promptText = currentFramework?.promptText || GRATITUDE_PROMPT;
    usedPromptText = promptText;
    document.getElementById('prompt-label').textContent = '';
    document.getElementById('prompt-display').innerHTML =
      `<p class="prompt-text">${promptText}</p>`;
    timerTotal = getEffectiveTime();
    if (prepTimeEnabled && challengeSupportsPrep() && !currentFramework?.disablePrepTime) {
      document.getElementById('prep-prompt-label').textContent = '';
      document.getElementById('prep-prompt-display').innerHTML =
        `<p class="prompt-text">${getPrepDesc()}</p>`;
      showScreen('screen-prep');
      startPrepTimer();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'articulation') {
    const item = pickRandom(ARTICULATIONS, 1)[0];
    usedPromptText = item.name;
    renderArticulation(item);
    timerTotal = getEffectiveTime();
  } else if (currentChallenge === 'articulation2') {
    const item = pickRandom(ARTICULATIONS, 1)[0];
    usedPromptText = item.name;
    renderArticulation2(item);
    timerTotal = getEffectiveTime();
  }

  // Prep time for fall-through challenges (articulation, articulation2)
  if (prepTimeEnabled && challengeSupportsPrep()) {
    const prepLabels = {
      articulation: usedPromptText, articulation2: usedPromptText,
    };
    document.getElementById('prep-prompt-label').textContent = prepLabels[currentChallenge] || '';
    document.getElementById('prep-prompt-display').innerHTML =
      document.getElementById('prompt-display').innerHTML;
    showScreen('screen-prep');
    startPrepTimer();
    return;
  }

  startActiveChallenge();
}

    document.getElementById('prompt-display').innerHTML = `<p class="twister-text">${usedPromptText}</p>`;
    return;

    renderArticulation2(currentArticulationItem);

function showTimesUp() {

  const challengeConfig = getChallengeConfig();

  const title      = document.querySelector('.timesup-title');
  const sub        = document.querySelector('.timesup-sub');
  const completion = document.getElementById('timesup-completion');
  const prompt     = document.getElementById('timesup-prompt');

  // Always use compact header title for all challenges
  title.textContent = "Done!";
  title.className   = 'timesup-title timesup-title-compact';
  const timesupScreen = document.getElementById('screen-timesup');
  timesupScreen.classList.remove('art2-mode');
  timesupScreen.classList.remove('gratitude-mode');

  // Always hide the art2 score section; shown only for articulation2
  const scoreSection = document.getElementById('art2-score-section');
  scoreSection.style.display = 'none';

  // Render framework zone and challenge ratings (generic, data-driven)
  renderFrameworkZone();
  renderChallengeRatings();

  if (challengeConfig.timesUpMode === 'articulation2') {
    const reached = artLineIdx + 1;
    const pct = artTotalLines > 0 ? Math.round((reached / artTotalLines) * 100) : 0;

    document.getElementById('screen-timesup').classList.add('art2-mode');
    sub.style.display        = 'none';
    prompt.style.display     = 'none';
    completion.style.display = 'none';
    scoreSection.style.display = 'flex';

    // Progress bar — no track, pct floats just off the right edge of the fill
    const fill  = document.getElementById('art2-progress-fill');
    const pctEl = document.getElementById('art2-progress-pct');
    fill.style.width  = '0%';
    pctEl.textContent = `${pct}%`;

    if (pct > 80) {
      pctEl.classList.add('inside');
      pctEl.style.left = '';
    } else {
      pctEl.classList.remove('inside');
      pctEl.style.left = `${pct}%`;
    }

    setTimeout(() => { fill.style.width = `${pct}%`; }, 60);

    // Generate star rows (reset each time; currentColor picks up CSS colour)
    ['art2-stars-accuracy', 'art2-stars-flow'].forEach(id => {
      const container = document.getElementById(id);
      container.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const btn = document.createElement('button');
        btn.className = 'art2-star';
        btn.setAttribute('data-value', i);
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
        btn.onclick = () => {
          const val = parseInt(btn.getAttribute('data-value'));
          container.querySelectorAll('.art2-star').forEach((s, idx) => {
            s.classList.toggle('filled', idx < val);
          });
        };
        container.appendChild(btn);
      }
    });

  } else {
    title.textContent = challengeConfig.timesUpTitle || "Done!";
    if (challengeConfig.timesUpClass) timesupScreen.classList.add(challengeConfig.timesUpClass);
    sub.style.display = 'none';
    prompt.style.display     = 'none';
    completion.style.display = 'none';
  }

  showScreen('screen-timesup');
}

document.getElementById('same-prompt-btn').onclick = () => {
  showAutoTakeEndMarker();
  incrementTakeN(currentChallenge);
  replaySamePrompt();
};

document.getElementById('new-prompt-btn').onclick = () => {
  // Return to the intro screen for the same challenge (currentChallenge stays set)
  // Keep currentFramework selected so user doesn't have to re-pick it
  showAutoTakeEndMarker();
  incrementTakeN(currentChallenge);
  clearCustomPromptState();
  clearFrameworkOverlay();
  showScreen('screen-intro');
};

document.getElementById('menu-btn').onclick = () => {
  showAutoTakeEndMarker();
  incrementTakeN(currentChallenge);
  clearCustomPromptState();
  clearFrameworkOverlay();
  currentFramework = null;
  showScreen('screen-select');
};

// ============================================================
// APPLY CONFIG
// ============================================================

(function applyConfig() {
  for (const [key, challengeConfig] of Object.entries(CHALLENGES)) {
    if (!CONFIG[key]?.enabled) {
      const el = document.getElementById(challengeConfig.buttonId);
      if (el) el.style.display = 'none';
    }
  }
})();

</script>
</body>
</html>
