<!--
  ================================================================
  VIDEO CHALLENGE APP  —  challenge.html
  ================================================================
  Single self-contained HTML file. No build tools, no dependencies.
  Designed for 9:16 (portrait) aspect ratio with camera feed behind
  the UI. Intended for use during video recording.

  ── SCREENS ──────────────────────────────────────────────────
  1. screen-select   Challenge selection menu
  2. screen-intro    Challenge description + optional prep toggle
  2b. screen-prep    Prep timer countdown (if enabled)
  3. screen-active   Live challenge with countdown timer
  4. screen-timesup  End screen

  ── CHALLENGES ───────────────────────────────────────────────
  story         Storytelling, 60s. Prompt types + optional frameworks.
  topic         Random topic, 60s. Optional frameworks.
  selfknowledge Reflective prompt (WNRS/Esther Perel style), 60s. Reroll ✓
  interview     Behavioural interview question, 60s. Reroll ✓
  gratitude     Daily gratitude, 60s. Optional frameworks. No reroll.
  articulation  Long passage to read aloud, 30s. Reroll ✓ (disabled)
  articulation2 Line-by-line scroll passage, 30s. Tap anywhere to advance.
                No reroll. No prep time. Tracks lines reached.
                Times up: self-rate Progress, Accuracy, Flow (1–5 stars).

  ── CONFIG FLAGS ─────────────────────────────────────────────
  CONFIG.{challenge}.enabled  Show in selection screen
  CONFIG.{challenge}.public   Include in future public release
  CONFIG.prepTime.enabled     Show "Add prep time" toggle globally

  ── KEY DESIGN DECISIONS ─────────────────────────────────────
  - Prompt labels ("Your story" etc.) are hidden — prompt alone
    is shown; the label was redundant.
  - Times up screen: no prompt repeat for most challenges.
    Exceptions: gratitude shows a quote; art2 shows line count.
  - art2 scroll container height is set dynamically via RAF;
    a CSS fallback height prevents full-text flash before JS runs.
  - GO button is same size/position as the active timer circle
    (bottom-left, 84px). Prep toggle sits to its right.
  ================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Challenge</title>
<style>

/* ============================================================
   BASE
   ============================================================ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* Prevent double-tap zoom on all interactive elements */
button, .go-circle, .prep-toggle, .challenge-btn {
  touch-action: manipulation;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================
   9:16 APP CONTAINER
   ============================================================ */

.app {
  position: relative;
  /* Use --vh (set by JS from visualViewport) instead of 100vh to avoid
     iOS zoom glitch when control centre is shown/dismissed */
  width: min(100vw, calc(var(--vh, 100vh) * 9 / 16));
  height: min(var(--vh, 100vh), calc(100vw * 16 / 9));
  max-height: var(--vh, 100vh);
  background: #111;
  overflow: hidden;
}

/* ============================================================
   CAMERA
   ============================================================ */

#camera {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1); /* mirror for selfie */
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}

#camera.visible { opacity: 1; }

/* ============================================================
   SCREENS
   ============================================================ */

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
}

/* ============================================================
   TAP ANIMATION (shared)
   ============================================================ */

@keyframes tapAnim {
  0%   { transform: scale(1); }
  28%  { transform: scale(0.88); }
  100% { transform: scale(1); }
}

.tapping {
  animation: tapAnim 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}

/* ============================================================
   BACK BUTTON (shared)
   ============================================================ */

.back-btn {
  position: absolute;
  top: max(28px, 5%);
  left: max(18px, 4%);
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
  cursor: pointer;
  z-index: 10;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Shared SVG icon sizing for all icon buttons */
.back-btn svg,
.prep-skip-btn svg,
.help-btn svg,
.reroll-btn svg {
  display: block;
  filter: drop-shadow(0 1px 8px rgba(0,0,0,0.9));
}

.back-btn svg,
.prep-skip-btn svg,
.help-btn svg {
  width: clamp(20px, 3.4vh, 26px);
  height: clamp(20px, 3.4vh, 26px);
}

.reroll-btn svg {
  width: clamp(16px, 2.7vh, 21px);
  height: clamp(16px, 2.7vh, 21px);
}

/* ============================================================
   SCREEN 1 -SELECTION
   ============================================================ */

#screen-select {
  /* Camera shows through -just a subtle dark scrim for readability */
  background: rgba(0,0,0,0.28);
  align-items: flex-start;
  justify-content: flex-start;
}

.select-inner {
  padding: clamp(48px, 9%, 80px) clamp(18px, 5%, 36px) 0;
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 2vh, 20px);
}

.select-title {
  color: white;
  font-size: clamp(15px, 2.4vh, 22px);
  font-weight: 300;
  letter-spacing: 0.04em;
  text-shadow: 0 1px 14px rgba(0,0,0,0.95), 0 2px 4px rgba(0,0,0,0.7);
}

.challenge-options {
  display: flex;
  flex-wrap: wrap;
  gap: clamp(8px, 1.4vh, 12px);
}

.challenge-btn {
  background: rgba(0,0,0,0.35);
  border: 1.5px solid rgba(255,255,255,0.45);
  color: white;
  font-size: clamp(13px, 2.1vh, 18px);
  font-weight: 400;
  padding: clamp(7px, 1.2vh, 11px) clamp(14px, 3.5%, 22px);
  border-radius: 30px;
  cursor: pointer;
  letter-spacing: 0.02em;
  user-select: none;
  text-shadow: 0 1px 8px rgba(0,0,0,0.8);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}

/* ============================================================
   SCREEN 2 -INTRO
   ============================================================ */

#screen-intro {
  /* camera behind this */
}

/* Label sits in the top bar, centred between back and help icons */
.intro-label {
  position: absolute;
  top: max(28px, 5%);
  left: 50%;
  transform: translateX(-50%);
  height: clamp(20px, 3.4vh, 26px);
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  color: rgba(255,255,255,0.65);
  font-size: clamp(11px, 1.8vh, 15px);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  z-index: 5;
}

/* Description area — left-aligned, starts just below the top bar */
.intro-inner {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  padding: max(80px, 14%) clamp(18px, 5%, 36px) max(130px, 24%);
}

.intro-desc {
  color: white;
  font-size: clamp(18px, 3.2vh, 28px);
  font-weight: 300;
  line-height: 1.55;
  text-align: left;
  text-shadow: 0 1px 14px rgba(0,0,0,0.95), 0 2px 4px rgba(0,0,0,0.7);
}

/* Intro bottom row — two-column layout: GO circle left, pill+toggle right */
#intro-bottom-row {
  position: absolute;
  bottom: calc(max(42px, 6.5%) + env(safe-area-inset-bottom, 0px));
  left: max(20px, 5%);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 16px;
}

#intro-right-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  justify-content: center;
}

/* GO circle */
.go-circle {
  width: 84px;
  height: 84px;
  background: #22c55e;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(22px, 4vh, 32px);
  font-weight: 800;
  color: white;
  cursor: pointer;
  user-select: none;
  box-shadow: 0 6px 30px rgba(0,0,0,0.5);
  letter-spacing: -0.02em;
  flex-shrink: 0;
}

/* Prep toggle — bottom row of right group */
#prep-toggle-wrap {
  align-items: center;
  margin-top: 0;
}

/* ============================================================
   SCREEN 3 -ACTIVE CHALLENGE
   ============================================================ */

#screen-active {
  /* camera behind */
}

/* Prompt area — starts just below the top bar */
.prompt-area {
  position: absolute;
  top: max(64px, 11%);
  left: 0;
  right: 0;
  padding: 0 clamp(18px, 5%, 36px);
  text-align: left;
}

/* Prep screen: prompt flows in column so framework preview follows it naturally */
#screen-prep .prompt-area {
  position: relative;
  top: auto;
  margin-top: max(76px, 13%);
}

/* Prompt label — hidden; prompt content alone is sufficient */
.prompt-label {
  display: none;
}

/* Story: 3 large words stacked */
.words-list {
  display: flex;
  flex-direction: column;
  gap: clamp(2px, 0.5vh, 6px);
}

.word-item {
  color: white;
  font-size: clamp(34px, 6.5vh, 58px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.02em;
  text-shadow: 0 2px 16px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.8);
}

/* Articulation: scrollable long passage */
.articulation-scroll {
  height: clamp(78px, 13vh, 108px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.articulation-scroll::-webkit-scrollbar {
  display: none;
}

.articulation-text {
  color: white;
  font-size: clamp(15px, 2.5vh, 20px);
  font-weight: 400;
  line-height: 1.55;
  text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
}

/* Articulation 2: scroll window -height & padding set dynamically by JS */
.art2-scroll {
  overflow: hidden;
  /* Fallback height so content is clipped before JS measures and sets the exact value */
  height: clamp(72px, 12.6vh, 104px);
  /* Aggressive fade: only the middle band (roughly 1 line) is fully visible */
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.25) 33%, black 41%, black 59%, rgba(0,0,0,0.7) 67%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.25) 33%, black 41%, black 59%, rgba(0,0,0,0.7) 67%, transparent 100%);
}

.art2-text {
  color: white;
  font-size: clamp(16px, 2.8vh, 23px);
  font-weight: 400;
  line-height: 1.5;
  text-shadow: 0 2px 16px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.8);
}


/* Timesup completion line */
.timesup-completion {
  display: none;
  color: rgba(255,255,255,0.65);
  font-size: clamp(13px, 2.1vh, 18px);
  font-weight: 300;
  line-height: 1.4;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}

/* Art2 compact title — floats in the top bar at the same level as the help icon */
.timesup-title-compact {
  position: absolute !important;
  top: max(28px, 5%);
  left: 50%;
  transform: translateX(-50%);
  height: clamp(20px, 3.4vh, 26px);
  display: flex !important;
  align-items: center;
  white-space: nowrap;
  font-size: clamp(20px, 3.4vh, 28px) !important;
  font-weight: 600 !important;
  color: white !important;
  letter-spacing: normal !important;
  text-transform: none !important;
  text-shadow: 0 1px 10px rgba(0,0,0,0.9) !important;
}

/* art2-mode: used only to show the art2-score-section */

/* Art2 self-scoring section */
.art2-score-section {
  display: none;
  width: 100%;
  flex-direction: column;
  gap: clamp(12px, 2.2vh, 20px);
}

.art2-score-section.visible {
  display: flex;
}

/* Metric rows (Progress / Accuracy / Flow) */
.art2-metric-row {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.6vw, 13px);
  width: 100%;
}

.art2-metric-label {
  color: white;
  font-size: clamp(13px, 2.2vh, 18px);
  font-weight: 600;
  width: 5.2em;
  flex-shrink: 0;
  text-align: left;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}

/* Progress bar — no track, yellow fill only, square left corner / pill right */
/* Height matches the star size so all three rows feel the same weight */
.art2-progress-outer {
  flex: 1;
  position: relative;
  height: clamp(30px, 5.2vh, 42px);
}

.art2-progress-fill {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  background: #eab308;
  border-radius: 0 8px 8px 0;
  width: 0%;
  transition: width 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* Percentage label — absolutely positioned just off the right end of the fill */
.art2-progress-pct {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-size: clamp(13px, 2.2vh, 18px);
  font-weight: 600;
  white-space: nowrap;
  padding-left: clamp(6px, 1vw, 8px);
  text-shadow: 0 1px 6px rgba(0,0,0,0.8);
}

/* Inside bar variant (>80%) — white text so it's readable on yellow */
.art2-progress-pct.inside {
  padding-left: 0;
  padding-right: clamp(10px, 1.6vw, 14px);
  color: white;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  left: auto !important;
  right: 0;
}

/* Star rows */
.art2-stars {
  flex: 1;
  display: flex;
  gap: clamp(0px, 0.3vw, 3px);
  align-items: center;
  justify-content: flex-end;
}

.art2-star {
  background: none;
  border: none;
  padding: clamp(2px, 0.45vh, 4px);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  opacity: 0.22;
  transition: color 0.12s ease, opacity 0.12s ease;
}

.art2-star.filled {
  color: #eab308;
  opacity: 1;
}

.art2-star svg {
  display: block;
  width: clamp(24px, 4.3vh, 34px);
  height: clamp(24px, 4.3vh, 34px);
}

/* Tongue twister: quoted text */
.twister-text {
  color: white;
  font-size: clamp(19px, 3.4vh, 30px);
  font-weight: 400;
  line-height: 1.45;
  text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
}

.reroll-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  padding: 4px;
  cursor: pointer;
  user-select: none;
}

/* Timer -bottom left */
.timer-wrap {
  position: absolute;
  bottom: calc(max(20px, 3%) + env(safe-area-inset-bottom, 0px));
  left: max(20px, 5%);
  display: flex;
  align-items: center;
  flex-direction: row;
  gap: clamp(8px, 1.5vw, 14px);
}

#timer-svg {
  filter: drop-shadow(0 2px 10px rgba(0,0,0,0.7));
  flex-shrink: 0;
}

.timer-num {
  color: white;
  font-size: clamp(28px, 5vh, 44px);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 10px rgba(0,0,0,0.85);
  min-width: 2ch;
  line-height: 1;
  text-align: right;
}

/* ============================================================
   SCREEN 4 -TIME'S UP
   ============================================================ */

#screen-timesup {
  /* camera behind -content at top, button at bottom */
  align-items: center;
  justify-content: flex-start;
}

.timesup-inner {
  text-align: center;
  padding: clamp(92px, 16%, 124px) max(16px, 4%) 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(6px, 1.2vh, 12px);
  width: 100%;
}

.timesup-title {
  color: white;
  font-size: clamp(32px, 5.8vh, 52px);
  font-weight: 700;
  text-shadow: 0 2px 20px rgba(0,0,0,0.95);
  letter-spacing: -0.01em;
}

.timesup-sub {
  color: rgba(255,255,255,0.8);
  font-size: clamp(18px, 3vh, 26px);
  font-weight: 300;
  text-shadow: 0 1px 10px rgba(0,0,0,0.9);
}

/* Gratitude timesup: sub question appears after the framework cards */
#screen-timesup.gratitude-mode .timesup-sub    { order: 3; }
#screen-timesup.gratitude-mode #framework-zone { order: 2; }

.timesup-prompt {
  color: rgba(255,255,255,0.55);
  font-size: clamp(13px, 2.1vh, 18px);
  line-height: 1.5;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  margin-top: clamp(4px, 1vh, 10px);
}

.timesup-quote-text {
  display: block;
  font-style: italic;
  color: rgba(255,255,255,0.78);
  font-size: clamp(14px, 2.3vh, 20px);
  font-weight: 300;
  line-height: 1.6;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}

.timesup-quote-attr {
  display: block;
  margin-top: clamp(10px, 1.8vh, 16px);
  color: rgba(255,255,255,0.35);
  font-size: clamp(11px, 1.7vh, 15px);
  font-weight: 400;
  font-style: normal;
  letter-spacing: 0.06em;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
}

.timesup-actions {
  position: absolute;
  bottom: calc(max(42px, 6.5%) + env(safe-area-inset-bottom, 0px));
  left: max(20px, 5%);
  right: max(20px, 5%);
  display: flex;
  align-items: stretch;
  gap: clamp(8px, 1.5vw, 12px);
}

.timesup-action-btn {
  flex: 1;
  min-width: 0;
  font-size: clamp(13px, 2.1vh, 17px);
  padding: clamp(12px, 2.2vh, 18px) 8px;
  border-radius: 30px;
  cursor: pointer;
  letter-spacing: 0.02em;
  user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  text-align: center;
}

.timesup-primary-btn {
  background: rgba(0,0,0,0.35);
  border: 1.5px solid rgba(255,255,255,0.45);
  color: white;
  font-weight: 500;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.timesup-menu-btn {
  background: rgba(255,255,255,0.12);
  border: 1.5px solid rgba(255,255,255,0.35);
  color: rgba(255,255,255,0.85);
  font-weight: 400;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

/* ============================================================
   PREP TOGGLE (on intro screen)
   ============================================================ */

.prep-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.prep-toggle input[type=checkbox] {
  display: none;
}

.prep-toggle-track {
  position: relative;
  width: 44px;
  height: 26px;
  background: rgba(255,255,255,0.2);
  border-radius: 13px;
  flex-shrink: 0;
  transition: background 0.2s ease;
}

.prep-toggle input:checked ~ .prep-toggle-track {
  background: #22c55e;
}

.prep-toggle-thumb {
  position: absolute;
  width: 20px;
  height: 20px;
  background: white;
  border-radius: 50%;
  top: 3px;
  left: 3px;
  transition: transform 0.2s ease;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

.prep-toggle input:checked ~ .prep-toggle-track .prep-toggle-thumb {
  transform: translateX(18px);
}

.prep-toggle-label {
  color: rgba(255,255,255,0.75);
  font-size: clamp(13px, 2.1vh, 17px);
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
}

/* ============================================================
   SCREEN -PREP TIME
   ============================================================ */

.prep-timer-outer {
  position: absolute;
  bottom: calc(max(20px, 3%) + env(safe-area-inset-bottom, 0px));
  left: max(20px, 5%);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: clamp(8px, 1.5vw, 14px);
}

.prep-timer-num-stack {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}

.prep-timer-label {
  color: white;
  font-size: clamp(12px, 2vh, 16px);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
}

.prep-top-right {
  position: absolute;
  top: max(28px, 5%);
  right: max(18px, 4%);
  display: flex;
  align-items: center;
  gap: clamp(14px, 2.5vw, 22px);
  z-index: 10;
}

.prep-skip-btn,
.help-btn {
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================
   HELP OVERLAY
   ============================================================ */

.help-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(20px, 5%, 36px);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
}

.help-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.help-box {
  background: rgba(18,18,18,0.97);
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: clamp(12px, 2vh, 18px);
  padding: clamp(18px, 3.5%, 28px);
  width: 100%;
  max-height: 72%;
  overflow-y: auto;
  scrollbar-width: none;
}

.help-box::-webkit-scrollbar { display: none; }

.help-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: clamp(12px, 2vh, 18px);
}

.help-title {
  color: white;
  font-size: clamp(15px, 2.4vh, 20px);
  font-weight: 600;
  text-shadow: none;
}

.help-close-btn {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  flex-shrink: 0;
  margin-left: clamp(10px, 2%, 16px);
  display: flex;
  align-items: center;
}

.help-close-btn svg {
  width: clamp(16px, 2.6vh, 20px);
  height: clamp(16px, 2.6vh, 20px);
  display: block;
}

.help-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 1.8vh, 15px);
}

.help-list li {
  color: rgba(255,255,255,0.82);
  font-size: clamp(12px, 2vh, 16px);
  line-height: 1.5;
  padding-left: 1.1em;
  position: relative;
}

.help-list li::before {
  content: '-';
  position: absolute;
  left: 0;
  color: rgba(255,255,255,0.3);
}

.help-list li strong {
  color: white;
  font-weight: 600;
}

.help-section-heading {
  color: rgba(255,255,255,0.38) !important;
  font-size: clamp(10px, 1.5vh, 12px) !important;
  font-weight: 700 !important;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding-left: 0 !important;
  margin-top: clamp(10px, 1.8vh, 16px);
}

.help-section-heading:first-child {
  margin-top: 0;
}

.help-section-heading::before {
  content: none !important;
}

/* ============================================================
   FRAMEWORK SYSTEM
   ============================================================ */

/* Framework pill on intro screen — top row of right group */
#framework-pill-wrap {
}

.framework-pill-btn {
  background: rgba(0,0,0,0.3);
  border: 1.5px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  color: rgba(255,255,255,0.7);
  font-size: clamp(11px, 1.8vh, 14px);
  font-weight: 500;
  padding: 6px 14px;
  cursor: pointer;
  white-space: nowrap;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.framework-pill-btn.selected {
  background: rgba(234,179,8,0.18);
  border-color: rgba(234,179,8,0.6);
  color: #fcd34d;
}

/* Framework picker bottom sheet */
.framework-picker-overlay {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: flex-end;
}

.framework-picker-overlay.visible {
  display: flex;
}

.framework-picker-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
}

.framework-picker-sheet {
  position: relative;
  width: 100%;
  background: rgba(20,20,24,0.97);
  border-radius: 18px 18px 0 0;
  padding: clamp(16px, 3vh, 24px) clamp(16px, 5%, 24px) clamp(20px, 4vh, 32px);
  max-height: 75%;
  overflow-y: auto;
  -ms-overflow-style: none;
  scrollbar-width: none;
}

.framework-picker-sheet::-webkit-scrollbar { display: none; }

.framework-picker-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: clamp(12px, 2.2vh, 20px);
}

.framework-picker-title {
  color: white;
  font-size: clamp(14px, 2.2vh, 18px);
  font-weight: 600;
}

.framework-picker-close {
  background: none;
  border: none;
  padding: 4px;
  cursor: pointer;
  opacity: 0.6;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.framework-picker-close svg {
  display: block;
  width: 20px;
  height: 20px;
}

.framework-picker-list {
  display: flex;
  flex-direction: column;
  gap: clamp(6px, 1.2vh, 10px);
}

.framework-picker-item {
  padding: clamp(10px, 1.8vh, 14px) clamp(12px, 2.2vw, 16px);
  border-radius: 12px;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.1);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, border-color 0.15s;
}

.framework-picker-item.active {
  background: rgba(234,179,8,0.15);
  border-color: rgba(234,179,8,0.45);
}

.framework-picker-name {
  display: block;
  color: white;
  font-size: clamp(13px, 2vh, 16px);
  font-weight: 600;
  margin-bottom: 3px;
}

.framework-picker-desc {
  display: block;
  color: rgba(255,255,255,0.5);
  font-size: clamp(11px, 1.7vh, 13px);
  line-height: 1.4;
}

/* In-challenge framework overlay (tappable boxes) */
.framework-active-wrap {
  position: absolute;
  top: clamp(130px, 22%, 175px);
  left: max(16px, 4%);
  right: max(16px, 4%);
  display: flex;
  flex-direction: column;
  gap: clamp(5px, 1vh, 8px);
  touch-action: manipulation;
}

.framework-guidance-label {
  color: rgba(255,255,255,0.85);
  font-size: clamp(9px, 1.4vh, 11px);
  font-weight: 600;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  text-shadow: 0 1px 4px rgba(0,0,0,0.9);
}

/* Prep screen framework preview — non-interactive, flows below prompt in flex column */
#framework-prep-wrap {
  position: relative;
  padding: 0 max(16px, 4%);
  flex-direction: column;
  gap: clamp(5px, 1vh, 8px);
  pointer-events: none;
  opacity: 0.72;
  margin-top: clamp(10px, 1.8vh, 16px);
}

/* Topic/story word highlight — yellow, used inside prompt-text and fwk-overlay-prompt */
.topic-highlight {
  color: #fcd34d;
}

/* Instructional sentence prompts — one consistent size used across all challenges */
.prompt-text {
  color: white;
  font-size: clamp(18px, 3vh, 26px);
  font-weight: 400;
  line-height: 1.4;
  text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
}

.fwk-boxes-row {
  display: flex;
  flex-wrap: wrap;
  gap: clamp(5px, 1vw, 8px);
}

.fwk-box {
  flex: 1 1 auto;
  min-width: 52px;
  min-height: clamp(44px, 7.5vh, 60px);
  background: rgba(0,0,0,0.35);
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 4px 6px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: background 0.15s, border-color 0.15s, opacity 0.15s;
}

/* Parallel mode: tapped */
.fwk-box.tapped {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.4);
}

.fwk-box-emoji {
  font-size: clamp(14px, 2.4vh, 20px);
  line-height: 1;
}

.fwk-box-label {
  color: rgba(255,255,255,0.85);
  font-size: clamp(10px, 1.7vh, 13px);
  font-weight: 600;
  text-align: center;
  line-height: 1.2;
}

.fwk-box-label:empty,
.fwk-ct-label:empty { display: none; }

.fwk-box.tapped .fwk-box-label {
  color: white;
}

/* Per-step hint text — visible only on prep screen */
.fwk-box-hint {
  color: rgba(255,255,255,0.55);
  font-size: clamp(8px, 1.2vh, 10px);
  font-weight: 400;
  text-align: center;
  line-height: 1.3;
  padding: 0 2px;
  margin-top: 1px;
  display: none;
}

#framework-prep-wrap .fwk-box-hint {
  display: block;
  color: rgba(255,255,255,0.5);
}

/* Sequential mode: overlay starts higher since header lives inside it */
#screen-active.has-seq-framework .framework-active-wrap {
  top: max(70px, 12%);
}

/* Counter / parallel mode: overlay starts higher to make room for prompt inside */
#screen-active.has-counter-framework .framework-active-wrap,
#screen-active.has-parallel-framework .framework-active-wrap {
  top: max(70px, 12%);
}

/* Prompt rendered inside framework overlay (counter + parallel modes) */
.fwk-overlay-prompt {
  color: white;
  font-size: clamp(18px, 3vh, 26px);
  font-weight: 400;
  line-height: 1.4;
  text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
  margin-bottom: clamp(6px, 1.2vh, 10px);
}

/* Sequential mode: numbered list layout */
.fwk-seq-header {
  font-size: clamp(9px, 1.4vh, 12px);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.65);
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  text-align: center;
  line-height: 1.3;
}

.fwk-seq-list {
  display: flex;
  flex-direction: column;
  width: 100%;
}

.fwk-seq-item {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.4vw, 12px);
  padding: clamp(5px, 0.9vh, 8px) 0;
  max-height: 150px;
  overflow: hidden;
  transition: opacity 0.3s ease, max-height 0.35s ease, padding 0.35s ease;
}

.fwk-seq-item.seq-done {
  opacity: 0;
  max-height: 0;
  padding: 0;
}

.fwk-seq-item-text {
  flex: 1;
  line-height: 1.35;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}

.fwk-seq-item.seq-active .fwk-seq-item-text {
  color: white;
  font-size: clamp(19px, 3.3vh, 27px);
  font-weight: 700;
}

.fwk-seq-item.seq-upcoming .fwk-seq-item-text {
  color: rgba(255,255,255,0.45);
  font-size: clamp(12px, 2vh, 16px);
  font-weight: 400;
}

#framework-prep-wrap .fwk-seq-item.seq-upcoming .fwk-seq-item-text {
  color: rgba(255,255,255,0.9);
  font-size: clamp(12px, 2vh, 16px);
  font-weight: 500;
}

.fwk-seq-inline-btn {
  flex-shrink: 0;
  background: none;
  border: none;
  color: white;
  font-size: clamp(24px, 4.2vh, 34px);
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  padding: 2px 8px;
  line-height: 1;
  text-shadow: 0 2px 10px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
}

.fwk-seq-inline-btn:active {
  opacity: 0.7;
}

/* Counter result sentence */
.fwk-counter-sentence {
  color: rgba(255,255,255,0.75);
  font-size: clamp(14px, 2.4vh, 19px);
  font-weight: 400;
  text-align: center;
  line-height: 1.6;
}

.fwk-counter-sentence-num {
  color: #fcd34d;
  font-size: clamp(30px, 5.2vh, 44px);
  font-weight: 700;
  line-height: 1;
  display: inline-block;
  vertical-align: middle;
  margin: 0 3px;
}

/* Counter mode */
.fwk-counter-btn {
  width: 100%;
  min-height: clamp(44px, 7.5vh, 60px);
  background: rgba(0,0,0,0.35);
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 1.5vw, 12px);
  padding: 10px 14px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: background 0.1s;
}

.fwk-counter-btn:active,
.fwk-counter-btn.fwk-counter-bump {
  background: rgba(234,179,8,0.22);
  border-color: rgba(234,179,8,0.7);
}

.fwk-counter-label {
  color: rgba(255,255,255,0.7);
  font-size: clamp(11px, 1.8vh, 14px);
  font-weight: 500;
}

.fwk-counter-num {
  color: white;
  font-size: clamp(18px, 3.2vh, 28px);
  font-weight: 700;
  min-width: 1.5em;
  text-align: center;
}

/* Times-up: framework zone */
.framework-zone {
  width: 100%;
  margin-bottom: clamp(6px, 1.1vh, 10px);
}

/* Time-distribution: color bar */
.fwk-dist-bar {
  height: clamp(26px, 4.4vh, 36px);
  width: 100%;
  display: flex;
  border-radius: 6px;
  overflow: hidden;
  gap: 2px;
}

.fwk-dist-seg {
  height: 100%;
  min-width: 2px;
  transition: width 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* Time-distribution: legend below bar — inline items wrap naturally */
.fwk-dist-legend {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  row-gap: clamp(6px, 1vh, 10px);
  column-gap: clamp(16px, 3.4vw, 24px);
  width: 100%;
  margin-top: clamp(6px, 1vh, 8px);
}

.fwk-dist-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.fwk-dist-legend-swatch {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  flex-shrink: 0;
}

.fwk-dist-legend-label {
  color: rgba(255,255,255,0.75);
  font-size: clamp(11px, 1.8vh, 14px);
  font-weight: 500;
}

.fwk-dist-legend-time {
  color: rgba(255,255,255,0.45);
  font-size: clamp(10px, 1.6vh, 13px);
  font-variant-numeric: tabular-nums;
}

.fwk-dist-legend-item.unreached .fwk-dist-legend-label,
.fwk-dist-legend-item.unreached .fwk-dist-legend-time {
  color: rgba(255,255,255,0.2);
}

/* Completion-timed mode: label + check + elapsed time per element */
.fwk-ct-row {
  display: flex;
  gap: clamp(6px, 1.2vw, 10px);
  width: 100%;
  margin-bottom: clamp(2px, 0.5vh, 6px);
}

.fwk-ct-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: clamp(6px, 1vh, 9px) 4px;
  border-radius: 10px;
  background: rgba(239,68,68,0.08);
  border: 1.5px solid rgba(239,68,68,0.28);
}

.fwk-ct-item.tapped {
  background: rgba(234,179,8,0.12);
  border-color: rgba(234,179,8,0.35);
}

.fwk-ct-item.partial {
  background: rgba(255,255,255,0.09);
  border-color: rgba(255,255,255,0.22);
}

.fwk-ct-emoji {
  font-size: clamp(14px, 2.4vh, 20px);
  line-height: 1;
}

.fwk-ct-label {
  color: rgba(255,255,255,0.5);
  font-size: clamp(9px, 1.4vh, 11px);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.fwk-ct-item.tapped .fwk-ct-label {
  color: rgba(255,255,255,0.65);
}

.fwk-ct-item.partial .fwk-ct-label {
  color: rgba(255,255,255,0.72);
}

.fwk-ct-check {
  font-size: clamp(20px, 3.4vh, 28px);
  font-weight: 700;
  line-height: 1;
  color: rgba(239,68,68,0.7);
}

.fwk-ct-item.tapped .fwk-ct-check {
  color: #fcd34d;
}

.fwk-ct-item.partial .fwk-ct-check {
  color: rgba(255,255,255,0.82);
}

.fwk-ct-time {
  color: rgba(255,255,255,0.65);
  font-size: clamp(10px, 1.6vh, 13px);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* Completion mode (e.g. gratitude) */
.fwk-completion-row {
  display: flex;
  gap: clamp(6px, 1.2vw, 10px);
  width: 100%;
  margin-bottom: clamp(2px, 0.5vh, 6px);
}

.fwk-completion-box {
  flex: 1;
  padding: clamp(6px, 1vh, 9px) 6px;
  border-radius: 10px;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: rgba(255,255,255,0.3);
  font-size: clamp(10px, 1.7vh, 13px);
  font-weight: 500;
}

.fwk-completion-box span:first-child {
  font-size: clamp(16px, 2.8vh, 24px);
}

.fwk-completion-box.tapped {
  background: rgba(234,179,8,0.15);
  border-color: rgba(234,179,8,0.45);
  color: white;
}

/* Counter result */
.fwk-counter-result {
  display: flex;
  align-items: baseline;
  gap: clamp(6px, 1.2vw, 10px);
  margin-bottom: clamp(6px, 1.2vh, 10px);
}

.fwk-counter-result-num {
  color: #fcd34d;
  font-size: clamp(28px, 5vh, 42px);
  font-weight: 700;
  line-height: 1;
}

.fwk-counter-result-label {
  color: rgba(255,255,255,0.7);
  font-size: clamp(13px, 2.2vh, 18px);
  font-weight: 500;
}

/* Challenge ratings section */
.challenge-ratings {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: clamp(6px, 1vh, 10px);
  margin-top: clamp(-10px, -1.4vh, -6px);
}

.prep-plus-btn {
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  color: white;
  font-size: clamp(15px, 2.5vh, 21px);
  font-weight: 700;
  line-height: 1;
  padding: 0;
  cursor: pointer;
  user-select: none;
  text-shadow: 0 1px 10px rgba(0,0,0,0.95);
}

.ready-set-go {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s ease;
}

.ready-set-go.visible {
  opacity: 1;
}

.ready-set-go-text {
  color: white;
  font-size: clamp(22px, 4vh, 34px);
  font-weight: 700;
  letter-spacing: 0.01em;
  text-shadow: 0 2px 16px rgba(0,0,0,0.95);
}

.ready-set-go-text.go {
  color: #22c55e;
}

/* ============================================================
   CONFIRM MODAL
   ============================================================ */

.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.62);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.modal-overlay.visible {
  opacity: 1;
  pointer-events: all;
}

.modal-box {
  background: rgba(18,18,18,0.96);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  padding: clamp(24px, 5%, 40px) clamp(20px, 6%, 40px);
  width: 76%;
  text-align: center;
}

.modal-box p {
  color: white;
  font-size: clamp(15px, 2.6vh, 21px);
  font-weight: 300;
  line-height: 1.4;
  margin-bottom: clamp(18px, 3.5vh, 28px);
}

.modal-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.modal-quit {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.6);
  font-size: clamp(13px, 2.2vh, 18px);
  padding: clamp(8px, 1.5vh, 12px) clamp(18px, 5%, 28px);
  border-radius: 10px;
  cursor: pointer;
}

.modal-keep {
  background: #22c55e;
  border: none;
  color: white;
  font-size: clamp(13px, 2.2vh, 18px);
  font-weight: 600;
  padding: clamp(8px, 1.5vh, 12px) clamp(18px, 5%, 28px);
  border-radius: 10px;
  cursor: pointer;
}

/* ============================================================
   TAKE COUNTER
   ============================================================ */

.take-counter-display {
  position: absolute;
  bottom: calc(max(14px, 2%) + env(safe-area-inset-bottom, 0px));
  left: 0;
  right: 0;
  padding: 0 clamp(60px, 14%, 80px);
  text-align: center;
  color: white;
  font-size: clamp(11px, 1.8vh, 14px);
  font-weight: 400;
  opacity: 0.17;
  letter-spacing: 0.03em;
  pointer-events: none;
  z-index: 8;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  display: none;
}

.take-counter-sheet-overlay {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: none;
  align-items: flex-end;
}

.take-counter-sheet-overlay.visible { display: flex; }

.take-counter-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
}

.take-counter-sheet {
  position: relative;
  width: 100%;
  background: rgba(20,20,24,0.97);
  border-radius: 18px 18px 0 0;
  padding: clamp(16px, 3vh, 24px) clamp(16px, 5%, 24px) clamp(20px, 4vh, 32px);
}

.take-counter-sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: clamp(14px, 2.5vh, 22px);
}

.take-counter-sheet-title {
  color: white;
  font-size: clamp(14px, 2.2vh, 18px);
  font-weight: 600;
}

.take-counter-input-wrap {
  position: relative;
  margin-bottom: clamp(10px, 1.8vh, 14px);
}

.take-counter-input {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border: 1.5px solid rgba(255,255,255,0.18);
  border-radius: 10px;
  color: white;
  font-size: clamp(14px, 2.2vh, 18px);
  padding: clamp(10px, 1.8vh, 14px) 40px clamp(10px, 1.8vh, 14px) clamp(12px, 2vw, 16px);
  outline: none;
  box-sizing: border-box;
  -webkit-appearance: none;
  font-family: inherit;
}

.take-counter-input::placeholder {
  color: rgba(255,255,255,0.3);
}

.take-counter-input:focus {
  border-color: rgba(255,255,255,0.35);
}

.take-counter-clear-btn {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: rgba(255,255,255,0.35);
  padding: 6px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.take-counter-clear-btn svg {
  display: block;
  width: 14px;
  height: 14px;
}

.take-counter-links {
  display: flex;
  gap: clamp(16px, 3vw, 24px);
  margin-bottom: clamp(16px, 3vh, 24px);
}

.take-counter-link {
  background: none;
  border: none;
  color: rgba(255,255,255,0.4);
  font-size: clamp(12px, 1.9vh, 14px);
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
  text-decoration: underline;
  text-decoration-color: rgba(255,255,255,0.2);
}

.take-counter-n-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: clamp(14px, 2.5vh, 20px);
}

.take-counter-n-label {
  color: rgba(255,255,255,0.5);
  font-size: clamp(13px, 2vh, 16px);
}

.take-counter-n-input {
  width: 72px;
  background: rgba(255,255,255,0.08);
  border: 1.5px solid rgba(255,255,255,0.18);
  border-radius: 8px;
  color: white;
  font-size: clamp(14px, 2.2vh, 18px);
  font-family: inherit;
  text-align: center;
  padding: clamp(6px, 1.2vh, 10px) 8px;
  outline: none;
  -webkit-appearance: none;
  -moz-appearance: textfield;
}

.take-counter-n-input::-webkit-inner-spin-button,
.take-counter-n-input::-webkit-outer-spin-button { opacity: 0.4; }

.take-counter-n-input:focus {
  border-color: rgba(255,255,255,0.35);
}

.take-counter-done-btn {
  width: 100%;
  background: rgba(255,255,255,0.1);
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 30px;
  color: white;
  font-size: clamp(14px, 2.2vh, 18px);
  font-weight: 500;
  padding: clamp(11px, 2vh, 16px) 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}

/* Pencil icon button — same base style as help-btn */
.take-counter-btn,
.custom-prompt-btn {
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.take-counter-btn svg,
.custom-prompt-btn svg {
  display: block;
  width: clamp(18px, 3vh, 23px);
  height: clamp(18px, 3vh, 23px);
  filter: drop-shadow(0 1px 8px rgba(0,0,0,0.9));
}

.custom-prompt-btn {
  display: none;
}

.custom-prompt-overlay {
  z-index: 108;
}

.custom-prompt-panel {
  position: relative;
  width: min(84%, 440px);
  background: rgba(16,16,20,0.97);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 18px;
  padding: clamp(18px, 4.2%, 24px);
  color: white;
  box-shadow: 0 18px 46px rgba(0,0,0,0.42);
}

.custom-prompt-close {
  position: absolute;
  top: 10px;
  right: 10px;
  background: none;
  border: none;
  color: rgba(255,255,255,0.6);
  padding: 6px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
}

.custom-prompt-close svg {
  width: 16px;
  height: 16px;
  display: block;
}

.custom-prompt-title {
  font-size: clamp(15px, 2.4vh, 20px);
  font-weight: 700;
  margin-bottom: 8px;
}

.custom-prompt-helper {
  color: rgba(255,255,255,0.76);
  font-size: clamp(12px, 1.95vh, 15px);
  line-height: 1.4;
  margin-bottom: 14px;
  padding-right: 20px;
}

.custom-prompt-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.custom-prompt-input {
  width: 100%;
  min-height: 92px;
  background: rgba(255,255,255,0.08);
  border: 1.5px solid rgba(255,255,255,0.18);
  border-radius: 12px;
  color: white;
  font-size: clamp(14px, 2.15vh, 17px);
  line-height: 1.35;
  padding: 12px 14px;
  box-sizing: border-box;
  resize: none;
  outline: none;
  -webkit-appearance: none;
  font-family: inherit;
}

.custom-prompt-input::placeholder {
  color: rgba(255,255,255,0.28);
}

.custom-prompt-input:focus {
  border-color: rgba(255,255,255,0.34);
}

.custom-prompt-actions {
  display: flex;
  justify-content: flex-end;
}

.custom-prompt-go {
  background: rgba(255,255,255,0.12);
  border: 1.5px solid rgba(255,255,255,0.32);
  color: white;
  font-size: clamp(13px, 2vh, 16px);
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 999px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* ============================================================
   VISIBILITY TOGGLE
   ============================================================ */

.vis-toggle-btn {
  position: absolute;
  right: max(22px, 4%);
  bottom: calc(max(130px, 20%) + env(safe-area-inset-bottom, 0px));
  z-index: 12;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  opacity: 0.13;
  /* Tall tap target extends downward */
  display: flex;
  align-items: flex-start;
  justify-content: center;
  width: 44px;
  min-height: 80px;
  padding-top: 4px;
}

.vis-toggle-btn svg {
  display: block;
  width: 10px;
  height: 10px;
  flex-shrink: 0;
}

#ui-restore-overlay {
  position: absolute;
  inset: 0;
  z-index: 110;
  display: none;
}

#creator-marker-layer {
  position: absolute;
  inset: 0;
  z-index: 115;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

.creator-marker {
  position: absolute;
  left: 50%;
  width: min(92%, 520px);
  transform: translateX(-50%);
  border-radius: 18px;
  padding: 14px 16px 15px;
  color: #fff;
  opacity: 0;
  transition: opacity 0.18s ease, transform 0.18s ease;
  box-shadow: 0 10px 32px rgba(0,0,0,0.45);
  backdrop-filter: blur(10px);
}

.creator-marker.visible {
  opacity: 1;
}

.creator-marker-head {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  margin-bottom: 8px;
}

.creator-marker-time {
  font-size: 13px;
  font-weight: 700;
  opacity: 0.96;
}

.creator-marker-title {
  font-size: clamp(22px, 3.7vh, 30px);
  font-weight: 900;
  line-height: 1.02;
  letter-spacing: -0.03em;
  margin-bottom: 8px;
  text-shadow: 0 2px 12px rgba(0,0,0,0.35);
}

.creator-marker-lines {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.creator-marker-line {
  font-size: clamp(13px, 2vh, 16px);
  font-weight: 700;
  line-height: 1.2;
  opacity: 0.98;
  text-shadow: 0 1px 8px rgba(0,0,0,0.3);
}

.creator-marker-line strong {
  font-weight: 900;
}

#creator-auto-marker {
  top: 50%;
  background:
    linear-gradient(180deg, rgba(207, 255, 74, 0.96), rgba(139, 244, 61, 0.94));
  color: #102000;
  border: 3px solid rgba(255,255,255,0.92);
  transform: translateX(-50%) translateY(10px);
}

#creator-auto-marker.visible {
  transform: translateX(-50%) translateY(0);
}

#creator-auto-marker .creator-marker-title,
#creator-auto-marker .creator-marker-line {
  text-shadow: none;
}

#creator-note-marker {
  top: 50%;
  background:
    linear-gradient(180deg, rgba(255, 111, 0, 0.96), rgba(255, 59, 48, 0.94));
  border: 3px solid rgba(255, 245, 157, 0.98);
  transform: translateX(-50%) scale(0.98);
  animation: creatorNotePulse 1.4s ease-in-out infinite;
}

#creator-note-marker.visible {
  transform: translateX(-50%) scale(1);
}

@keyframes creatorNotePulse {
  0%, 100% { box-shadow: 0 10px 32px rgba(0,0,0,0.45), 0 0 0 0 rgba(255, 245, 157, 0.42); }
  50%      { box-shadow: 0 10px 32px rgba(0,0,0,0.45), 0 0 0 10px rgba(255, 245, 157, 0); }
}

/* UI hidden state */
#app.ui-hidden .screen,
#app.ui-hidden .modal-overlay,
#app.ui-hidden .framework-picker-overlay,
#app.ui-hidden .help-overlay,
#app.ui-hidden .take-counter-sheet-overlay,
#app.ui-hidden .take-counter-display,
#app.ui-hidden .vis-toggle-btn {
  opacity: 0 !important;
  pointer-events: none !important;
}

/* Slide animations — applied to children so screen background stays put */
.ui-slide-out > * {
  transform: translateX(-110%) !important;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1) !important;
}

@keyframes slideInFromLeft {
  from { transform: translateX(-110%); }
  to   { transform: translateX(0); }
}

.ui-slide-in > * {
  animation: slideInFromLeft 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
}

</style>
</head>
<body>
<div class="app" id="app">

  <!-- Camera (shared background for screens 2–4) -->
  <video id="camera" autoplay muted playsinline></video>

  <!-- ── SCREEN 1: Challenge Selection ── -->
  <div class="screen active" id="screen-select">
    <div class="select-inner">
      <h1 class="select-title">Choose a challenge</h1>
      <div class="challenge-options">
        <button class="challenge-btn" id="btn-story">📖 Storytelling</button>
        <button class="challenge-btn" id="btn-topic">🎲 Random Topic</button>
        <button class="challenge-btn" id="btn-selfknowledge">🪞 Self-Knowledge</button>
        <button class="challenge-btn" id="btn-interview">💼 Interview Practice</button>
        <button class="challenge-btn" id="btn-gratitude">🙏 Gratitude</button>
        <button class="challenge-btn" id="btn-articulation">🎙️ Articulation</button>
        <button class="challenge-btn" id="btn-articulation2">📜 Articulation</button>
      </div>
    </div>
  </div>

  <!-- ── SCREEN 2: Challenge Intro ── -->
  <div class="screen" id="screen-intro">
    <button class="back-btn" id="intro-back"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <p class="intro-label" id="intro-label"></p>
    <div class="prep-top-right">
      <button class="take-counter-btn" id="take-counter-btn"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
      <button class="custom-prompt-btn" id="custom-prompt-btn" style="display:none;"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
      <button class="help-btn" id="intro-help"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
    </div>
    <div class="intro-inner">
      <p class="intro-desc" id="intro-desc"></p>
    </div>
    <div id="intro-bottom-row">
      <div class="go-circle" id="go-btn">GO</div>
      <div id="intro-right-group">
        <div id="prompt-type-pill-wrap" style="display:none;">
          <button class="framework-pill-btn" id="prompt-type-pill-btn">Add prompt type</button>
        </div>
        <div id="framework-pill-wrap" style="display:none;">
          <button class="framework-pill-btn" id="framework-pill-btn">Add framework</button>
        </div>
        <label class="prep-toggle" id="prep-toggle-wrap" style="display:none;">
          <input type="checkbox" id="prep-toggle-input">
          <span class="prep-toggle-track">
            <span class="prep-toggle-thumb"></span>
          </span>
          <span class="prep-toggle-label">Add prep time</span>
        </label>
      </div>
    </div>
  </div>

  <div class="modal-overlay custom-prompt-overlay" id="custom-prompt-overlay">
    <div class="modal-box custom-prompt-panel">
      <button class="custom-prompt-close" id="custom-prompt-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <div class="custom-prompt-title">Custom Prompt</div>
      <div class="custom-prompt-helper">Enter a custom prompt and start the challenge with your current settings</div>
      <form class="custom-prompt-form" id="custom-prompt-form">
        <textarea class="custom-prompt-input" id="custom-prompt-input" placeholder="Type your prompt here"></textarea>
        <div class="custom-prompt-actions">
          <button class="custom-prompt-go" id="custom-prompt-go" type="submit">Go</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── SCREEN 2b: Prep Time ── -->
  <div class="screen" id="screen-prep">
    <button class="back-btn" id="prep-back"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="prep-top-right">
      <button class="reroll-btn" id="prep-reroll"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
      <button class="help-btn" id="prep-help"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
      <button class="prep-plus-btn" id="prep-plus">+10</button>
      <button class="prep-skip-btn" id="prep-skip"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 6 11 12 5 18"/><polyline points="13 6 19 12 13 18"/></svg></button>
    </div>

    <p class="prompt-label" id="prep-prompt-label"></p>
    <div class="prompt-area">
      <div id="prep-prompt-display"></div>
    </div>

    <div id="framework-prep-wrap" style="display:none;"></div>

    <div class="prep-timer-outer">
      <svg id="prep-timer-svg" viewBox="0 0 100 100" width="84" height="84">
        <path id="prep-timer-pie" fill="white" d=""/>
      </svg>
      <div class="prep-timer-num-stack">
        <span class="prep-timer-label">Prep</span>
        <span class="timer-num" id="prep-timer-num"></span>
      </div>
    </div>
    <div class="ready-set-go" id="ready-set-go-overlay">
      <span class="ready-set-go-text" id="ready-set-go-text"></span>
    </div>
  </div>

  <!-- ── SCREEN 3: Active Challenge ── -->
  <div class="screen" id="screen-active">
    <button class="back-btn" id="active-back"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>

    <div class="prep-top-right">
      <button class="reroll-btn" id="reroll-btn"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
      <button class="help-btn" id="active-help"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
      <button class="prep-skip-btn" id="active-skip"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 6 11 12 5 18"/><polyline points="13 6 19 12 13 18"/></svg></button>
    </div>

    <p class="prompt-label" id="prompt-label"></p>
    <div class="prompt-area">
      <div id="prompt-display"></div>
    </div>

    <div class="timer-wrap">
      <svg id="timer-svg" viewBox="0 0 100 100" width="84" height="84">
        <path id="timer-pie" fill="white" d=""/>
      </svg>
      <span class="timer-num" id="timer-num"></span>
    </div>

    <div id="framework-active-wrap" class="framework-active-wrap" style="display:none;"></div>

  </div>

  <!-- ── SCREEN 4: Time's Up ── -->
  <div class="screen" id="screen-timesup">
    <div class="prep-top-right">
      <button class="help-btn" id="timesup-help"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></button>
    </div>
    <div class="timesup-inner">
      <h2 class="timesup-title">Time's up!</h2>
      <p class="timesup-sub" style="display:none;"></p>
      <p class="timesup-completion" id="timesup-completion"></p>
      <p class="timesup-prompt" id="timesup-prompt"></p>
      <div id="framework-zone" class="framework-zone" style="display:none;"></div>
      <div id="challenge-ratings" class="challenge-ratings" style="display:none;"></div>

      <div class="art2-score-section" id="art2-score-section">
        <div class="art2-metric-row">
          <span class="art2-metric-label">Progress</span>
          <div class="art2-progress-outer" id="art2-progress-outer">
            <div class="art2-progress-fill" id="art2-progress-fill"></div>
            <span class="art2-progress-pct" id="art2-progress-pct"></span>
          </div>
        </div>
        <div class="art2-metric-row">
          <span class="art2-metric-label">Accuracy</span>
          <div class="art2-stars" id="art2-stars-accuracy"></div>
        </div>
        <div class="art2-metric-row">
          <span class="art2-metric-label">Flow</span>
          <div class="art2-stars" id="art2-stars-flow"></div>
        </div>
      </div>
    </div>
    <div class="timesup-actions">
      <button class="timesup-action-btn timesup-primary-btn" id="same-prompt-btn">Same Prompt</button>
      <button class="timesup-action-btn timesup-primary-btn" id="new-prompt-btn">New Prompt</button>
      <button class="timesup-action-btn timesup-menu-btn" id="menu-btn">Main Menu</button>
    </div>
  </div>

  <!-- ── Abandon Confirm Modal ── -->
  <div class="modal-overlay" id="modal-confirm">
    <div class="modal-box">
      <p>Abandon this challenge?<br>Your progress will be lost.</p>
      <div class="modal-actions">
        <button class="modal-quit" id="confirm-quit">Quit</button>
        <button class="modal-keep" id="confirm-keep">Keep going</button>
      </div>
    </div>
  </div>

  <!-- ── Framework Picker ── -->
  <div class="framework-picker-overlay" id="framework-picker">
    <div class="framework-picker-backdrop" id="framework-picker-backdrop"></div>
    <div class="framework-picker-sheet">
      <div class="framework-picker-header">
        <span class="framework-picker-title">Choose a framework</span>
        <button class="framework-picker-close" id="framework-picker-close"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="framework-picker-list" id="framework-picker-list"></div>
    </div>
  </div>

  <!-- ── Prompt Type Picker ── -->
  <div class="framework-picker-overlay" id="prompt-type-picker">
    <div class="framework-picker-backdrop" id="prompt-type-picker-backdrop"></div>
    <div class="framework-picker-sheet">
      <div class="framework-picker-header">
        <span class="framework-picker-title">Choose a prompt type</span>
        <button class="framework-picker-close" id="prompt-type-picker-close"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="framework-picker-list" id="prompt-type-picker-list"></div>
    </div>
  </div>

  <!-- ── Help Overlay ── -->
  <div class="help-overlay" id="help-overlay">
    <div class="help-box">
