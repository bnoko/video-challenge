function launchChallenge() {
  if (currentChallenge === 'story') {
    // Pick prompt content based on selected prompt type
    if (currentPromptType?.id === '3-words') {
      const words = pickRandom(WORDS, 3);
      currentStoryWords = words;
      usedPromptText    = words.join(', ');
    } else if (currentPromptType?.id === 'basic-plot') {
      const plot = pickRandom(PLOTS, 1)[0];
      currentPlotText = plot;
      usedPromptText  = plot;
    } else {
      usedPromptText = '';
    }

    document.getElementById('prompt-label').textContent = '';
    document.getElementById('prompt-display').innerHTML =
      `<p class="prompt-text">${getEffectivePromptHTML()}</p>`;
    timerTotal = getEffectiveTime('story');

    if (prepTimeEnabled && challengeSupportsPrep() && !currentFramework?.disablePrepTime) {
      document.getElementById('prep-prompt-label').textContent = '';
      document.getElementById('prep-prompt-display').innerHTML =
        `<p class="prompt-text">${getPrepDescHTML()}</p>`;
      showScreen('screen-prep');
      startPrepTimer();
      return;
    }

    startActiveChallenge();
    return;
  } else if (currentChallenge === 'topic') {
    const topic = pickRandom(TOPICS, 1)[0];
    usedPromptText = topic;
    currentTopicText     = topic;
    currentTopicSentence = 'Talk about ' + topic;
    document.getElementById('prompt-label').textContent = '';
    document.getElementById('prompt-display').innerHTML =
      `<p class="prompt-text">${getEffectivePromptHTML()}</p>`;
    timerTotal = getEffectiveTime();
    if (prepTimeEnabled && challengeSupportsPrep() && !currentFramework?.disablePrepTime) {
      document.getElementById('prep-prompt-label').textContent = '';
      document.getElementById('prep-prompt-display').innerHTML =
        `<p class="prompt-text">${getPrepDescHTML()}</p>`;
      showScreen('screen-prep');
      startPrepTimer();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'selfknowledge') {
    const prompt = pickRandom(SELF_KNOWLEDGE, 1)[0];
    usedPromptText = prompt;
    document.getElementById('prompt-label').textContent = 'Your prompt';
    document.getElementById('prompt-display').innerHTML =
      `<div class="words-list"><p class="twister-text">${prompt}</p></div>`;
    timerTotal = getEffectiveTime();
    if (prepTimeEnabled && challengeSupportsPrep()) {
      document.getElementById('prep-prompt-label').textContent = 'Your prompt';
      document.getElementById('prep-prompt-display').innerHTML =
        `<p class="twister-text">${prompt}</p>`;
      showScreen('screen-prep');
      startPrepTimer();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'interview') {
    const q = pickRandom(INTERVIEW_QUESTIONS, 1)[0];
    usedPromptText = q;
    document.getElementById('prompt-label').textContent = 'Your question';
    document.getElementById('prompt-display').innerHTML = `<p class="twister-text">${q}</p>`;
    timerTotal = getEffectiveTime();
    if (prepTimeEnabled && challengeSupportsPrep()) {
      document.getElementById('prep-prompt-label').textContent = 'Your question';
      document.getElementById('prep-prompt-display').innerHTML = `<p class="twister-text">${q}</p>`;
      showScreen('screen-prep');
      startPrepTimer();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'gratitude') {
    const promptText = currentFramework?.promptText || GRATITUDE_PROMPT;
    usedPromptText = promptText;
    document.getElementById('prompt-label').textContent = '';
    document.getElementById('prompt-display').innerHTML =
      `<p class="prompt-text">${promptText}</p>`;
    timerTotal = getEffectiveTime();
    if (prepTimeEnabled && challengeSupportsPrep() && !currentFramework?.disablePrepTime) {
      document.getElementById('prep-prompt-label').textContent = '';
      document.getElementById('prep-prompt-display').innerHTML =
        `<p class="prompt-text">${getPrepDesc()}</p>`;
      showScreen('screen-prep');
      startPrepTimer();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'articulation') {
    const item = pickRandom(ARTICULATIONS, 1)[0];
    usedPromptText = item.name;
    renderArticulation(item);
    timerTotal = getEffectiveTime();
  } else if (currentChallenge === 'articulation2') {
    const item = pickRandom(ARTICULATIONS, 1)[0];
    usedPromptText = item.name;
    renderArticulation2(item);
    timerTotal = getEffectiveTime();
  }

  // Prep time for fall-through challenges (articulation, articulation2)
  if (prepTimeEnabled && challengeSupportsPrep()) {
    const prepLabels = {
      articulation: usedPromptText, articulation2: usedPromptText,
    };
    document.getElementById('prep-prompt-label').textContent = prepLabels[currentChallenge] || '';
    document.getElementById('prep-prompt-display').innerHTML =
      document.getElementById('prompt-display').innerHTML;
    showScreen('screen-prep');
    startPrepTimer();
    return;
  }

  startActiveChallenge();
}

    renderArticulation2(item);
  } else if (currentChallenge === 'selfknowledge') {
    const prompt = pickRandom(SELF_KNOWLEDGE, 1)[0];
    usedPromptText = prompt;
    document.getElementById('prompt-label').textContent = 'Your prompt';
    document.getElementById('prompt-display').innerHTML =
      `<div class="words-list"><p class="twister-text">${prompt}</p></div>`;
  } else if (currentChallenge === 'interview') {
    const q = pickRandom(INTERVIEW_QUESTIONS, 1)[0];
    usedPromptText = q;
    document.getElementById('prompt-label').textContent = 'Your question';
    document.getElementById('prompt-display').innerHTML = `<p class="twister-text">${q}</p>`;
  }
  // Gratitude: no reroll -static prompt
};

// -Confirm modal —

document.getElementById('confirm-quit').onclick = () => {
  document.getElementById('modal-confirm').classList.remove('visible');
  stopTimer();
  showScreen('screen-select');
};

document.getElementById('confirm-keep').onclick = () => {
  document.getElementById('modal-confirm').classList.remove('visible');
  resumeTimer();
};

// -Time's up screen —

function showTimesUp() {
  captureFrameworkEndTime();
  const challengeConfig = getChallengeConfig();

  const title      = document.querySelector('.timesup-title');
  const sub        = document.querySelector('.timesup-sub');
  const completion = document.getElementById('timesup-completion');
  const prompt     = document.getElementById('timesup-prompt');

  // Always use compact header title for all challenges
  title.textContent = "Done!";
  title.className   = 'timesup-title timesup-title-compact';
  const timesupScreen = document.getElementById('screen-timesup');
  timesupScreen.classList.remove('art2-mode');
  timesupScreen.classList.remove('gratitude-mode');

  // Always hide the art2 score section; shown only for articulation2
  const scoreSection = document.getElementById('art2-score-section');
  scoreSection.style.display = 'none';

  // Render framework zone and challenge ratings (generic, data-driven)
  renderFrameworkZone();
  renderChallengeRatings();

  if (challengeConfig.timesUpMode === 'articulation2') {
    const reached = artLineIdx + 1;
    const pct = artTotalLines > 0 ? Math.round((reached / artTotalLines) * 100) : 0;

    document.getElementById('screen-timesup').classList.add('art2-mode');
    sub.style.display        = 'none';
    prompt.style.display     = 'none';
    completion.style.display = 'none';
    scoreSection.style.display = 'flex';

    // Progress bar — no track, pct floats just off the right edge of the fill
    const fill  = document.getElementById('art2-progress-fill');
    const pctEl = document.getElementById('art2-progress-pct');
    fill.style.width  = '0%';
    pctEl.textContent = `${pct}%`;

    if (pct > 80) {
      pctEl.classList.add('inside');
      pctEl.style.left = '';
    } else {
      pctEl.classList.remove('inside');
      pctEl.style.left = `${pct}%`;
    }

    setTimeout(() => { fill.style.width = `${pct}%`; }, 60);

    // Generate star rows (reset each time; currentColor picks up CSS colour)
    ['art2-stars-accuracy', 'art2-stars-flow'].forEach(id => {
      const container = document.getElementById(id);
      container.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const btn = document.createElement('button');
        btn.className = 'art2-star';
        btn.setAttribute('data-value', i);
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
        btn.onclick = () => {
          const val = parseInt(btn.getAttribute('data-value'));
          container.querySelectorAll('.art2-star').forEach((s, idx) => {
            s.classList.toggle('filled', idx < val);
          });
        };
        container.appendChild(btn);
      }
    });

  } else {
    title.textContent = challengeConfig.timesUpTitle || "Done!";
    if (challengeConfig.timesUpClass) timesupScreen.classList.add(challengeConfig.timesUpClass);
    sub.style.display = 'none';
    prompt.style.display     = 'none';
    completion.style.display = 'none';
  }

  showScreen('screen-timesup');
}

document.getElementById('again-btn').onclick = () => {
  // Return to the intro screen for the same challenge (currentChallenge stays set)
  // Keep currentFramework selected so user doesn't have to re-pick it
  incrementTakeN(currentChallenge);
  clearFrameworkOverlay();
  showScreen('screen-intro');
};

document.getElementById('menu-btn').onclick = () => {
  incrementTakeN(currentChallenge);
  clearFrameworkOverlay();
  currentFramework = null;
  showScreen('screen-select');
};

// ============================================================
// APPLY CONFIG
// ============================================================

(function applyConfig() {
  for (const [key, challengeConfig] of Object.entries(CHALLENGES)) {
    if (!CONFIG[key]?.enabled) {
      const el = document.getElementById(challengeConfig.buttonId);
      if (el) el.style.display = 'none';
    }
  }
})();

</script>
