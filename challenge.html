<!--
  ================================================================
  VIDEO CHALLENGE APP  —  challenge.html
  ================================================================
  Single self-contained HTML file. No build tools, no dependencies.
  Designed for 9:16 (portrait) aspect ratio with camera feed behind
  the UI. Intended for use during video recording.

  ── SCREENS ──────────────────────────────────────────────────
  1. screen-select   Challenge selection menu
  2. screen-intro    Challenge description + optional prep toggle
  2b. screen-prep    Prep timer countdown (if enabled)
  3. screen-active   Live challenge with countdown timer
  4. screen-timesup  End screen

  ── CHALLENGES ───────────────────────────────────────────────
  story         Storytelling, 60s. Prompt types + optional frameworks.
  topic         Random topic, 60s. Optional frameworks.
  selfknowledge Reflective prompt (WNRS/Esther Perel style), 60s. Reroll ✓
  interview     Behavioural interview question, 60s. Reroll ✓
  gratitude     Daily gratitude, 60s. Optional frameworks. No reroll.
  articulation  Long passage to read aloud, 30s. Reroll ✓ (disabled)
  articulation2 Line-by-line scroll passage, 30s. Tap anywhere to advance.
                No reroll. No prep time. Tracks lines reached.
                Times up: self-rate Progress, Accuracy, Flow (1–5 stars).

  ── CONFIG FLAGS ─────────────────────────────────────────────
  CONFIG.{challenge}.enabled  Show in selection screen
  CONFIG.{challenge}.public   Include in future public release
  CONFIG.prepTime.enabled     Show "Add prep time" toggle globally

  ── KEY DESIGN DECISIONS ─────────────────────────────────────
  - Prompt labels ("Your story" etc.) are hidden — prompt alone
    is shown; the label was redundant.
  - Times up screen: no prompt repeat for most challenges.
    Exceptions: gratitude shows a quote; art2 shows line count.
  - art2 scroll container height is set dynamically via RAF;
    a CSS fallback height prevents full-text flash before JS runs.
  - GO button is same size/position as the active timer circle
    (bottom-left, 84px). Prep toggle sits to its right.
  ================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Challenge</title>
<style>

/* ============================================================
   BASE
   ============================================================ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* Prevent double-tap zoom on all interactive elements */
button, .go-circle, .prep-toggle, .challenge-btn {
  touch-action: manipulation;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================
   9:16 APP CONTAINER
   ============================================================ */

.app {
  position: relative;
  /* Use --vh (set by JS from visualViewport) instead of 100vh to avoid
     iOS zoom glitch when control centre is shown/dismissed */
  width: min(100vw, calc(var(--vh, 100vh) * 9 / 16));
  height: min(var(--vh, 100vh), calc(100vw * 16 / 9));
  max-height: var(--vh, 100vh);
  background: #111;
  overflow: hidden;
}

/* ============================================================
   CAMERA
   ============================================================ */

#camera {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1); /* mirror for selfie */
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}

#camera.visible { opacity: 1; }

/* ============================================================
   SCREENS
   ============================================================ */

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
}

/* ============================================================
   TAP ANIMATION (shared)
   ============================================================ */

@keyframes tapAnim {
  0%   { transform: scale(1); }
  28%  { transform: scale(0.88); }
  100% { transform: scale(1); }
}

.tapping {
  animation: tapAnim 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}

/* ============================================================
   BACK BUTTON (shared)
   ============================================================ */

.back-btn {
  position: absolute;
  top: max(28px, 5%);
  left: max(18px, 4%);
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
  cursor: pointer;
  z-index: 10;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Shared SVG icon sizing for all icon buttons */
.back-btn svg,
.prep-skip-btn svg,
.help-btn svg,
.reroll-btn svg {
  display: block;
  filter: drop-shadow(0 1px 8px rgba(0,0,0,0.9));
}

.back-btn svg,
.prep-skip-btn svg,
.help-btn svg {
  width: clamp(20px, 3.4vh, 26px);
  height: clamp(20px, 3.4vh, 26px);
}

.reroll-btn svg {
  width: clamp(16px, 2.7vh, 21px);
  height: clamp(16px, 2.7vh, 21px);
}

/* ============================================================
   SCREEN 1 -SELECTION
   ============================================================ */

#screen-select {
  /* Camera shows through -just a subtle dark scrim for readability */
  background: rgba(0,0,0,0.28);
  align-items: flex-start;
  justify-content: flex-start;
}

.select-inner {
  padding: clamp(48px, 9%, 80px) clamp(18px, 5%, 36px) 0;
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 2vh, 20px);
}

.select-title {
  color: white;
  font-size: clamp(15px, 2.4vh, 22px);
  font-weight: 300;
  letter-spacing: 0.04em;
  text-shadow: 0 1px 14px rgba(0,0,0,0.95), 0 2px 4px rgba(0,0,0,0.7);
}

.challenge-options {
  display: flex;
  flex-wrap: wrap;
  gap: clamp(8px, 1.4vh, 12px);
}

.challenge-btn {
  background: rgba(0,0,0,0.35);
  border: 1.5px solid rgba(255,255,255,0.45);
  color: white;
  font-size: clamp(13px, 2.1vh, 18px);
  font-weight: 400;
  padding: clamp(7px, 1.2vh, 11px) clamp(14px, 3.5%, 22px);
  border-radius: 30px;
  cursor: pointer;
  letter-spacing: 0.02em;
  user-select: none;
  text-shadow: 0 1px 8px rgba(0,0,0,0.8);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}

/* ============================================================
   SCREEN 2 -INTRO
   ============================================================ */

#screen-intro {
  /* camera behind this */
}

/* Label sits in the top bar, centred between back and help icons */
.intro-label {
  position: absolute;
  top: max(28px, 5%);
  left: 50%;
  transform: translateX(-50%);
  height: clamp(20px, 3.4vh, 26px);
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  color: rgba(255,255,255,0.65);
  font-size: clamp(11px, 1.8vh, 15px);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  z-index: 5;
}

/* Description area — left-aligned, starts just below the top bar */
.intro-inner {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  padding: max(80px, 14%) clamp(18px, 5%, 36px) max(130px, 24%);
}

.intro-desc {
  color: white;
  font-size: clamp(18px, 3.2vh, 28px);
  font-weight: 300;
  line-height: 1.55;
  text-align: left;
  text-shadow: 0 1px 14px rgba(0,0,0,0.95), 0 2px 4px rgba(0,0,0,0.7);
}

/* Intro bottom row — two-column layout: GO circle left, pill+toggle right */
#intro-bottom-row {
  position: absolute;
  bottom: calc(max(42px, 6.5%) + env(safe-area-inset-bottom, 0px));
  left: max(20px, 5%);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 16px;
}

#intro-right-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  justify-content: center;
}

/* GO circle */
.go-circle {
  width: 84px;
  height: 84px;
  background: #22c55e;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(22px, 4vh, 32px);
  font-weight: 800;
  color: white;
  cursor: pointer;
  user-select: none;
  box-shadow: 0 6px 30px rgba(0,0,0,0.5);
  letter-spacing: -0.02em;
  flex-shrink: 0;
}

/* Prep toggle — bottom row of right group */
#prep-toggle-wrap {
  align-items: center;
  margin-top: 0;
}

/* ============================================================
   SCREEN 3 -ACTIVE CHALLENGE
   ============================================================ */

#screen-active {
  /* camera behind */
}

/* Prompt area — starts just below the top bar */
.prompt-area {
  position: absolute;
  top: max(64px, 11%);
  left: 0;
  right: 0;
  padding: 0 clamp(18px, 5%, 36px);
  text-align: left;
}

/* Prep screen: prompt flows in column so framework preview follows it naturally */
#screen-prep .prompt-area {
  position: relative;
  top: auto;
  margin-top: max(64px, 11%);
}

/* Prompt label — hidden; prompt content alone is sufficient */
.prompt-label {
  display: none;
}

/* Story: 3 large words stacked */
.words-list {
  display: flex;
  flex-direction: column;
  gap: clamp(2px, 0.5vh, 6px);
}

.word-item {
  color: white;
  font-size: clamp(34px, 6.5vh, 58px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.02em;
  text-shadow: 0 2px 16px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.8);
}

/* Articulation: scrollable long passage */
.articulation-scroll {
  height: clamp(78px, 13vh, 108px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.articulation-scroll::-webkit-scrollbar {
  display: none;
}

.articulation-text {
  color: white;
  font-size: clamp(15px, 2.5vh, 20px);
  font-weight: 400;
  line-height: 1.55;
  text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
}

/* Articulation 2: scroll window -height & padding set dynamically by JS */
.art2-scroll {
  overflow: hidden;
  /* Fallback height so content is clipped before JS measures and sets the exact value */
  height: clamp(72px, 12.6vh, 104px);
  /* Aggressive fade: only the middle band (roughly 1 line) is fully visible */
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.25) 33%, black 41%, black 59%, rgba(0,0,0,0.7) 67%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.25) 33%, black 41%, black 59%, rgba(0,0,0,0.7) 67%, transparent 100%);
}

.art2-text {
  color: white;
  font-size: clamp(16px, 2.8vh, 23px);
  font-weight: 400;
  line-height: 1.5;
  text-shadow: 0 2px 16px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.8);
}


/* Timesup completion line */
.timesup-completion {
  display: none;
  color: rgba(255,255,255,0.65);
  font-size: clamp(13px, 2.1vh, 18px);
  font-weight: 300;
  line-height: 1.4;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}

/* Art2 compact title — floats in the top bar at the same level as the help icon */
.timesup-title-compact {
  position: absolute !important;
  top: max(28px, 5%);
  left: 50%;
  transform: translateX(-50%);
  height: clamp(20px, 3.4vh, 26px);
  display: flex !important;
  align-items: center;
  white-space: nowrap;
  font-size: clamp(20px, 3.4vh, 28px) !important;
  font-weight: 600 !important;
  color: white !important;
  letter-spacing: normal !important;
  text-transform: none !important;
  text-shadow: 0 1px 10px rgba(0,0,0,0.9) !important;
}

/* art2-mode: used only to show the art2-score-section */

/* Art2 self-scoring section */
.art2-score-section {
  display: none;
  width: 100%;
  flex-direction: column;
  gap: clamp(12px, 2.2vh, 20px);
}

.art2-score-section.visible {
  display: flex;
}

/* Metric rows (Progress / Accuracy / Flow) */
.art2-metric-row {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.6vw, 13px);
  width: 100%;
}

.art2-metric-label {
  color: white;
  font-size: clamp(13px, 2.2vh, 18px);
  font-weight: 600;
  width: 5.2em;
  flex-shrink: 0;
  text-align: left;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}

/* Progress bar — no track, yellow fill only, square left corner / pill right */
/* Height matches the star size so all three rows feel the same weight */
.art2-progress-outer {
  flex: 1;
  position: relative;
  height: clamp(30px, 5.2vh, 42px);
}

.art2-progress-fill {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  background: #eab308;
  border-radius: 0 8px 8px 0;
  width: 0%;
  transition: width 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* Percentage label — absolutely positioned just off the right end of the fill */
.art2-progress-pct {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-size: clamp(13px, 2.2vh, 18px);
  font-weight: 600;
  white-space: nowrap;
  padding-left: clamp(6px, 1vw, 8px);
  text-shadow: 0 1px 6px rgba(0,0,0,0.8);
}

/* Inside bar variant (>80%) — white text so it's readable on yellow */
.art2-progress-pct.inside {
  padding-left: 0;
  padding-right: clamp(10px, 1.6vw, 14px);
  color: white;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  left: auto !important;
  right: 0;
}

/* Star rows */
.art2-stars {
  flex: 1;
  display: flex;
  gap: clamp(8px, 1.8vw, 14px);
  align-items: center;
}

.art2-star {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  opacity: 0.3;
  transition: color 0.12s ease, opacity 0.12s ease;
}

.art2-star.filled {
  color: #eab308;
  opacity: 1;
}

.art2-star svg {
  display: block;
  width: clamp(30px, 5.2vh, 42px);
  height: clamp(30px, 5.2vh, 42px);
}

/* Tongue twister: quoted text */
.twister-text {
  color: white;
  font-size: clamp(19px, 3.4vh, 30px);
  font-weight: 400;
  line-height: 1.45;
  text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
}

.reroll-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  padding: 4px;
  cursor: pointer;
  user-select: none;
}

/* Timer -bottom left */
.timer-wrap {
  position: absolute;
  bottom: calc(max(20px, 3%) + env(safe-area-inset-bottom, 0px));
  left: max(20px, 5%);
  display: flex;
  align-items: center;
  flex-direction: row;
  gap: clamp(8px, 1.5vw, 14px);
}

#timer-svg {
  filter: drop-shadow(0 2px 10px rgba(0,0,0,0.7));
  flex-shrink: 0;
}

.timer-num {
  color: white;
  font-size: clamp(28px, 5vh, 44px);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 10px rgba(0,0,0,0.85);
  min-width: 2ch;
  line-height: 1;
  text-align: right;
}

/* ============================================================
   SCREEN 4 -TIME'S UP
   ============================================================ */

#screen-timesup {
  /* camera behind -content at top, button at bottom */
  align-items: center;
  justify-content: flex-start;
}

.timesup-inner {
  text-align: center;
  padding: clamp(100px, 18%, 136px) max(16px, 4%) 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(10px, 2vh, 20px);
  width: 100%;
}

.timesup-title {
  color: white;
  font-size: clamp(32px, 5.8vh, 52px);
  font-weight: 700;
  text-shadow: 0 2px 20px rgba(0,0,0,0.95);
  letter-spacing: -0.01em;
}

.timesup-sub {
  color: rgba(255,255,255,0.8);
  font-size: clamp(18px, 3vh, 26px);
  font-weight: 300;
  text-shadow: 0 1px 10px rgba(0,0,0,0.9);
}

/* Gratitude timesup: sub question appears after the framework cards */
#screen-timesup.gratitude-mode .timesup-sub    { order: 3; }
#screen-timesup.gratitude-mode #framework-zone { order: 2; }

.timesup-prompt {
  color: rgba(255,255,255,0.55);
  font-size: clamp(13px, 2.1vh, 18px);
  line-height: 1.5;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  margin-top: clamp(4px, 1vh, 10px);
}

.timesup-quote-text {
  display: block;
  font-style: italic;
  color: rgba(255,255,255,0.78);
  font-size: clamp(14px, 2.3vh, 20px);
  font-weight: 300;
  line-height: 1.6;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}

.timesup-quote-attr {
  display: block;
  margin-top: clamp(10px, 1.8vh, 16px);
  color: rgba(255,255,255,0.35);
  font-size: clamp(11px, 1.7vh, 15px);
  font-weight: 400;
  font-style: normal;
  letter-spacing: 0.06em;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
}

.timesup-actions {
  position: absolute;
  bottom: calc(max(42px, 6.5%) + env(safe-area-inset-bottom, 0px));
  left: max(20px, 5%);
  right: max(20px, 5%);
  display: flex;
  gap: clamp(8px, 1.5vw, 12px);
}

.timesup-again-btn,
.timesup-menu-btn {
  flex: 1;
  font-size: clamp(14px, 2.3vh, 19px);
  padding: clamp(12px, 2.2vh, 18px) 8px;
  border-radius: 30px;
  cursor: pointer;
  letter-spacing: 0.02em;
  user-select: none;
  white-space: nowrap;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  text-align: center;
}

.timesup-again-btn {
  background: rgba(0,0,0,0.35);
  border: 1.5px solid rgba(255,255,255,0.45);
  color: white;
  font-weight: 500;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.timesup-menu-btn {
  background: rgba(255,255,255,0.12);
  border: 1.5px solid rgba(255,255,255,0.35);
  color: rgba(255,255,255,0.85);
  font-weight: 400;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

/* ============================================================
   PREP TOGGLE (on intro screen)
   ============================================================ */

.prep-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.prep-toggle input[type=checkbox] {
  display: none;
}

.prep-toggle-track {
  position: relative;
  width: 44px;
  height: 26px;
  background: rgba(255,255,255,0.2);
  border-radius: 13px;
  flex-shrink: 0;
  transition: background 0.2s ease;
}

.prep-toggle input:checked ~ .prep-toggle-track {
  background: #22c55e;
}

.prep-toggle-thumb {
  position: absolute;
  width: 20px;
  height: 20px;
  background: white;
  border-radius: 50%;
  top: 3px;
  left: 3px;
  transition: transform 0.2s ease;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

.prep-toggle input:checked ~ .prep-toggle-track .prep-toggle-thumb {
  transform: translateX(18px);
}

.prep-toggle-label {
  color: rgba(255,255,255,0.75);
  font-size: clamp(13px, 2.1vh, 17px);
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
}

/* ============================================================
   SCREEN -PREP TIME
   ============================================================ */

.prep-timer-outer {
  position: absolute;
  bottom: calc(max(20px, 3%) + env(safe-area-inset-bottom, 0px));
  left: max(20px, 5%);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: clamp(8px, 1.5vw, 14px);
}

.prep-timer-num-stack {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}

.prep-timer-label {
  color: white;
  font-size: clamp(12px, 2vh, 16px);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
}

.prep-top-right {
  position: absolute;
  top: max(28px, 5%);
  right: max(18px, 4%);
  display: flex;
  align-items: center;
  gap: clamp(14px, 2.5vw, 22px);
  z-index: 10;
}

.prep-skip-btn,
.help-btn {
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================
   HELP OVERLAY
   ============================================================ */

.help-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(20px, 5%, 36px);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
}

.help-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.help-box {
  background: rgba(18,18,18,0.97);
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: clamp(12px, 2vh, 18px);
  padding: clamp(18px, 3.5%, 28px);
  width: 100%;
  max-height: 72%;
  overflow-y: auto;
  scrollbar-width: none;
}

.help-box::-webkit-scrollbar { display: none; }

.help-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: clamp(12px, 2vh, 18px);
}

.help-title {
  color: white;
  font-size: clamp(15px, 2.4vh, 20px);
  font-weight: 600;
  text-shadow: none;
}

.help-close-btn {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  flex-shrink: 0;
  margin-left: clamp(10px, 2%, 16px);
  display: flex;
  align-items: center;
}

.help-close-btn svg {
  width: clamp(16px, 2.6vh, 20px);
  height: clamp(16px, 2.6vh, 20px);
  display: block;
}

.help-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 1.8vh, 15px);
}

.help-list li {
  color: rgba(255,255,255,0.82);
  font-size: clamp(12px, 2vh, 16px);
  line-height: 1.5;
  padding-left: 1.1em;
  position: relative;
}

.help-list li::before {
  content: '-';
  position: absolute;
  left: 0;
  color: rgba(255,255,255,0.3);
}

.help-list li strong {
  color: white;
  font-weight: 600;
}

.help-section-heading {
  color: rgba(255,255,255,0.38) !important;
  font-size: clamp(10px, 1.5vh, 12px) !important;
  font-weight: 700 !important;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding-left: 0 !important;
  margin-top: clamp(10px, 1.8vh, 16px);
}

.help-section-heading:first-child {
  margin-top: 0;
}

.help-section-heading::before {
  content: none !important;
}

/* ============================================================
   FRAMEWORK SYSTEM
   ============================================================ */

/* Framework pill on intro screen — top row of right group */
#framework-pill-wrap {
}

.framework-pill-btn {
  background: rgba(0,0,0,0.3);
  border: 1.5px solid rgba(255,255,255,0.3);
  border-radius: 20px;
  color: rgba(255,255,255,0.7);
  font-size: clamp(11px, 1.8vh, 14px);
  font-weight: 500;
  padding: 6px 14px;
  cursor: pointer;
  white-space: nowrap;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.framework-pill-btn.selected {
  background: rgba(234,179,8,0.18);
  border-color: rgba(234,179,8,0.6);
  color: #fcd34d;
}

/* Framework picker bottom sheet */
.framework-picker-overlay {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: flex-end;
}

.framework-picker-overlay.visible {
  display: flex;
}

.framework-picker-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
}

.framework-picker-sheet {
  position: relative;
  width: 100%;
  background: rgba(20,20,24,0.97);
  border-radius: 18px 18px 0 0;
  padding: clamp(16px, 3vh, 24px) clamp(16px, 5%, 24px) clamp(20px, 4vh, 32px);
  max-height: 75%;
  overflow-y: auto;
  -ms-overflow-style: none;
  scrollbar-width: none;
}

.framework-picker-sheet::-webkit-scrollbar { display: none; }

.framework-picker-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: clamp(12px, 2.2vh, 20px);
}

.framework-picker-title {
  color: white;
  font-size: clamp(14px, 2.2vh, 18px);
  font-weight: 600;
}

.framework-picker-close {
  background: none;
  border: none;
  padding: 4px;
  cursor: pointer;
  opacity: 0.6;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.framework-picker-close svg {
  display: block;
  width: 20px;
  height: 20px;
}

.framework-picker-list {
  display: flex;
  flex-direction: column;
  gap: clamp(6px, 1.2vh, 10px);
}

.framework-picker-item {
  padding: clamp(10px, 1.8vh, 14px) clamp(12px, 2.2vw, 16px);
  border-radius: 12px;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.1);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, border-color 0.15s;
}

.framework-picker-item.active {
  background: rgba(234,179,8,0.15);
  border-color: rgba(234,179,8,0.45);
}

.framework-picker-name {
  display: block;
  color: white;
  font-size: clamp(13px, 2vh, 16px);
  font-weight: 600;
  margin-bottom: 3px;
}

.framework-picker-desc {
  display: block;
  color: rgba(255,255,255,0.5);
  font-size: clamp(11px, 1.7vh, 13px);
  line-height: 1.4;
}

/* In-challenge framework overlay (tappable boxes) */
.framework-active-wrap {
  position: absolute;
  top: clamp(130px, 22%, 175px);
  left: max(16px, 4%);
  right: max(16px, 4%);
  display: flex;
  flex-direction: column;
  gap: clamp(5px, 1vh, 8px);
  touch-action: manipulation;
}

.framework-guidance-label {
  color: rgba(255,255,255,0.85);
  font-size: clamp(9px, 1.4vh, 11px);
  font-weight: 600;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  text-shadow: 0 1px 4px rgba(0,0,0,0.9);
}

/* Prep screen framework preview — non-interactive, flows below prompt in flex column */
#framework-prep-wrap {
  position: relative;
  padding: 0 max(16px, 4%);
  flex-direction: column;
  gap: clamp(5px, 1vh, 8px);
  pointer-events: none;
  opacity: 0.72;
  margin-top: clamp(10px, 1.8vh, 16px);
}

/* Topic/story word highlight — yellow, used inside prompt-text and fwk-overlay-prompt */
.topic-highlight {
  color: #fcd34d;
}

/* Instructional sentence prompts — one consistent size used across all challenges */
.prompt-text {
  color: white;
  font-size: clamp(18px, 3vh, 26px);
  font-weight: 400;
  line-height: 1.4;
  text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
}

.fwk-boxes-row {
  display: flex;
  flex-wrap: wrap;
  gap: clamp(5px, 1vw, 8px);
}

.fwk-box {
  flex: 1 1 auto;
  min-width: 52px;
  min-height: clamp(44px, 7.5vh, 60px);
  background: rgba(0,0,0,0.35);
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 4px 6px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: background 0.15s, border-color 0.15s, opacity 0.15s;
}

/* Parallel mode: tapped */
.fwk-box.tapped {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.4);
}

.fwk-box-emoji {
  font-size: clamp(14px, 2.4vh, 20px);
  line-height: 1;
}

.fwk-box-label {
  color: rgba(255,255,255,0.85);
  font-size: clamp(10px, 1.7vh, 13px);
  font-weight: 600;
  text-align: center;
  line-height: 1.2;
}

.fwk-box-label:empty,
.fwk-ct-label:empty { display: none; }

.fwk-box.tapped .fwk-box-label {
  color: white;
}

/* Per-step hint text — visible only on prep screen */
.fwk-box-hint {
  color: rgba(255,255,255,0.55);
  font-size: clamp(8px, 1.2vh, 10px);
  font-weight: 400;
  text-align: center;
  line-height: 1.3;
  padding: 0 2px;
  margin-top: 1px;
  display: none;
}

#framework-prep-wrap .fwk-box-hint {
  display: block;
  color: rgba(255,255,255,0.5);
}

/* Sequential mode: overlay starts higher since header lives inside it */
#screen-active.has-seq-framework .framework-active-wrap {
  top: max(70px, 12%);
}

/* Counter / parallel mode: overlay starts higher to make room for prompt inside */
#screen-active.has-counter-framework .framework-active-wrap,
#screen-active.has-parallel-framework .framework-active-wrap {
  top: max(70px, 12%);
}

/* Prompt rendered inside framework overlay (counter + parallel modes) */
.fwk-overlay-prompt {
  color: white;
  font-size: clamp(18px, 3vh, 26px);
  font-weight: 400;
  line-height: 1.4;
  text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
  margin-bottom: clamp(6px, 1.2vh, 10px);
}

/* Sequential mode: numbered list layout */
.fwk-seq-header {
  font-size: clamp(9px, 1.4vh, 12px);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.65);
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  text-align: center;
  line-height: 1.3;
}

.fwk-seq-list {
  display: flex;
  flex-direction: column;
  width: 100%;
}

.fwk-seq-item {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.4vw, 12px);
  padding: clamp(5px, 0.9vh, 8px) 0;
  max-height: 150px;
  overflow: hidden;
  transition: opacity 0.3s ease, max-height 0.35s ease, padding 0.35s ease;
}

.fwk-seq-item.seq-done {
  opacity: 0;
  max-height: 0;
  padding: 0;
}

.fwk-seq-item-text {
  flex: 1;
  line-height: 1.35;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}

.fwk-seq-item.seq-active .fwk-seq-item-text {
  color: white;
  font-size: clamp(19px, 3.3vh, 27px);
  font-weight: 700;
}

.fwk-seq-item.seq-upcoming .fwk-seq-item-text {
  color: rgba(255,255,255,0.45);
  font-size: clamp(12px, 2vh, 16px);
  font-weight: 400;
}

.fwk-seq-inline-btn {
  flex-shrink: 0;
  background: none;
  border: none;
  color: white;
  font-size: clamp(24px, 4.2vh, 34px);
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  padding: 2px 8px;
  line-height: 1;
  text-shadow: 0 2px 10px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
}

.fwk-seq-inline-btn:active {
  opacity: 0.7;
}

/* Counter result sentence */
.fwk-counter-sentence {
  color: rgba(255,255,255,0.75);
  font-size: clamp(14px, 2.4vh, 19px);
  font-weight: 400;
  text-align: center;
  line-height: 1.6;
}

.fwk-counter-sentence-num {
  color: #fcd34d;
  font-size: clamp(30px, 5.2vh, 44px);
  font-weight: 700;
  line-height: 1;
  display: inline-block;
  vertical-align: middle;
  margin: 0 3px;
}

/* Counter mode */
.fwk-counter-btn {
  width: 100%;
  min-height: clamp(44px, 7.5vh, 60px);
  background: rgba(0,0,0,0.35);
  border: 1.5px solid rgba(255,255,255,0.25);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 1.5vw, 12px);
  padding: 10px 14px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: background 0.1s;
}

.fwk-counter-btn:active,
.fwk-counter-btn.fwk-counter-bump {
  background: rgba(234,179,8,0.22);
  border-color: rgba(234,179,8,0.7);
}

.fwk-counter-label {
  color: rgba(255,255,255,0.7);
  font-size: clamp(11px, 1.8vh, 14px);
  font-weight: 500;
}

.fwk-counter-num {
  color: white;
  font-size: clamp(18px, 3.2vh, 28px);
  font-weight: 700;
  min-width: 1.5em;
  text-align: center;
}

/* Times-up: framework zone */
.framework-zone {
  width: 100%;
  margin-bottom: clamp(10px, 1.8vh, 16px);
}

/* Time-distribution: color bar */
.fwk-dist-bar {
  height: clamp(26px, 4.4vh, 36px);
  width: 100%;
  display: flex;
  border-radius: 6px;
  overflow: hidden;
  gap: 2px;
}

.fwk-dist-seg {
  height: 100%;
  min-width: 2px;
  transition: width 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* Time-distribution: legend below bar — inline items wrap naturally */
.fwk-dist-legend {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  row-gap: clamp(8px, 1.5vh, 14px);
  column-gap: clamp(22px, 4.5vw, 34px);
  width: 100%;
  margin-top: clamp(8px, 1.4vh, 12px);
}

.fwk-dist-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.fwk-dist-legend-swatch {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  flex-shrink: 0;
}

.fwk-dist-legend-label {
  color: rgba(255,255,255,0.75);
  font-size: clamp(11px, 1.8vh, 14px);
  font-weight: 500;
}

.fwk-dist-legend-time {
  color: rgba(255,255,255,0.45);
  font-size: clamp(10px, 1.6vh, 13px);
  font-variant-numeric: tabular-nums;
}

.fwk-dist-legend-item.unreached .fwk-dist-legend-label,
.fwk-dist-legend-item.unreached .fwk-dist-legend-time {
  color: rgba(255,255,255,0.2);
}

/* Completion-timed mode: label + check + elapsed time per element */
.fwk-ct-row {
  display: flex;
  gap: clamp(6px, 1.2vw, 10px);
  width: 100%;
  margin-bottom: clamp(6px, 1.2vh, 10px);
}

.fwk-ct-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: clamp(8px, 1.4vh, 12px) 4px;
  border-radius: 10px;
  background: rgba(239,68,68,0.08);
  border: 1.5px solid rgba(239,68,68,0.28);
}

.fwk-ct-item.tapped {
  background: rgba(234,179,8,0.12);
  border-color: rgba(234,179,8,0.35);
}

.fwk-ct-emoji {
  font-size: clamp(14px, 2.4vh, 20px);
  line-height: 1;
}

.fwk-ct-label {
  color: rgba(255,255,255,0.5);
  font-size: clamp(9px, 1.4vh, 11px);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.fwk-ct-item.tapped .fwk-ct-label {
  color: rgba(255,255,255,0.65);
}

.fwk-ct-check {
  font-size: clamp(20px, 3.4vh, 28px);
  font-weight: 700;
  line-height: 1;
  color: rgba(239,68,68,0.7);
}

.fwk-ct-item.tapped .fwk-ct-check {
  color: #fcd34d;
}

.fwk-ct-time {
  color: rgba(255,255,255,0.65);
  font-size: clamp(10px, 1.6vh, 13px);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* Completion mode (e.g. gratitude) */
.fwk-completion-row {
  display: flex;
  gap: clamp(6px, 1.2vw, 10px);
  width: 100%;
  margin-bottom: clamp(6px, 1.2vh, 10px);
}

.fwk-completion-box {
  flex: 1;
  padding: clamp(8px, 1.4vh, 12px) 6px;
  border-radius: 10px;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: rgba(255,255,255,0.3);
  font-size: clamp(10px, 1.7vh, 13px);
  font-weight: 500;
}

.fwk-completion-box span:first-child {
  font-size: clamp(16px, 2.8vh, 24px);
}

.fwk-completion-box.tapped {
  background: rgba(234,179,8,0.15);
  border-color: rgba(234,179,8,0.45);
  color: white;
}

/* Counter result */
.fwk-counter-result {
  display: flex;
  align-items: baseline;
  gap: clamp(6px, 1.2vw, 10px);
  margin-bottom: clamp(6px, 1.2vh, 10px);
}

.fwk-counter-result-num {
  color: #fcd34d;
  font-size: clamp(28px, 5vh, 42px);
  font-weight: 700;
  line-height: 1;
}

.fwk-counter-result-label {
  color: rgba(255,255,255,0.7);
  font-size: clamp(13px, 2.2vh, 18px);
  font-weight: 500;
}

/* Challenge ratings section */
.challenge-ratings {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 1.8vh, 16px);
  margin-top: clamp(-8px, -1.2vh, -4px);
}

.prep-plus-btn {
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  color: white;
  font-size: clamp(15px, 2.5vh, 21px);
  font-weight: 700;
  line-height: 1;
  padding: 0;
  cursor: pointer;
  user-select: none;
  text-shadow: 0 1px 10px rgba(0,0,0,0.95);
}

.ready-set-go {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s ease;
}

.ready-set-go.visible {
  opacity: 1;
}

.ready-set-go-text {
  color: white;
  font-size: clamp(22px, 4vh, 34px);
  font-weight: 700;
  letter-spacing: 0.01em;
  text-shadow: 0 2px 16px rgba(0,0,0,0.95);
}

.ready-set-go-text.go {
  color: #22c55e;
}

/* ============================================================
   CONFIRM MODAL
   ============================================================ */

.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.62);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.modal-overlay.visible {
  opacity: 1;
  pointer-events: all;
}

.modal-box {
  background: rgba(18,18,18,0.96);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  padding: clamp(24px, 5%, 40px) clamp(20px, 6%, 40px);
  width: 76%;
  text-align: center;
}

.modal-box p {
  color: white;
  font-size: clamp(15px, 2.6vh, 21px);
  font-weight: 300;
  line-height: 1.4;
  margin-bottom: clamp(18px, 3.5vh, 28px);
}

.modal-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.modal-quit {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.25);
  color: rgba(255,255,255,0.6);
  font-size: clamp(13px, 2.2vh, 18px);
  padding: clamp(8px, 1.5vh, 12px) clamp(18px, 5%, 28px);
  border-radius: 10px;
  cursor: pointer;
}

.modal-keep {
  background: #22c55e;
  border: none;
  color: white;
  font-size: clamp(13px, 2.2vh, 18px);
  font-weight: 600;
  padding: clamp(8px, 1.5vh, 12px) clamp(18px, 5%, 28px);
  border-radius: 10px;
  cursor: pointer;
}

/* ============================================================
   TAKE COUNTER
   ============================================================ */

.take-counter-display {
  position: absolute;
  bottom: calc(max(14px, 2%) + env(safe-area-inset-bottom, 0px));
  left: 0;
  right: 0;
  padding: 0 clamp(60px, 14%, 80px);
  text-align: center;
  color: white;
  font-size: clamp(11px, 1.8vh, 14px);
  font-weight: 400;
  opacity: 0.17;
  letter-spacing: 0.03em;
  pointer-events: none;
  z-index: 8;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  display: none;
}

.take-counter-sheet-overlay {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: none;
  align-items: flex-end;
}

.take-counter-sheet-overlay.visible { display: flex; }

.take-counter-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
}

.take-counter-sheet {
  position: relative;
  width: 100%;
  background: rgba(20,20,24,0.97);
  border-radius: 18px 18px 0 0;
  padding: clamp(16px, 3vh, 24px) clamp(16px, 5%, 24px) clamp(20px, 4vh, 32px);
}

.take-counter-sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: clamp(14px, 2.5vh, 22px);
}

.take-counter-sheet-title {
  color: white;
  font-size: clamp(14px, 2.2vh, 18px);
  font-weight: 600;
}

.take-counter-input-wrap {
  position: relative;
  margin-bottom: clamp(10px, 1.8vh, 14px);
}

.take-counter-input {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border: 1.5px solid rgba(255,255,255,0.18);
  border-radius: 10px;
  color: white;
  font-size: clamp(14px, 2.2vh, 18px);
  padding: clamp(10px, 1.8vh, 14px) 40px clamp(10px, 1.8vh, 14px) clamp(12px, 2vw, 16px);
  outline: none;
  box-sizing: border-box;
  -webkit-appearance: none;
  font-family: inherit;
}

.take-counter-input::placeholder {
  color: rgba(255,255,255,0.3);
}

.take-counter-input:focus {
  border-color: rgba(255,255,255,0.35);
}

.take-counter-clear-btn {

  border: none;

// ============================================================

let audioCtx = null;

function getACtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, startDelay, dur, vol, type = 'sine') {
  try {
    const ac = getACtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.type = type;
    osc.frequency.value = freq;
    const t = ac.currentTime + startDelay;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  } catch(e) {
    // Audio unavailable -continue silently
  }
}

// Short soft pop -challenge selection
function playPop() {
  tone(700, 0, 0.055, 0.22);
}

// Ascending three-note chord -GO pressed, challenge starting
function playStart() {

  tone(659, 0.11, 0.13, 0.22);   // E5
  tone(784, 0.22, 0.22, 0.28);   // G5
}

}

// Two descending notes -time's up

}

const timerPie = document.getElementById('timer-pie');
const timerNum = document.getElementById('timer-num');

function piePath(fraction) {
  if (fraction <= 0) return '';
  if (fraction >= 1) return 'M50,50 L50,0 A50,50 0 1,1 49.9999,0 Z';
  const a = (1 - fraction) * 2 * Math.PI;
  const x = 50 + 50 * Math.sin(a);
  const y = 50 - 50 * Math.cos(a);
  const large = fraction > 0.5 ? 1 : 0;
  return `M50,50 L${x},${y} A50,50 0 ${large},1 50,0 Z`;
}

function renderTimer(left) {
  timerPie.setAttribute('d', piePath(left / timerTotal));
  timerNum.textContent = left >= 1 ? Math.ceil(left) : '';
}

function timerTick() {
  const elapsed = (performance.now() - timerStartWall) / 1000;
  const left = Math.max(0, timerRemaining - elapsed);

  // Mid-challenge beeps every 10 seconds
  for (const t of [50, 40, 30, 20, 10]) {
    if (left <= t && !midBeepsPlayed.has(t)) {
      midBeepsPlayed.add(t);
      playMidBeep();
    }
  }

  // Countdown beeps for last 3 seconds
  for (const t of [3, 2, 1]) {
    if (left <= t && !beepsPlayed.has(t)) {
      beepsPlayed.add(t);
      playBeep();
    }
  }

  renderTimer(left);

  if (left > 0) {
    timerRAF = requestAnimationFrame(timerTick);
  } else {
    timerRunning = false;
    timerRemaining = 0;
    captureFrameworkEndTime();
    timerPie.setAttribute('d', '');
    timerNum.textContent = '';
    playEnd();
    setTimeout(showTimesUp, 350);
  }
}

function startTimer() {
  timerStartWall  = performance.now();
  timerRunning    = true;
  beepsPlayed     = new Set();
  midBeepsPlayed  = new Set();
  timerRAF        = requestAnimationFrame(timerTick);
}

// Virtual clock that only advances while the timer is running.
// Using this for framework taps means paused time (e.g. help overlay) is excluded
// from section durations on the results screen.
function challengeNow() {
  if (timerStartWall === null) {
    return (timerTotal - timerRemaining) * 1000;
  }
  const elapsedSinceResume = performance.now() - timerStartWall;
  return Math.min(timerTotal * 1000, (timerTotal - timerRemaining) * 1000 + elapsedSinceResume);
}

function pauseTimer() {
  if (!timerRunning) return;
  const elapsed = (performance.now() - timerStartWall) / 1000;
  timerRemaining = Math.max(0, timerRemaining - elapsed);
  cancelAnimationFrame(timerRAF);
  timerRunning  = false;
  timerStartWall = null;
}

function resumeTimer() {
  timerStartWall = performance.now();
  timerRunning   = true;
  timerRAF       = requestAnimationFrame(timerTick);
}

function stopTimer() {
  cancelAnimationFrame(timerRAF);
  timerRunning   = false;
  timerStartWall = null;
  timerRemaining = 0;
}

function captureFrameworkEndTime() {
  if (fwkChallengeEndTime !== 0) return;
  fwkChallengeEndTime = challengeNow();
}

  const elapsed = (performance.now() - prepTimerStartWall) / 1000;
  const left    = Math.max(0, prepTimerRemaining - elapsed);

  // Show Ready/Set/Go words on last 3 seconds (replaces beeps)

    prepBeepsPlayed.add(3);
    prepTimerPie.setAttribute('d', '');
    prepTimerNum.textContent = '';
    showReadySetGo('Ready', false); playBeep();

  if (left <= 2 && left > 1 && !prepBeepsPlayed.has(2)) {
    prepBeepsPlayed.add(2);
    showReadySetGo('Set', false); playBeep();
  }
  if (left <= 1 && !prepBeepsPlayed.has(1)) {
    prepBeepsPlayed.add(1);
    showReadySetGo('Go', true); playBeep();

  if (left > 3) renderPrepTimer(left);

// Articulation 2 helpers

function renderArticulation2(item) {
  document.getElementById('prompt-label').textContent = item.name;
  document.getElementById('prompt-display').innerHTML =
    `<div class="art2-scroll" id="art2-scroll"><p class="art2-text" id="art2-text">${item.text}</p></div>`;

  // Reset state
  artLineIdx    = 0;
  artScrollEl   = null;
  artLineHeight = 0;
  artTotalLines = 0;

  // Step 1: measure the rendered line height
  requestAnimationFrame(() => {
    const container = document.getElementById('art2-scroll');
    const textEl    = document.getElementById('art2-text');
    if (!container || !textEl) return;

    const computed = getComputedStyle(textEl);
    const lhVal    = computed.lineHeight;
    artLineHeight  = lhVal === 'normal'
      ? parseFloat(computed.fontSize) * 1.4
      : parseFloat(lhVal);

    // Container shows 3 line-heights: faint above + clear current + faint below
    container.style.height = `${artLineHeight * 3}px`;

    // Pad so line 1 starts in the centre (clear) zone, not at the top
    textEl.style.paddingTop    = `${artLineHeight}px`;
    // Pad bottom so the last line can also scroll to centre
    textEl.style.paddingBottom = `${artLineHeight}px`;

    // Step 2: re-measure after padding is applied
    requestAnimationFrame(() => {
      const maxScroll = container.scrollHeight - container.clientHeight;
      artTotalLines   = Math.max(1, Math.round(maxScroll / artLineHeight) + 1);
      artScrollEl     = container;
    });
  });
}

function art2Advance(dir) {
  if (!artScrollEl || artLineHeight === 0) return;
  const next = artLineIdx + dir;
  if (next < 0 || next >= artTotalLines) return;
  artLineIdx = next;
  artScrollEl.scrollTop = artLineIdx * artLineHeight;
}

const CHALLENGE_DEFAULT_DESCS = {
  ...Object.fromEntries(
    Object.entries(CHALLENGES)
      .filter(([, cfg]) => cfg.defaultPromptText)
      .map(([key, cfg]) => [key, cfg.defaultPromptText])
  ),
};

const CHALLENGE_DEFAULT_TIMES = Object.fromEntries(
  Object.entries(CHALLENGES).map(([key, cfg]) => [key, cfg.defaultTime])
);

function getChallengeConfig(challenge = currentChallenge) {
  return CHALLENGES[challenge] || {};
}

function getChallengeDefaultTime(challenge = currentChallenge) {
  return CHALLENGE_DEFAULT_TIMES[challenge] || 60;
}

function getEffectiveTime(challenge = currentChallenge) {
  return currentFramework?.timeOverride || getChallengeDefaultTime(challenge);
}

function challengeSupportsPrep(challenge = currentChallenge) {
  return CONFIG.prepTime.enabled && getChallengeConfig(challenge).prepSupported !== false;
}

function challengeSupportsReroll(challenge = currentChallenge) {
  if (challenge === 'story') return Boolean(currentPromptType);
  return getChallengeConfig(challenge).rerollSupported === true;
}

function validateChallengeDefinitions() {
  const errors = [];

  for (const [challengeKey, cfg] of Object.entries(CHALLENGES)) {
    if (!Object.prototype.hasOwnProperty.call(CONFIG, challengeKey)) {
      errors.push(`CHALLENGES.${challengeKey}: missing CONFIG entry`);
    }
    if (typeof cfg.buttonId !== 'string' || cfg.buttonId.trim() === '') {
      errors.push(`CHALLENGES.${challengeKey}: missing buttonId`);
    } else if (!document.getElementById(cfg.buttonId)) {
      errors.push(`CHALLENGES.${challengeKey}: button "${cfg.buttonId}" not found`);
    }
    if (typeof cfg.label !== 'string' || cfg.label.trim() === '') {
      errors.push(`CHALLENGES.${challengeKey}: missing label`);
    }
    if (!Number.isFinite(cfg.defaultTime) || cfg.defaultTime <= 0) {
      errors.push(`CHALLENGES.${challengeKey}: defaultTime must be a positive number`);
    }
    if (cfg.ratings !== undefined && !Array.isArray(cfg.ratings)) {
      errors.push(`CHALLENGES.${challengeKey}: ratings must be an array`);
    }
  }

  for (const challengeKey of Object.keys(CONFIG)) {
    if (challengeKey !== 'prepTime' && !Object.prototype.hasOwnProperty.call(CHALLENGES, challengeKey)) {
      errors.push(`CONFIG.${challengeKey}: missing CHALLENGES entry`);
    }
  }

  if (errors.length > 0) {
    throw new Error('Invalid challenge configuration:\n' + errors.join('\n'));
  }
}

function validateFrameworkDefinitions() {
  const validModes = new Set(['parallel', 'sequential', 'counter']);
  const expectedPostTypeByMode = {
    parallel: 'completion-timed',
    sequential: 'time-distribution',
    counter: 'counter',
  };
  const allowedFrameworkFields = new Set([
    'id', 'name', 'description', 'promptText', 'mode', 'disablePrepTime',
    'timeOverride', 'elements', 'buttonLabel', 'prepButtonLabel',
    'postChallenge', 'hidePrompt', 'timeTracked',
  ]);
  const allowedElementFields = new Set(['label', 'emoji', 'hint', 'flex']);
  const errors = [];

  for (const [challengeKey, frameworks] of Object.entries(FRAMEWORKS)) {
    if (!Object.prototype.hasOwnProperty.call(CONFIG, challengeKey)) {
      errors.push(`FRAMEWORKS.${challengeKey}: unknown challenge key`);
      continue;
    }
    if (!Array.isArray(frameworks) || frameworks.length === 0) {
      errors.push(`FRAMEWORKS.${challengeKey}: expected a non-empty array`);
      continue;
    }
    if (!getChallengeConfig(challengeKey).defaultPromptText) {
      errors.push(`FRAMEWORKS.${challengeKey}: missing CHALLENGES.${challengeKey}.defaultPromptText`);
    }

    const ids = new Set();
    frameworks.forEach((fw, index) => {
      const label = `FRAMEWORKS.${challengeKey}[${index}]`;

      ['id', 'name', 'description', 'promptText', 'mode'].forEach(field => {
        if (typeof fw[field] !== 'string' || fw[field].trim() === '') {
          errors.push(`${label}: missing or invalid ${field}`);
        }
      });

      if (ids.has(fw.id)) {
        errors.push(`${label}: duplicate id "${fw.id}"`);
      } else if (fw.id) {
        ids.add(fw.id);
      }

      if (!validModes.has(fw.mode)) {
        errors.push(`${label}: invalid mode "${fw.mode}"`);
      }

      if (!fw.postChallenge || typeof fw.postChallenge !== 'object') {
        errors.push(`${label}: missing postChallenge`);
      } else {
        const expectedPostType = expectedPostTypeByMode[fw.mode];
        if (typeof fw.postChallenge.type !== 'string' || fw.postChallenge.type.trim() === '') {
          errors.push(`${label}: missing postChallenge.type`);
        } else if (expectedPostType && fw.postChallenge.type !== expectedPostType) {
          errors.push(`${label}: mode "${fw.mode}" must use postChallenge.type "${expectedPostType}"`);
        }
      }

      if (fw.timeOverride !== undefined && (!Number.isFinite(fw.timeOverride) || fw.timeOverride <= 0)) {
        errors.push(`${label}: timeOverride must be a positive number`);
      }

      if (fw.mode === 'parallel' || fw.mode === 'sequential') {
        if (!Array.isArray(fw.elements) || fw.elements.length === 0) {
          errors.push(`${label}: ${fw.mode} frameworks require a non-empty elements array`);
        } else {
          fw.elements.forEach((el, elIndex) => {
            if (!el || typeof el !== 'object') {
              errors.push(`${label}.elements[${elIndex}]: invalid element`);
              return;
            }
            if (fw.mode === 'sequential') {
              if (typeof el.label !== 'string' || el.label.trim() === '') {
                errors.push(`${label}.elements[${elIndex}]: sequential elements require a label`);
              }
              if (typeof el.hint !== 'string' || el.hint.trim() === '') {
                errors.push(`${label}.elements[${elIndex}]: sequential elements require a hint`);
              }
            }
            if (fw.mode === 'parallel' && fw.postChallenge?.type === 'completion-timed' &&
                typeof el.label !== 'string' && typeof el.emoji !== 'string') {
              errors.push(`${label}.elements[${elIndex}]: parallel elements need a label or emoji`);
            }
            Object.keys(el).forEach(field => {
              if (!allowedElementFields.has(field)) {
                console.warn(`${label}.elements[${elIndex}]: unknown field "${field}"`);
              }
            });
          });
        }
      }

      Object.keys(fw).forEach(field => {
        if (!allowedFrameworkFields.has(field)) {
          console.warn(`${label}: unknown field "${field}"`);
        }
      });
    });
  }

  if (errors.length > 0) {
    throw new Error('Invalid framework configuration:\n' + errors.join('\n'));
  }
}

// Converts a verb to its gerund (-ing) form.
// Rule: drop silent trailing 'e' (not 'ee', 'oe') then add 'ing'; otherwise just add 'ing'.
function toGerund(verb) {
  const lower = verb.toLowerCase();
  const keepE = { see: 'seeing', agree: 'agreeing', free: 'freeing', flee: 'fleeing', be: 'being' };
  if (keepE[lower]) return keepE[lower];
  if (lower.length > 2 && lower.endsWith('e') && !lower.endsWith('ee') && !lower.endsWith('oe')) {
    return verb.slice(0, -1) + 'ing';
  }
  return verb + 'ing';
}

// Builds "Tell a story including the words fox, ladder & midnight" HTML (words in yellow bold).
function buildStoryWordsHTML(words) {
  const highlighted = words.map(w => `<strong class="topic-highlight">${w}</strong>`);
  const last = highlighted.pop();
  return 'Tell a story including the words ' + highlighted.join(', ') + ' & ' + last;
}

// Returns the effective prompt text for the current challenge + framework state.
// For topic/story: once a prompt has been picked at launch, returns that specific text
// rather than the generic default or framework promptText.
function getEffectivePromptText() {
  if (currentChallenge === 'story') {
    if (currentStoryWords) {
      const ws = currentStoryWords;
      return 'Tell a story including the words ' + ws.slice(0, -1).join(', ') + ' & ' + ws[ws.length - 1];
    }
    if (currentPlotText) return 'Tell this story: ' + currentPlotText;
    return currentFramework?.promptText || CHALLENGE_DEFAULT_DESCS['story'];
  }
  if (currentChallenge === 'topic' && currentTopicSentence) return currentTopicSentence;
  return currentFramework?.promptText || CHALLENGE_DEFAULT_DESCS[currentChallenge];
}

// Returns HTML for the effective prompt, with highlights for topic/story challenges.
function getEffectivePromptHTML() {
  if (currentChallenge === 'story') {
    if (currentStoryWords) return buildStoryWordsHTML(currentStoryWords);
    if (currentPlotText) return 'Tell this story: <strong class="topic-highlight">' + currentPlotText + '</strong>';
    return getEffectivePromptText() || '';  // framework promptText, or "Tell a story." fallback
  }
  if (currentChallenge === 'topic' && currentTopicText) {
    return 'Talk about <strong class="topic-highlight">' + currentTopicText + '</strong>';
  }
  return getEffectivePromptText() || '';
}

// Returns "Prep time for [gerund phrase]" (no trailing period) for the prep screen.
function getPrepDesc() {
  const rawPrompt = getEffectivePromptText();
  if (!rawPrompt) return '';
  const stripped = rawPrompt.replace(/[.!?]+$/, '');
  const spaceIdx = stripped.indexOf(' ');
  if (spaceIdx === -1) return 'Prep time for ' + toGerund(stripped).toLowerCase();
  const firstWord = stripped.slice(0, spaceIdx);
  const rest = stripped.slice(spaceIdx + 1);
  const gerund = toGerund(firstWord).toLowerCase();
  return 'Prep time for ' + gerund + ' ' + rest;
}

// Like getPrepDesc() but with highlights for topic/story challenges.
function getPrepDescHTML() {
  if (currentChallenge === 'story') {
    if (currentStoryWords) {
      const highlighted = currentStoryWords.map(w => `<strong class="topic-highlight">${w}</strong>`);
      const last = highlighted.pop();
      return 'Prep time for telling a story including the words ' + highlighted.join(', ') + ' & ' + last;
    }
    if (currentPlotText) return 'Prep time for telling this story: <strong class="topic-highlight">' + currentPlotText + '</strong>';
    return getPrepDesc();
  }
  if (currentChallenge === 'topic' && currentTopicText) {
    return 'Prep time for talking about <strong class="topic-highlight">' + currentTopicText + '</strong>';
  }
  return getPrepDesc();
}

// Returns "You'll get X seconds to [lowercase prompt]" (no trailing period) for the intro screen.
function getIntroDesc() {
  const challengeConfig = getChallengeConfig();
  if (challengeConfig.introDesc) return challengeConfig.introDesc;
  if (currentChallenge === 'story') {
    const seconds = getEffectiveTime('story');
    const ptPhrase = currentPromptType?.introPhrase || 'tell a story';
    const fwkPart  = currentFramework ? `, using the ${currentFramework.name} framework` : '';
    return `You'll get ${seconds} seconds to ${ptPhrase}${fwkPart}`;
  }
  const rawPrompt = getEffectivePromptText();
  if (!rawPrompt) return '';
  const seconds = getEffectiveTime();
  const lower = rawPrompt.charAt(0).toLowerCase() + rawPrompt.slice(1);
  const stripped = lower.replace(/[.!?]+$/, '');
  return `You'll get ${seconds} seconds to ${stripped}`;
}

  clearFrameworkOverlay();
  if (!currentFramework) return;

  const wrap = document.getElementById('framework-active-wrap');
  wrap.style.display = 'flex';
  document.getElementById('screen-active').classList.add('has-framework');

  const showEmoji = currentFramework.elements && currentFramework.elements.length <= 4;

  if (currentFramework.mode === 'sequential') {
    document.getElementById('screen-active').classList.add('has-seq-framework');
    document.getElementById('prompt-display').innerHTML = '';
    fwkElementTaps = currentFramework.elements.map(() => null);
    fwkCurrentStep = 0;
    const n = currentFramework.elements.length;

    // Optional prompt line — suppressed when framework sets hidePrompt: true
    if (!currentFramework.hidePrompt) {
      const effectivePrompt = getEffectivePromptHTML();
      if (effectivePrompt) {
        const promptEl = document.createElement('p');
        promptEl.className = 'fwk-overlay-prompt';
        promptEl.innerHTML = effectivePrompt;
        wrap.appendChild(promptEl);
      }
    }

    // Guidance label — tells user how to advance at the moment it matters
    const guidance = document.createElement('div');
    guidance.className = 'framework-guidance-label';
    guidance.textContent = 'Tap → to move to the next section';
    wrap.appendChild(guidance);

    // Numbered list — each step shows full hint text, active item has inline → button
    const list = document.createElement('div');
    list.className = 'fwk-seq-list';
    const itemEls = [];

    currentFramework.elements.forEach((el, i) => {
      const item = document.createElement('div');
      item.className = 'fwk-seq-item seq-upcoming';

      const textSpan = document.createElement('span');
      textSpan.className = 'fwk-seq-item-text';
      textSpan.textContent = `${i + 1}. ${el.label}: ${el.hint}`;

      const btn = document.createElement('button');
      btn.className = 'fwk-seq-inline-btn';
      btn.innerHTML = '&rarr;';
      btn.style.display = 'none';

      btn.onclick = () => {
        if (fwkElementTaps[i] !== null) return;
        playPop();
        fwkElementTaps[i] = challengeNow();
        const wasLastStep = i === n - 1;
        if (!wasLastStep) {
          fwkCurrentStep++;
          updateSeqState();
        } else {
          updateSeqState();
          captureFrameworkEndTime();
          stopTimer();
          playEnd();
          setTimeout(showTimesUp, 350);
        }
      };

      item.appendChild(textSpan);
      item.appendChild(btn);
      itemEls.push({ item, btn });
      list.appendChild(item);
    });

    const updateSeqState = () => {
      itemEls.forEach(({ item, btn }, idx) => {
        item.classList.remove('seq-active', 'seq-upcoming', 'seq-done');
        btn.style.display = 'none';
        if (fwkElementTaps[idx] !== null) {
          item.classList.add('seq-done');
        } else if (idx === fwkCurrentStep) {
          item.classList.add('seq-active');
          btn.style.display = '';
        } else {
          item.classList.add('seq-upcoming');
        }
      });
    };

    updateSeqState();
    wrap.appendChild(list);

  } else if (currentFramework.mode === 'parallel') {
    fwkElementTaps = currentFramework.elements.map(() => null);

    // Overlay owns the content area — clear prompt-display and raise the overlay
    document.getElementById('prompt-display').innerHTML = '';
    document.getElementById('screen-active').classList.add('has-parallel-framework');

    // Prompt rendered inside overlay
    const parallelPrompt = getEffectivePromptHTML();
    if (parallelPrompt) {
      const promptEl = document.createElement('p');
      promptEl.className = 'fwk-overlay-prompt';
      promptEl.innerHTML = parallelPrompt;
      wrap.appendChild(promptEl);
    }

    // Guidance label
    const guidanceText = 'Tap each point as you make it';
    const guidance = document.createElement('div');
    guidance.className = 'framework-guidance-label';
    guidance.textContent = guidanceText;
    wrap.appendChild(guidance);

    const row = document.createElement('div');
    row.className = 'fwk-boxes-row';

    currentFramework.elements.forEach((el, i) => {
      const box = document.createElement('button');
      box.className = 'fwk-box';
      box.innerHTML = (showEmoji && el.emoji ? `<span class="fwk-box-emoji">${el.emoji}</span>` : '')
        + `<span class="fwk-box-label">${el.label}</span>`;

      box.onclick = () => {
        if (fwkElementTaps[i] !== null) return; // one-tap only
        playPop();
        fwkElementTaps[i] = challengeNow();
        box.classList.add('tapped');
        // auto-complete when all elements tapped
        if (fwkElementTaps.every(t => t !== null)) {
          captureFrameworkEndTime();
          stopTimer();
          playEnd();
          setTimeout(showTimesUp, 350);
        }
      };

      row.appendChild(box);
    });

    wrap.appendChild(row);

  } else if (currentFramework.mode === 'counter') {
    fwkTapCount = 0;

    // Overlay owns the content area — clear prompt-display and raise the overlay
    document.getElementById('prompt-display').innerHTML = '';
    document.getElementById('screen-active').classList.add('has-counter-framework');

    // Prompt rendered inside overlay
    const counterPrompt = getEffectivePromptHTML();
    if (counterPrompt) {
      const promptEl = document.createElement('p');
      promptEl.className = 'fwk-overlay-prompt';
      promptEl.innerHTML = counterPrompt;
      wrap.appendChild(promptEl);
    }

    const btn = document.createElement('button');
    btn.className = 'fwk-counter-btn';
    const label = currentFramework.buttonLabel || currentFramework.postChallenge.label || 'Count';
    btn.innerHTML = `<span class="fwk-counter-label">${label}</span>`;
    btn.onclick = () => {
      playPop();
      fwkTapCount++;
      btn.classList.add('fwk-counter-bump');
      setTimeout(() => btn.classList.remove('fwk-counter-bump'), 200);
    };
    wrap.appendChild(btn);
  }
}

function renderFrameworkZone() {
  const zone = document.getElementById('framework-zone');
  zone.innerHTML = '';
  zone.style.display = 'none';
  if (!currentFramework) return;

  const pc = currentFramework.postChallenge;

  if (pc.type === 'time-distribution') {
    const SEG_COLORS = ['#eab308', '#60a5fa', '#f472b6', '#34d399', '#fb923c', '#a78bfa', '#38bdf8'];
    const elements   = currentFramework.elements;
    const totalMs    = fwkChallengeEndTime - fwkChallengeStartTime;
    const segments   = []; // { el, durMs, reached, color }

    if (currentFramework.mode === 'sequential') {
      if (fwkElementTaps.every(t => t === null)) {
        segments.push({ el: elements[0], durMs: totalMs, reached: true, color: SEG_COLORS[0] });
        for (let i = 1; i < elements.length; i++) {
          segments.push({ el: elements[i], durMs: 0, reached: false, color: SEG_COLORS[i % SEG_COLORS.length] });
        }
      } else {
      // Sequential: tap[i] = when step i ENDED; step 0 starts at challengeStart
        for (let i = 0; i < elements.length; i++) {
          const startMs = i === 0 ? fwkChallengeStartTime : fwkElementTaps[i - 1];
          if (startMs === null) {
            // Previous step was never tapped — this step never started
            segments.push({ el: elements[i], durMs: 0, reached: false, color: SEG_COLORS[i % SEG_COLORS.length] });
          } else if (fwkElementTaps[i] !== null) {
            // Step completed (tapped to move on)
            segments.push({ el: elements[i], durMs: fwkElementTaps[i] - startMs, reached: true, color: SEG_COLORS[i % SEG_COLORS.length] });
          } else {
            // Final active step — ran to challenge end
            segments.push({ el: elements[i], durMs: fwkChallengeEndTime - startMs, reached: true, color: SEG_COLORS[i % SEG_COLORS.length] });
            for (let j = i + 1; j < elements.length; j++) {
              segments.push({ el: elements[j], durMs: 0, reached: false, color: SEG_COLORS[j % SEG_COLORS.length] });
            }
            break;
          }
        }
      }
    } else {
      // Parallel: taps sorted by time; each tap's duration = time to next tap (or challenge end)
      const tapped = fwkElementTaps
        .map((t, i) => ({ i, t }))
        .filter(x => x.t !== null)
        .sort((a, b) => a.t - b.t);

      if (tapped.length === 0) return;

      const tappedSet = new Set(tapped.map(x => x.i));
      tapped.forEach((tap, k) => {
        const segEnd = k + 1 < tapped.length ? tapped[k + 1].t : fwkChallengeEndTime;
        segments.push({ el: elements[tap.i], durMs: segEnd - tap.t, reached: true, color: SEG_COLORS[k % SEG_COLORS.length] });
      });
      elements.forEach((el, i) => {
        if (!tappedSet.has(i)) segments.push({ el, durMs: 0, reached: false, color: SEG_COLORS[segments.length % SEG_COLORS.length] });
      });
    }

    const reachedSegs  = segments.filter(s => s.reached && s.durMs > 0);
    const reachedTotal = reachedSegs.reduce((sum, s) => sum + s.durMs, 0);

    if (reachedSegs.length === 0) return;

    // Color bar
    const bar = document.createElement('div');
    bar.className = 'fwk-dist-bar';
    reachedSegs.forEach(seg => {
      const pct   = reachedTotal > 0 ? Math.max(1, Math.round((seg.durMs / reachedTotal) * 100)) : 0;
      const segEl = document.createElement('div');
      segEl.className        = 'fwk-dist-seg';
      segEl.style.width      = '0%';
      segEl.style.background = seg.color;
      bar.appendChild(segEl);
      setTimeout(() => { segEl.style.width = `${pct}%`; }, 60);
    });

    // Legend
    const legend = document.createElement('div');
    legend.className = 'fwk-dist-legend';
    segments.forEach(seg => {
      const item = document.createElement('div');
      item.className = 'fwk-dist-legend-item' + (seg.reached && seg.durMs > 0 ? '' : ' unreached');

      const swatch = document.createElement('span');
      swatch.className        = 'fwk-dist-legend-swatch';
      swatch.style.background = seg.color;

      const lbl = document.createElement('span');
      lbl.className   = 'fwk-dist-legend-label';
      lbl.textContent = seg.el.label;

      const time = document.createElement('span');
      time.className   = 'fwk-dist-legend-time';
      time.textContent = seg.reached && seg.durMs > 0
        ? Math.round(seg.durMs / 1000) + 's'
        : '—';

      item.appendChild(swatch);
      item.appendChild(lbl);
      item.appendChild(time);
      legend.appendChild(item);
    });

    zone.appendChild(bar);
    zone.appendChild(legend);
    zone.style.display = 'block';

  } else if (pc.type === 'completion') {
    const row = document.createElement('div');
    row.className = 'fwk-completion-row';
    currentFramework.elements.forEach((el, i) => {
      const box = document.createElement('div');
      box.className = 'fwk-completion-box' + (fwkElementTaps[i] !== null ? ' tapped' : '');
      box.innerHTML = (el.emoji ? `<span>${el.emoji}</span>` : '') + `<span>${el.label}</span>`;
      row.appendChild(box);
    });
    zone.appendChild(row);
    zone.style.display = 'block';

  } else if (pc.type === 'counter') {
    const sentence = document.createElement('p');
    sentence.className = 'fwk-counter-sentence';
    if (pc.resultSentence) {
      const parts = pc.resultSentence.split('{count}');
      sentence.appendChild(document.createTextNode(parts[0]));
      const numSpan = document.createElement('span');
      numSpan.className = 'fwk-counter-sentence-num';
      numSpan.textContent = fwkTapCount;
      sentence.appendChild(numSpan);
      if (parts[1]) sentence.appendChild(document.createTextNode(parts[1]));
    } else {
      const numSpan = document.createElement('span');
      numSpan.className = 'fwk-counter-sentence-num';
      numSpan.textContent = fwkTapCount;
      sentence.appendChild(numSpan);
      if (pc.label) sentence.appendChild(document.createTextNode(' ' + pc.label));
    }
    zone.appendChild(sentence);
    zone.style.display = 'block';

  } else if (pc.type === 'completion-timed') {
    // Split into tapped (sorted by tap time) and untapped (in defined order)
    const tappedItems = currentFramework.elements
      .map((el, i) => ({ el, i, tapTime: fwkElementTaps[i] }))
      .filter(x => x.tapTime !== null)
      .sort((a, b) => a.tapTime - b.tapTime);
    const untappedItems = currentFramework.elements
      .map((el, i) => ({ el, i, tapTime: null }))
      .filter(x => fwkElementTaps[x.i] === null);

    const row = document.createElement('div');
    row.className = 'fwk-ct-row';

    // Render tapped items in tap order, duration = gap between consecutive taps
    tappedItems.forEach((item, rank) => {
      const prevTime = rank === 0 ? fwkChallengeStartTime : tappedItems[rank - 1].tapTime;
      const durSec = Math.max(0, Math.round((item.tapTime - prevTime) / 1000));

      const card = document.createElement('div');
      card.className = 'fwk-ct-item tapped';
      if (item.el.emoji) {
        const emo = document.createElement('div');
        emo.className = 'fwk-ct-emoji';
        emo.textContent = item.el.emoji;
        card.appendChild(emo);
      }
      const lbl = document.createElement('div');
      lbl.className = 'fwk-ct-label';
      lbl.textContent = item.el.label;
      card.appendChild(lbl);
      const check = document.createElement('div');
      check.className = 'fwk-ct-check';
      check.textContent = '✓';
      card.appendChild(check);
      const timeEl = document.createElement('div');
      timeEl.className = 'fwk-ct-time';
      timeEl.textContent = durSec + 's';
      card.appendChild(timeEl);
      row.appendChild(card);
    });

    // Render untapped items last, in defined order, with cross and no time
    untappedItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'fwk-ct-item';
      if (item.el.emoji) {
        const emo = document.createElement('div');
        emo.className = 'fwk-ct-emoji';
        emo.textContent = item.el.emoji;
        card.appendChild(emo);
      }
      const lbl = document.createElement('div');
      lbl.className = 'fwk-ct-label';
      lbl.textContent = item.el.label;
      card.appendChild(lbl);
      const check = document.createElement('div');
      check.className = 'fwk-ct-check';
      check.textContent = '✗';
      card.appendChild(check);
      row.appendChild(card);
    });

    zone.appendChild(row);
    zone.style.display = 'block';
  }
}

const TAKE_COUNTER_DEFAULT = 'Day X, Take [n]';

function tcTemplateKey(challenge) { return 'takeTemplate_' + (challenge || 'global'); }
function tcNKey(challenge)        { return 'takeN_' + (challenge || 'global'); }

function getTakeTemplate(challenge) {
  return localStorage.getItem(tcTemplateKey(challenge)) || '';
}
function setTakeTemplate(challenge, val) {
  localStorage.setItem(tcTemplateKey(challenge), val);
}
function getTakeN(challenge) {
  return parseInt(localStorage.getItem(tcNKey(challenge)) || '1', 10);
}
function setTakeN(challenge, n) {
  localStorage.setItem(tcNKey(challenge), String(n));
}
function incrementTakeN(challenge) {
  setTakeN(challenge, getTakeN(challenge) + 1);
}

function renderTakeDisplay() {
  const el = document.getElementById('take-counter-display');
  const versionEl = document.getElementById('version-display');
  const onSelect = document.getElementById('screen-select').classList.contains('active');
  // Version stamp visible only on the select screen
  if (versionEl) versionEl.style.display = onSelect ? 'block' : 'none';
  // Take counter hidden on select screen
  const template = getTakeTemplate(currentChallenge);
  if (onSelect || !template) {
    el.style.display = 'none';
    return;
  }
  const n = getTakeN(currentChallenge);
  el.textContent = template.replace(/\[n\]/gi, n);
  el.style.display = 'block';
}

function openTakeSheet() {
  const sheet   = document.getElementById('take-counter-sheet');
  const input   = document.getElementById('take-counter-input');
  const nInput  = document.getElementById('take-counter-n-input');
  input.value   = getTakeTemplate(currentChallenge);
  nInput.value  = getTakeN(currentChallenge);
  sheet.classList.add('visible');
  setTimeout(() => input.focus(), 80);
}

function closeTakeSheet() {
  const input  = document.getElementById('take-counter-input');
  const nInput = document.getElementById('take-counter-n-input');
  setTakeTemplate(currentChallenge, input.value.trim());
  const n = parseInt(nInput.value, 10);
  if (!isNaN(n) && n >= 1) setTakeN(currentChallenge, n);
  document.getElementById('take-counter-sheet').classList.remove('visible');
  renderTakeDisplay();
}

// ============================================================
// VISIBILITY TOGGLE
// ============================================================

let uiHidden = false;
let visTouchStartX = 0;
let visTouchStartY = 0;
let restoreTouchStartX = 0;
let visLastTapTime = 0;
const VIS_DOUBLE_TAP_MS = 300;
let wasTimerRunning = false;
let wasPrepTimerRunning = false;
let slideOutScreen = null;

const visBtn = document.getElementById('vis-toggle-btn');
const appEl  = document.getElementById('app');
const restoreOverlay = document.getElementById('ui-restore-overlay');

function hideUI(slideMode) {
  uiHidden = true;
  wasTimerRunning     = timerRunning;
  wasPrepTimerRunning = prepTimerRunning;
  if (timerRunning)     pauseTimer();
  if (prepTimerRunning) pausePrepTimer();

  if (slideMode) {
    const activeScreen = document.querySelector('.screen.active');
    slideOutScreen = activeScreen || null;
    if (activeScreen) {
      activeScreen.classList.add('ui-slide-out');
      // After animation: hide app, then remove slide class (invisible, so no flicker)
      setTimeout(() => {
        appEl.classList.add('ui-hidden');
        requestAnimationFrame(() => activeScreen.classList.remove('ui-slide-out'));
      }, 350);
    } else {
      appEl.classList.add('ui-hidden');
    }
  } else {
    slideOutScreen = null;
    appEl.classList.add('ui-hidden');
  }
  restoreOverlay.style.display = 'block';
}

function restoreUI(slideMode) {
  uiHidden = false;
  restoreOverlay.style.display = 'none';

  if (slideMode && slideOutScreen) {
    // Slide back in from left
    const screen = slideOutScreen;
    slideOutScreen = null;
    appEl.classList.remove('ui-hidden');
    screen.classList.add('ui-slide-in');
    setTimeout(() => screen.classList.remove('ui-slide-in'), 360);
  } else {
    slideOutScreen = null;
    appEl.classList.remove('ui-hidden');
  }

  if (wasTimerRunning)     resumeTimer();
  if (wasPrepTimerRunning) resumePrepTimer();
  wasTimerRunning     = false;
  wasPrepTimerRunning = false;
}

// Touch anywhere on screen (not on interactive elements) to show/hide UI
appEl.addEventListener('touchstart', e => {
  if (uiHidden) return;
  visTouchStartX = e.touches[0].clientX;
  visTouchStartY = e.touches[0].clientY;
}, { passive: true });

appEl.addEventListener('touchend', e => {
  if (uiHidden) return;
  // Pass through if touch landed on any interactive element or open sheet/overlay
  if (e.target.closest('button, input, label, a, select, #framework-active-wrap, .framework-picker-overlay, .take-counter-sheet-overlay')) return;
  // Only trigger in the middle vertical third of the app container
  const rect = appEl.getBoundingClientRect();
  const pct = (visTouchStartY - rect.top) / rect.height;
  if (pct < 0.33 || pct > 0.67) return;
  const dx = e.changedTouches[0].clientX - visTouchStartX;
  const dy = e.changedTouches[0].clientY - visTouchStartY;
  const isSwipeLeft = dx < -40 && Math.abs(dx) > Math.abs(dy) * 1.5;
  const isTap       = Math.abs(dx) < 12 && Math.abs(dy) < 12;
  if (isSwipeLeft) {
    hideUI(true);
  } else if (isTap) {
    const now = Date.now();
    if (now - visLastTapTime < VIS_DOUBLE_TAP_MS) {
      visLastTapTime = 0;
      hideUI(false);
    } else {
      visLastTapTime = now;
    }
  }
}, { passive: true });

// Desktop fallback — click on empty area
appEl.addEventListener('click', e => {
  if (uiHidden || ('ontouchstart' in window)) return;
  if (e.target.closest('button, input, label, a, select, #framework-active-wrap')) return;
  hideUI(false);
});

restoreOverlay.addEventListener('touchstart', e => {
  restoreTouchStartX = e.touches[0].clientX;
}, { passive: true });

restoreOverlay.addEventListener('touchend', e => {
  if (!uiHidden) return;
  const dx = e.changedTouches[0].clientX - restoreTouchStartX;
  const isSwipeRight = dx > 28;
  restoreUI(isSwipeRight);
}, { passive: true });

restoreOverlay.addEventListener('click', () => {
  if (!uiHidden) return;
  restoreUI(false);
});
