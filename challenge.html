<!--
  ================================================================
  VIDEO CHALLENGE APP  —  challenge.html
  ================================================================
  Single self-contained HTML file. No build tools, no dependencies.
  Designed for 9:16 (portrait) aspect ratio with camera feed behind
  the UI. Intended for use during video recording.

  ── SCREENS ──────────────────────────────────────────────────
  1. screen-select   Challenge selection menu
  2. screen-intro    Challenge description + optional prep toggle
  2b. screen-prep    Prep timer countdown (if enabled)
  3. screen-active   Live challenge with countdown timer
  4. screen-timesup  End screen

  ── CHALLENGES ───────────────────────────────────────────────
  story         3 random words, 60s. Words fade after 3s. Reroll ✓
  tongue        Tongue twister, 30s. Reroll ✓
  topic         Random topic, 60s. Reroll ✓
  plot          Story premise, 60s. Reroll ✓
  selfknowledge Reflective prompt (WNRS/Esther Perel style), 60s.
                Prompt fades after 3s. Reroll ✓
  interview     Behavioural interview question, 60s. Reroll ✓
  gratitude     Fixed prompt ("3 things I'm grateful for"), 60s.
                No reroll. Prompt fades after 3s.
  articulation  Long passage to read aloud, 30s. Reroll ✓ (disabled)
  articulation2 Line-by-line scroll passage, 30s. Tap anywhere to advance.
                No reroll. No prep time. Tracks lines reached.
                Times up: self-rate Progress, Accuracy, Flow (1–5 stars).

  ── CONFIG FLAGS ─────────────────────────────────────────────
  CONFIG.{challenge}.enabled  Show in selection screen
  CONFIG.{challenge}.public   Include in future public release
  CONFIG.prepTime.enabled     Show "Add prep time" toggle globally

  ── KEY DESIGN DECISIONS ─────────────────────────────────────
  - Prompt labels ("Your story" etc.) are hidden — prompt alone
    is shown; the label was redundant.
  - Times up screen: no prompt repeat for most challenges.
    Exceptions: gratitude shows a quote; art2 shows line count.
  - Prep time fades prompt after 3s on prep screen.
    Word fade also fires after 3s on active screen for challenges
    that use it (story, selfknowledge, gratitude).
  - art2 scroll container height is set dynamically via RAF;
    a CSS fallback height prevents full-text flash before JS runs.
  - GO button is same size/position as the active timer circle
    (bottom-left, 84px). Prep toggle sits to its right.
  ================================================================
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Challenge</title>
<style>

/* ============================================================
   BASE
   ============================================================ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* Prevent double-tap zoom on all interactive elements */
button, .go-circle, .prep-toggle, .challenge-btn {
  touch-action: manipulation;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================
   9:16 APP CONTAINER
   ============================================================ */

.app {
  position: relative;
  /* Width is constrained by both viewport width and height */
  width: min(100vw, calc(100vh * 9 / 16));
  height: min(100vh, calc(100vw * 16 / 9));
  max-height: 100vh;
  background: #111;
  overflow: hidden;
}

/* ============================================================
   CAMERA
   ============================================================ */

#camera {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1); /* mirror for selfie */
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
}

#camera.visible { opacity: 1; }

/* ============================================================
   SCREENS
   ============================================================ */

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.screen.active {
  opacity: 1;
  pointer-events: auto;
}

/* ============================================================
   TAP ANIMATION (shared)
   ============================================================ */

@keyframes tapAnim {
  0%   { transform: scale(1); }
  28%  { transform: scale(0.88); }
  100% { transform: scale(1); }
}

.tapping {
  animation: tapAnim 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}

/* ============================================================
   BACK BUTTON (shared)
   ============================================================ */

.back-btn {
  position: absolute;
  top: max(28px, 5%);
  left: max(18px, 4%);
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
  cursor: pointer;
  z-index: 10;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Shared SVG icon sizing for all icon buttons */
.back-btn svg,
.prep-skip-btn svg,
.help-btn svg,
.reroll-btn svg {
  display: block;
  filter: drop-shadow(0 1px 8px rgba(0,0,0,0.9));
}

.back-btn svg,
.prep-skip-btn svg,
.help-btn svg {
  width: clamp(20px, 3.4vh, 26px);
  height: clamp(20px, 3.4vh, 26px);
}

.reroll-btn svg {
  width: clamp(16px, 2.7vh, 21px);
  height: clamp(16px, 2.7vh, 21px);
}

/* ============================================================
   SCREEN 1 -SELECTION
   ============================================================ */

#screen-select {
  /* Camera shows through -just a subtle dark scrim for readability */
  background: rgba(0,0,0,0.28);
  align-items: flex-start;
  justify-content: flex-start;
}

.select-inner {
  padding: clamp(48px, 9%, 80px) clamp(18px, 5%, 36px) 0;
  display: flex;
  flex-direction: column;
  gap: clamp(12px, 2vh, 20px);
}

.select-title {
  color: white;
  font-size: clamp(15px, 2.4vh, 22px);
  font-weight: 300;
  letter-spacing: 0.04em;
  text-shadow: 0 1px 14px rgba(0,0,0,0.95), 0 2px 4px rgba(0,0,0,0.7);
}

.challenge-options {
  display: flex;
  flex-wrap: wrap;
  gap: clamp(8px, 1.4vh, 12px);
}

.challenge-btn {
  background: rgba(0,0,0,0.35);
  border: 1.5px solid rgba(255,255,255,0.45);
  color: white;
  font-size: clamp(13px, 2.1vh, 18px);
  font-weight: 400;
  padding: clamp(7px, 1.2vh, 11px) clamp(14px, 3.5%, 22px);
  border-radius: 30px;
  cursor: pointer;
  letter-spacing: 0.02em;
  user-select: none;
  text-shadow: 0 1px 8px rgba(0,0,0,0.8);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}

/* ============================================================
   SCREEN 2 -INTRO
   ============================================================ */

#screen-intro {
  /* camera behind this */
}

/* Label sits in the top bar, centred between back and help icons */
.intro-label {
  position: absolute;
  top: max(28px, 5%);
  left: 50%;
  transform: translateX(-50%);
  height: clamp(20px, 3.4vh, 26px);
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  color: rgba(255,255,255,0.65);
  font-size: clamp(11px, 1.8vh, 15px);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  z-index: 5;
}

/* Description area — left-aligned, starts just below the top bar */
.intro-inner {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  padding: max(80px, 14%) clamp(18px, 5%, 36px) max(130px, 24%);
}

.intro-desc {
  color: white;
  font-size: clamp(18px, 3.2vh, 28px);
  font-weight: 300;
  line-height: 1.55;
  text-align: left;
  text-shadow: 0 1px 14px rgba(0,0,0,0.95), 0 2px 4px rgba(0,0,0,0.7);
}

/* Intro bottom row — two-column layout: GO circle left, pill+toggle right */
#intro-bottom-row {
  position: absolute;
  bottom: calc(max(20px, 3%) + env(safe-area-inset-bottom, 0px));
  left: max(20px, 5%);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 16px;
}

#intro-right-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  justify-content: center;
}

/* GO circle */
.go-circle {
  width: 84px;
  height: 84px;
  background: #22c55e;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(22px, 4vh, 32px);
  font-weight: 800;
  color: white;
  cursor: pointer;
  user-select: none;
  box-shadow: 0 6px 30px rgba(0,0,0,0.5);
  letter-spacing: -0.02em;
  flex-shrink: 0;
}

/* Prep toggle — bottom row of right group */
#prep-toggle-wrap {
  align-items: center;
  margin-top: 0;
}

/* ============================================================
   SCREEN 3 -ACTIVE CHALLENGE
   ============================================================ */

#screen-active {
  /* camera behind */
}

/* Prompt area — starts just below the top bar */
.prompt-area {
  position: absolute;
  top: max(64px, 11%);
  left: 0;
  right: 0;
  padding: 0 clamp(18px, 5%, 36px);
  text-align: left;
}

/* Prompt label — hidden; prompt content alone is sufficient */
.prompt-label {
  display: none;
}

/* Story: 3 large words stacked */
.words-list {
  display: flex;
  flex-direction: column;
  gap: clamp(2px, 0.5vh, 6px);
  opacity: 1;
  transition: opacity 1.2s ease;
}

.words-list.faded {
  opacity: 0.35;
}

/* Prep screen prompt fade */
#prep-prompt-display {
  transition: opacity 1.2s ease;
}

.word-item {
  color: white;
  font-size: clamp(34px, 6.5vh, 58px);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.02em;
  text-shadow: 0 2px 16px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.8);
}

/* Articulation: scrollable long passage */
.articulation-scroll {
  height: clamp(78px, 13vh, 108px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.articulation-scroll::-webkit-scrollbar {
  display: none;
}

.articulation-text {
  color: white;
  font-size: clamp(15px, 2.5vh, 20px);
  font-weight: 400;
  line-height: 1.55;
  text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
}

/* Story plot */
.plot-text {
  color: white;
  font-size: clamp(22px, 4vh, 34px);
  font-weight: 300;
  line-height: 1.4;
  text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
}

/* Articulation 2: scroll window -height & padding set dynamically by JS */
.art2-scroll {
  overflow: hidden;
  /* Fallback height so content is clipped before JS measures and sets the exact value */
  height: clamp(72px, 12.6vh, 104px);
  /* Aggressive fade: only the middle band (roughly 1 line) is fully visible */
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.25) 33%, black 41%, black 59%, rgba(0,0,0,0.7) 67%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.25) 33%, black 41%, black 59%, rgba(0,0,0,0.7) 67%, transparent 100%);
}

.art2-text {
  color: white;
  font-size: clamp(16px, 2.8vh, 23px);
  font-weight: 400;
  line-height: 1.5;
  text-shadow: 0 2px 16px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.8);
}


/* Timesup completion line */
.timesup-completion {
  display: none;
  color: rgba(255,255,255,0.65);
  font-size: clamp(13px, 2.1vh, 18px);
  font-weight: 300;
  line-height: 1.4;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}

/* Art2 compact title — floats in the top bar at the same level as the help icon */
.timesup-title-compact {
  position: absolute !important;
  top: max(28px, 5%);
  left: 50%;
  transform: translateX(-50%);
  height: clamp(20px, 3.4vh, 26px);
  display: flex !important;
  align-items: center;
  white-space: nowrap;
  font-size: clamp(20px, 3.4vh, 28px) !important;
  font-weight: 600 !important;
  color: white !important;
  letter-spacing: normal !important;
  text-transform: none !important;
  text-shadow: 0 1px 10px rgba(0,0,0,0.9) !important;
}

/* art2-mode: used only to show the art2-score-section */

/* Art2 self-scoring section */
.art2-score-section {
  display: none;
  width: 100%;
  flex-direction: column;
  gap: clamp(12px, 2.2vh, 20px);
}

.art2-score-section.visible {
  display: flex;
}

/* Metric rows (Progress / Accuracy / Flow) */
.art2-metric-row {
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.6vw, 13px);
  width: 100%;
}

.art2-metric-label {
  color: white;
  font-size: clamp(13px, 2.2vh, 18px);
  font-weight: 600;
  width: 5.2em;
  flex-shrink: 0;
  text-align: left;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}

/* Progress bar — no track, yellow fill only, square left corner / pill right */
/* Height matches the star size so all three rows feel the same weight */
.art2-progress-outer {
  flex: 1;
  position: relative;
  height: clamp(30px, 5.2vh, 42px);
}

.art2-progress-fill {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  background: #eab308;
  border-radius: 0 8px 8px 0;
  width: 0%;
  transition: width 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* Percentage label — absolutely positioned just off the right end of the fill */
.art2-progress-pct {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-size: clamp(13px, 2.2vh, 18px);
  font-weight: 600;
  white-space: nowrap;
  padding-left: clamp(6px, 1vw, 8px);
  text-shadow: 0 1px 6px rgba(0,0,0,0.8);
}

/* Inside bar variant (>80%) — white text so it's readable on yellow */
.art2-progress-pct.inside {
  padding-left: 0;
  padding-right: clamp(10px, 1.6vw, 14px);
  color: white;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  left: auto !important;
  right: 0;
}

/* Star rows */
.art2-stars {
  flex: 1;
  display: flex;
  gap: clamp(8px, 1.8vw, 14px);
  align-items: center;
}

.art2-star {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  opacity: 0.3;
  transition: color 0.12s ease, opacity 0.12s ease;
}

.art2-star.filled {
  color: #eab308;
  opacity: 1;
}

.art2-star svg {
  display: block;
  width: clamp(30px, 5.2vh, 42px);
  height: clamp(30px, 5.2vh, 42px);
}

/* Tongue twister: quoted text */
.twister-text {
  color: white;
  font-size: clamp(19px, 3.4vh, 30px);
  font-weight: 400;
  line-height: 1.45;
  text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 1px 4px rgba(0,0,0,0.7);
}

.reroll-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  padding: 4px;
  cursor: pointer;
  user-select: none;
}

/* Timer -bottom left */
.timer-wrap {
  position: absolute;
  bottom: calc(max(20px, 3%) + env(safe-area-inset-bottom, 0px));
  left: max(20px, 5%);
  display: flex;
  align-items: center;
  flex-direction: row;
  gap: clamp(8px, 1.5vw, 14px);
}

#timer-svg {
  filter: drop-shadow(0 2px 10px rgba(0,0,0,0.7));
  flex-shrink: 0;
}

.timer-num {
  color: white;
  font-size: clamp(28px, 5vh, 44px);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 10px rgba(0,0,0,0.85);
  min-width: 2ch;
  line-height: 1;
  text-align: right;
}

/* ============================================================
   SCREEN 4 -TIME'S UP
   ============================================================ */

#screen-timesup {
  /* camera behind -content at top, button at bottom */
  align-items: center;
  justify-content: flex-start;
}

.timesup-inner {
  text-align: center;
  padding: clamp(100px, 18%, 136px) max(16px, 4%) 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(10px, 2vh, 20px);
}

.timesup-title {
  color: white;
  font-size: clamp(32px, 5.8vh, 52px);
  font-weight: 700;
  text-shadow: 0 2px 20px rgba(0,0,0,0.95);
  letter-spacing: -0.01em;
}

.timesup-sub {
  color: rgba(255,255,255,0.8);
  font-size: clamp(18px, 3vh, 26px);
  font-weight: 300;
  text-shadow: 0 1px 10px rgba(0,0,0,0.9);
}

/* Gratitude timesup: sub question appears after the framework cards */
#screen-timesup.gratitude-mode .timesup-sub    { order: 3; }
#screen-timesup.gratitude-mode #framework-zone { order: 2; }

.timesup-prompt {
  color: rgba(255,255,255,0.55);
  font-size: clamp(13px, 2.1vh, 18px);
  line-height: 1.5;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  margin-top: clamp(4px, 1vh, 10px);
}

.timesup-quote-text {
  display: block;
  font-style: italic;
  color: rgba(255,255,255,0.78);
  font-size: clamp(14px, 2.3vh, 20px);
  font-weight: 300;
  line-height: 1.6;
  text-shadow: 0 1px 8px rgba(0,0,0,0.9);
}

.timesup-quote-attr {
  display: block;
  margin-top: clamp(10px, 1.8vh, 16px);
  color: rgba(255,255,255,0.35);
  font-size: clamp(11px, 1.7vh, 15px);
  font-weight: 400;
  font-style: normal;
  letter-spacing: 0.06em;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
}

.timesup-actions {
  position: absolute;
  bottom: calc(max(20px, 3.5%) + env(safe-area-inset-bottom, 0px));
  left: max(20px, 5%);
  right: max(20px, 5%);
  display: flex;
  gap: clamp(8px, 1.5vw, 12px);
}

.timesup-again-btn,
.timesup-menu-btn {
  flex: 1;
  font-size: clamp(14px, 2.3vh, 19px);
  padding: clamp(12px, 2.2vh, 18px) 8px;
  border-radius: 30px;
  cursor: pointer;
  letter-spacing: 0.02em;
  user-select: none;
  white-space: nowrap;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  text-align: center;
}

.timesup-again-btn {
  background: rgba(0,0,0,0.35);
  border: 1.5px solid rgba(255,255,255,0.45);
  color: white;
  font-weight: 500;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.timesup-menu-btn {
  background: rgba(255,255,255,0.12);
  border: 1.5px solid rgba(255,255,255,0.35);
  color: rgba(255,255,255,0.85);
  font-weight: 400;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

/* ============================================================
   PREP TOGGLE (on intro screen)
   ============================================================ */

.prep-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.prep-toggle input[type=checkbox] {
  display: none;
}

.prep-toggle-track {
  position: relative;
  width: 44px;
  height: 26px;
  background: rgba(255,255,255,0.2);
  border-radius: 13px;
  flex-shrink: 0;
  transition: background 0.2s ease;
}

.prep-toggle input:checked ~ .prep-toggle-track {
  background: #22c55e;
}

.prep-toggle-thumb {
  position: absolute;
  width: 20px;
  height: 20px;
  background: white;
  border-radius: 50%;
  top: 3px;
  left: 3px;
  transition: transform 0.2s ease;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

.prep-toggle input:checked ~ .prep-toggle-track .prep-toggle-thumb {
  transform: translateX(18px);
}

.prep-toggle-label {
  color: rgba(255,255,255,0.75);
  font-size: clamp(13px, 2.1vh, 17px);
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
}

/* ============================================================
   SCREEN -PREP TIME
   ============================================================ */

.prep-timer-outer {
  position: absolute;
  bottom: calc(max(20px, 3%) + env(safe-area-inset-bottom, 0px));
  left: max(20px, 5%);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: clamp(8px, 1.5vw, 14px);
}

.prep-timer-num-stack {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}

.prep-timer-label {
  color: white;
  font-size: clamp(12px, 2vh, 16px);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  text-shadow: 0 1px 6px rgba(0,0,0,0.9);
}

.prep-top-right {
  position: absolute;
  top: max(28px, 5%);
  right: max(18px, 4%);
  display: flex;
  align-items: center;
  gap: clamp(14px, 2.5vw, 22px);
  z-index: 10;
}

.prep-skip-btn,
.help-btn {
  background: none;
  border: none;
  -webkit-appearance: none;
  appearance: none;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ============================================================
   HELP OVERLAY
   ============================================================ */

.help-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(20px, 5%, 36px);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;

let audioCtx = null;

function getACtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, startDelay, dur, vol, type = 'sine') {
  try {
    const ac = getACtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.type = type;
    osc.frequency.value = freq;
    const t = ac.currentTime + startDelay;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  } catch(e) {
    // Audio unavailable -continue silently
  }
}

const timerPie = document.getElementById('timer-pie');
const timerNum = document.getElementById('timer-num');

function piePath(fraction) {
  if (fraction <= 0) return '';
  if (fraction >= 1) return 'M50,50 L50,0 A50,50 0 1,1 49.9999,0 Z';
  const a = (1 - fraction) * 2 * Math.PI;
  const x = 50 + 50 * Math.sin(a);
  const y = 50 - 50 * Math.cos(a);
  const large = fraction > 0.5 ? 1 : 0;
  return `M50,50 L${x},${y} A50,50 0 ${large},1 50,0 Z`;
}

function renderTimer(left) {
  timerPie.setAttribute('d', piePath(left / timerTotal));
  timerNum.textContent = left >= 1 ? Math.ceil(left) : '';
}

function timerTick() {
  const elapsed = (performance.now() - timerStartWall) / 1000;
  const left = Math.max(0, timerRemaining - elapsed);

  // Mid-challenge beeps every 10 seconds
  for (const t of [50, 40, 30, 20, 10]) {
    if (left <= t && !midBeepsPlayed.has(t)) {
      midBeepsPlayed.add(t);
      playMidBeep();
    }
  }

  // Countdown beeps for last 3 seconds
  for (const t of [3, 2, 1]) {
    if (left <= t && !beepsPlayed.has(t)) {
      beepsPlayed.add(t);
      playBeep();
    }
  }

  renderTimer(left);

  if (left > 0) {
    timerRAF = requestAnimationFrame(timerTick);
  } else {
    timerRunning = false;
    timerRemaining = 0;
    timerPie.setAttribute('d', '');
    timerNum.textContent = '';
    cancelWordFade();
    playEnd();
    setTimeout(showTimesUp, 350);
  }
}

function startTimer() {
  timerStartWall  = performance.now();
  timerRunning    = true;
  beepsPlayed     = new Set();
  midBeepsPlayed  = new Set();
  timerRAF        = requestAnimationFrame(timerTick);
}

// Virtual clock that only advances while the timer is running.
// Using this for framework taps means paused time (e.g. help overlay) is excluded
// from section durations on the results screen.
function challengeNow() {
  if (timerStartWall === null) {
    return (timerTotal - timerRemaining) * 1000;
  }
  const elapsedSinceResume = performance.now() - timerStartWall;
  return Math.min(timerTotal * 1000, (timerTotal - timerRemaining) * 1000 + elapsedSinceResume);
}

function pauseTimer() {
  if (!timerRunning) return;
  const elapsed = (performance.now() - timerStartWall) / 1000;
  timerRemaining = Math.max(0, timerRemaining - elapsed);
  cancelAnimationFrame(timerRAF);
  timerRunning  = false;
  timerStartWall = null;
}

function resumeTimer() {
  timerStartWall = performance.now();
  timerRunning   = true;
  timerRAF       = requestAnimationFrame(timerTick);
}

function stopTimer() {
  cancelAnimationFrame(timerRAF);
  timerRunning   = false;
  timerStartWall = null;
  timerRemaining = 0;
  cancelWordFade();
}

}

function prepTimerTick() {
  const elapsed = (performance.now() - prepTimerStartWall) / 1000;
  const left    = Math.max(0, prepTimerRemaining - elapsed);

  // Show Ready/Set/Go words on last 3 seconds (replaces beeps)
  if (left <= 3 && left > 2 && !prepBeepsPlayed.has(3)) {
    prepBeepsPlayed.add(3);
    prepTimerPie.setAttribute('d', '');
    prepTimerNum.textContent = '';
    showReadySetGo('Ready', false); playBeep();
  }
  if (left <= 2 && left > 1 && !prepBeepsPlayed.has(2)) {
    prepBeepsPlayed.add(2);
    showReadySetGo('Set', false); playBeep();
  }
  if (left <= 1 && !prepBeepsPlayed.has(1)) {
    prepBeepsPlayed.add(1);
    showReadySetGo('Go', true); playBeep();
  }

  if (left > 3) renderPrepTimer(left);

  if (left > 0) {
    prepTimerRAF = requestAnimationFrame(prepTimerTick);
  } else {
    prepTimerRunning = false;
    setTimeout(() => { hideReadySetGo(); playStart(); startActiveChallenge(); }, 700);
  }
}

function startPrepTimer() {
  prepTimerRemaining = 30;
  prepTimerTotal     = 30;
  prepTimerStartWall = performance.now();
  prepTimerRunning   = true;
  prepBeepsPlayed    = new Set();
  prepTimerRAF       = requestAnimationFrame(prepTimerTick);
}

function pausePrepTimer() {
  if (!prepTimerRunning) return;
  const elapsed      = (performance.now() - prepTimerStartWall) / 1000;
  prepTimerRemaining = Math.max(0, prepTimerRemaining - elapsed);
  cancelAnimationFrame(prepTimerRAF);
  prepTimerRunning   = false;
  prepTimerStartWall = null;
}

function resumePrepTimer() {
  prepTimerStartWall = performance.now();
  prepTimerRunning   = true;
  prepTimerRAF       = requestAnimationFrame(prepTimerTick);
}

function stopPrepTimer() {
  cancelAnimationFrame(prepTimerRAF);
  prepTimerRunning   = false;
  prepTimerStartWall = null;
  prepTimerRemaining = 30;
  prepTimerTotal     = 30;
  hideReadySetGo();
  prepTimerPie.setAttribute('d', '');
  prepTimerNum.textContent = '';
}

function startActiveChallenge() {
  clearPrepFade();
  if (currentFramework?.timeOverride) timerTotal = currentFramework.timeOverride;
  timerRemaining = timerTotal;
  showScreen('screen-active');
  // Hide reroll for challenges where it doesn't apply
  document.getElementById('reroll-btn').style.display =
    (currentChallenge === 'gratitude' || currentChallenge === 'articulation2') ? 'none' : '';
  fwkChallengeStartTime = challengeNow();
  renderFrameworkOverlay();
  startTimer();
}

// Articulation 2 helpers

function renderArticulation2(item) {
  document.getElementById('prompt-label').textContent = item.name;
  document.getElementById('prompt-display').innerHTML =
    `<div class="art2-scroll" id="art2-scroll"><p class="art2-text" id="art2-text">${item.text}</p></div>`;

  // Reset state
  artLineIdx    = 0;
  artScrollEl   = null;
  artLineHeight = 0;
  artTotalLines = 0;

  // Step 1: measure the rendered line height
  requestAnimationFrame(() => {
    const container = document.getElementById('art2-scroll');
    const textEl    = document.getElementById('art2-text');
    if (!container || !textEl) return;

    const computed = getComputedStyle(textEl);
    const lhVal    = computed.lineHeight;
    artLineHeight  = lhVal === 'normal'
      ? parseFloat(computed.fontSize) * 1.4
      : parseFloat(lhVal);

    // Container shows 3 line-heights: faint above + clear current + faint below
    container.style.height = `${artLineHeight * 3}px`;

    // Pad so line 1 starts in the centre (clear) zone, not at the top
    textEl.style.paddingTop    = `${artLineHeight}px`;
    // Pad bottom so the last line can also scroll to centre
    textEl.style.paddingBottom = `${artLineHeight}px`;

    // Step 2: re-measure after padding is applied
    requestAnimationFrame(() => {
      const maxScroll = container.scrollHeight - container.clientHeight;
      artTotalLines   = Math.max(1, Math.round(maxScroll / artLineHeight) + 1);
      artScrollEl     = container;
    });
  });
}

function art2Advance(dir) {
  if (!artScrollEl || artLineHeight === 0) return;
  const next = artLineIdx + dir;
  if (next < 0 || next >= artTotalLines) return;
  artLineIdx = next;
  artScrollEl.scrollTop = artLineIdx * artLineHeight;
}

function renderFrameworkOverlay() {
  clearFrameworkOverlay();
  if (!currentFramework) return;

  const wrap = document.getElementById('framework-active-wrap');
  wrap.style.display = 'flex';
  document.getElementById('screen-active').classList.add('has-framework');

  const showEmoji = currentFramework.elements && currentFramework.elements.length <= 4;

  if (currentFramework.mode === 'sequential') {
    document.getElementById('screen-active').classList.add('has-seq-framework');
    fwkElementTaps = currentFramework.elements.map(() => null);
    fwkCurrentStep = 0;
    const n = currentFramework.elements.length;

    // Progress strip — non-interactive indicators
    const strip = document.createElement('div');
    strip.className = 'fwk-seq-strip';
    const stepEls = [];

    currentFramework.elements.forEach((el) => {
      const step = document.createElement('div');
      step.className = 'fwk-seq-step seq-locked';
      step.innerHTML = (showEmoji && el.emoji ? `<span class="fwk-seq-emoji">${el.emoji}</span>` : '')
        + `<span class="fwk-seq-label">${el.label}</span>`
        + `<span class="fwk-seq-check">✓</span>`;
      stepEls.push(step);
      strip.appendChild(step);
    });

    // Hint line for current step
    const hintEl = document.createElement('p');
    hintEl.className = 'fwk-seq-hint';

    // Next button
    const nextBtn = document.createElement('button');
    nextBtn.className = 'fwk-seq-next';
    nextBtn.innerHTML = 'Next &rarr;';

    const updateSeqState = () => {
      stepEls.forEach((s, idx) => {
        s.classList.remove('seq-active', 'seq-done', 'seq-locked');
        if (idx < fwkCurrentStep)       s.classList.add('seq-done');
        else if (idx === fwkCurrentStep) s.classList.add('seq-active');
        else                              s.classList.add('seq-locked');
      });
      const currentEl = currentFramework.elements[fwkCurrentStep];
      hintEl.textContent = currentEl?.hint || '';
      const allDone = fwkElementTaps.every(t => t !== null);
      if (allDone) {
        nextBtn.style.display = 'none';
      } else {
        nextBtn.style.display = '';
        const onLastStep = fwkCurrentStep === n - 1;
        nextBtn.innerHTML   = onLastStep ? 'Done ✓' : 'Next &rarr;';
      }
    };

    nextBtn.onclick = () => {
      if (fwkElementTaps[fwkCurrentStep] !== null) return;
      playPop();
      fwkElementTaps[fwkCurrentStep] = challengeNow();
      const wasLastStep = fwkCurrentStep === n - 1;
      if (!wasLastStep) {
        fwkCurrentStep++;
        updateSeqState();
      } else {
        updateSeqState();
        stopTimer();
        playEnd();
        setTimeout(showTimesUp, 350);
      }
    };

    updateSeqState();
    wrap.appendChild(strip);
    wrap.appendChild(hintEl);
    wrap.appendChild(nextBtn);

  } else if (currentFramework.mode === 'parallel') {
    fwkElementTaps = currentFramework.elements.map(() => null);

    // Guidance label
    const guidanceText = currentFramework.timeTracked
      ? 'Tap to track your progress'
      : 'Tap each one as you complete it';
    const guidance = document.createElement('div');
    guidance.className = 'framework-guidance-label';
    guidance.textContent = guidanceText;
    wrap.appendChild(guidance);

    const row = document.createElement('div');
    row.className = 'fwk-boxes-row';

    currentFramework.elements.forEach((el, i) => {
      const box = document.createElement('button');
      box.className = 'fwk-box';
      box.innerHTML = (showEmoji && el.emoji ? `<span class="fwk-box-emoji">${el.emoji}</span>` : '')
        + `<span class="fwk-box-label">${el.label}</span>`;

      box.onclick = () => {
        playPop();
        if (currentFramework.timeTracked) {
          if (!box.classList.contains('tapped')) {
            fwkElementTaps[i] = challengeNow();
            box.classList.add('tapped');
          }
        } else {
          const wasTapped = box.classList.contains('tapped');
          box.classList.toggle('tapped', !wasTapped);
          fwkElementTaps[i] = wasTapped ? null : challengeNow();
        }
      };

      row.appendChild(box);
    });

    wrap.appendChild(row);

  } else if (currentFramework.mode === 'counter') {
    fwkTapCount = 0;

    const btn = document.createElement('button');
    btn.className = 'fwk-counter-btn';
    const label = currentFramework.buttonLabel || currentFramework.postChallenge.label || 'Count';
    btn.innerHTML = `<span class="fwk-counter-label">${label}</span>`;
    btn.onclick = () => {
      playPop();
      fwkTapCount++;
      btn.classList.add('fwk-counter-bump');
      setTimeout(() => btn.classList.remove('fwk-counter-bump'), 200);
    };
    wrap.appendChild(btn);
  }
}

function renderFrameworkZone() {
  const zone = document.getElementById('framework-zone');
  zone.innerHTML = '';
  zone.style.display = 'none';
  if (!currentFramework) return;

  const pc = currentFramework.postChallenge;

  if (pc.type === 'time-distribution') {
    const SEG_COLORS = ['#eab308', '#60a5fa', '#f472b6', '#34d399', '#fb923c', '#a78bfa', '#38bdf8'];
    const elements   = currentFramework.elements;
    const totalMs    = fwkChallengeEndTime - fwkChallengeStartTime;
    const segments   = []; // { el, durMs, reached, color }

    if (currentFramework.mode === 'sequential') {
      // Sequential: tap[i] = when step i ENDED; step 0 starts at challengeStart
      for (let i = 0; i < elements.length; i++) {
        const startMs = i === 0 ? fwkChallengeStartTime : fwkElementTaps[i - 1];
        if (startMs === null) {
          // Previous step was never tapped — this step never started
          segments.push({ el: elements[i], durMs: 0, reached: false, color: SEG_COLORS[i % SEG_COLORS.length] });
        } else if (fwkElementTaps[i] !== null) {
          // Step completed (tapped to move on)
          segments.push({ el: elements[i], durMs: fwkElementTaps[i] - startMs, reached: true, color: SEG_COLORS[i % SEG_COLORS.length] });
        } else {
          // Final active step — ran to challenge end
          segments.push({ el: elements[i], durMs: fwkChallengeEndTime - startMs, reached: true, color: SEG_COLORS[i % SEG_COLORS.length] });
          for (let j = i + 1; j < elements.length; j++) {
            segments.push({ el: elements[j], durMs: 0, reached: false, color: SEG_COLORS[j % SEG_COLORS.length] });
          }
          break;
        }
      }
    } else {
      // Parallel: taps sorted by time; each tap's duration = time to next tap (or challenge end)
      const tapped = fwkElementTaps
        .map((t, i) => ({ i, t }))
        .filter(x => x.t !== null)
        .sort((a, b) => a.t - b.t);

      if (tapped.length === 0) return;

      const tappedSet = new Set(tapped.map(x => x.i));
      tapped.forEach((tap, k) => {
        const segEnd = k + 1 < tapped.length ? tapped[k + 1].t : fwkChallengeEndTime;
        segments.push({ el: elements[tap.i], durMs: segEnd - tap.t, reached: true, color: SEG_COLORS[k % SEG_COLORS.length] });
      });
      elements.forEach((el, i) => {
        if (!tappedSet.has(i)) segments.push({ el, durMs: 0, reached: false, color: SEG_COLORS[segments.length % SEG_COLORS.length] });
      });
    }

    const reachedSegs  = segments.filter(s => s.reached && s.durMs > 0);
    const reachedTotal = reachedSegs.reduce((sum, s) => sum + s.durMs, 0);

    if (reachedSegs.length === 0) return;

    // Color bar
    const bar = document.createElement('div');
    bar.className = 'fwk-dist-bar';
    reachedSegs.forEach(seg => {
      const pct   = reachedTotal > 0 ? Math.max(1, Math.round((seg.durMs / reachedTotal) * 100)) : 0;
      const segEl = document.createElement('div');
      segEl.className        = 'fwk-dist-seg';
      segEl.style.width      = '0%';
      segEl.style.background = seg.color;
      bar.appendChild(segEl);
      setTimeout(() => { segEl.style.width = `${pct}%`; }, 60);
    });

    // Legend
    const legend = document.createElement('div');
    legend.className = 'fwk-dist-legend';
    segments.forEach(seg => {
      const item = document.createElement('div');
      item.className = 'fwk-dist-legend-item' + (seg.reached && seg.durMs > 0 ? '' : ' unreached');

      const swatch = document.createElement('span');
      swatch.className        = 'fwk-dist-legend-swatch';
      swatch.style.background = seg.color;

      const lbl = document.createElement('span');
      lbl.className   = 'fwk-dist-legend-label';
      lbl.textContent = (seg.el.emoji ? seg.el.emoji + ' ' : '') + seg.el.label;

      const time = document.createElement('span');
      time.className   = 'fwk-dist-legend-time';
      time.textContent = seg.reached && seg.durMs > 0
        ? Math.round(seg.durMs / 1000) + 's'
        : '—';

      item.appendChild(swatch);
      item.appendChild(lbl);
      item.appendChild(time);
      legend.appendChild(item);
    });

    zone.appendChild(bar);
    zone.appendChild(legend);
    zone.style.display = 'block';

  } else if (pc.type === 'completion') {
    const row = document.createElement('div');
    row.className = 'fwk-completion-row';
    currentFramework.elements.forEach((el, i) => {
      const box = document.createElement('div');
      box.className = 'fwk-completion-box' + (fwkElementTaps[i] !== null ? ' tapped' : '');
      box.innerHTML = (el.emoji ? `<span>${el.emoji}</span>` : '') + `<span>${el.label}</span>`;
      row.appendChild(box);
    });
    zone.appendChild(row);
    zone.style.display = 'block';

  } else if (pc.type === 'counter') {
    const sentence = document.createElement('p');
    sentence.className = 'fwk-counter-sentence';
    if (pc.resultSentence) {
      const parts = pc.resultSentence.split('{count}');
      sentence.appendChild(document.createTextNode(parts[0]));
      const numSpan = document.createElement('span');
      numSpan.className = 'fwk-counter-sentence-num';
      numSpan.textContent = fwkTapCount;
      sentence.appendChild(numSpan);
      if (parts[1]) sentence.appendChild(document.createTextNode(parts[1]));
    } else {
      const numSpan = document.createElement('span');
      numSpan.className = 'fwk-counter-sentence-num';
      numSpan.textContent = fwkTapCount;
      sentence.appendChild(numSpan);
      if (pc.label) sentence.appendChild(document.createTextNode(' ' + pc.label));
    }
    zone.appendChild(sentence);
    zone.style.display = 'block';

  } else if (pc.type === 'completion-timed') {
    // Row of cards: always in defined element order; tapped = elapsed time + ✓; untapped = ✗
    const row = document.createElement('div');
    row.className = 'fwk-ct-row';
    currentFramework.elements.forEach((el, i) => {
      const tapped = fwkElementTaps[i] !== null;
      const item = document.createElement('div');
      item.className = 'fwk-ct-item' + (tapped ? ' tapped' : '');
      if (el.emoji) {
        const emo = document.createElement('div');
        emo.className = 'fwk-ct-emoji';
        emo.textContent = el.emoji;
        item.appendChild(emo);
      }
      const lbl = document.createElement('div');
      lbl.className = 'fwk-ct-label';
      lbl.textContent = el.label;
      item.appendChild(lbl);
      const check = document.createElement('div');
      check.className = 'fwk-ct-check';
      check.textContent = tapped ? '✓' : '✗';
      item.appendChild(check);
      if (tapped) {
        const elapsed = Math.max(0, Math.round((fwkElementTaps[i] - fwkChallengeStartTime) / 1000));
        const timeEl = document.createElement('div');
        timeEl.className = 'fwk-ct-time';
        timeEl.textContent = elapsed + 's';
        item.appendChild(timeEl);
      }
      row.appendChild(item);
    });
    zone.appendChild(row);
    zone.style.display = 'block';
  }
}

      stars.appendChild(btn);
    }
    row.appendChild(stars);
    ratingsEl.appendChild(row);
  });

  ratingsEl.style.display = 'flex';
}

function launchChallenge() {
  if (currentChallenge === 'story') {
    const words = pickRandom(WORDS, 3);
    usedPromptText = words.join(', ');
    const wordsHTML = `<div class="words-list">${words.map(w => `<div class="word-item">${w}</div>`).join('')}</div>`;
    // Render to active screen
    document.getElementById('prompt-label').textContent = 'Your 3 words';
    document.getElementById('prompt-display').innerHTML = wordsHTML;
    timerTotal = 60;

    if (prepTimeEnabled) {
      // Also render to prep screen and go there first
      document.getElementById('prep-prompt-label').textContent = 'Your 3 words';
      document.getElementById('prep-prompt-display').innerHTML = wordsHTML;
      showScreen('screen-prep');
      startPrepTimer();
      schedulePrepFade();
      return;
    }

    startActiveChallenge();
    return;
  } else if (currentChallenge === 'topic') {
    const topic = pickRandom(TOPICS, 1)[0];
    usedPromptText = topic;
    const topicHTML = `<div class="word-item">${topic}</div>`;
    document.getElementById('prompt-label').textContent = 'Your topic';
    document.getElementById('prompt-display').innerHTML = topicHTML;
    timerTotal = 60;
    if (prepTimeEnabled) {
      document.getElementById('prep-prompt-label').textContent = 'Your topic';
      document.getElementById('prep-prompt-display').innerHTML = topicHTML;
      showScreen('screen-prep');
      startPrepTimer();
      schedulePrepFade();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'plot') {
    const plot = pickRandom(PLOTS, 1)[0];
    usedPromptText = plot;
    const plotHTML = `<p class="plot-text">${plot}</p>`;
    document.getElementById('prompt-label').textContent = 'Your story';
    document.getElementById('prompt-display').innerHTML = plotHTML;
    timerTotal = 60;
    if (prepTimeEnabled) {
      document.getElementById('prep-prompt-label').textContent = 'Your story';
      document.getElementById('prep-prompt-display').innerHTML = plotHTML;
      showScreen('screen-prep');
      startPrepTimer();
      schedulePrepFade();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'selfknowledge') {
    const prompt = pickRandom(SELF_KNOWLEDGE, 1)[0];
    usedPromptText = prompt;
    document.getElementById('prompt-label').textContent = 'Your prompt';
    document.getElementById('prompt-display').innerHTML =
      `<div class="words-list"><p class="twister-text">${prompt}</p></div>`;
    timerTotal = 60;
    if (prepTimeEnabled) {
      document.getElementById('prep-prompt-label').textContent = 'Your prompt';
      document.getElementById('prep-prompt-display').innerHTML =
        `<p class="twister-text">${prompt}</p>`;
      showScreen('screen-prep');
      startPrepTimer();
      schedulePrepFade();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'interview') {
    const q = pickRandom(INTERVIEW_QUESTIONS, 1)[0];
    usedPromptText = q;
    document.getElementById('prompt-label').textContent = 'Your question';
    document.getElementById('prompt-display').innerHTML = `<p class="twister-text">${q}</p>`;
    timerTotal = 60;
    if (prepTimeEnabled) {
      document.getElementById('prep-prompt-label').textContent = 'Your question';
      document.getElementById('prep-prompt-display').innerHTML = `<p class="twister-text">${q}</p>`;
      showScreen('screen-prep');
      startPrepTimer();
      schedulePrepFade();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'gratitude') {
    usedPromptText = GRATITUDE_PROMPT;
    document.getElementById('prompt-label').textContent = '';
    document.getElementById('prompt-display').innerHTML =
      `<div class="words-list"><div class="word-item">${GRATITUDE_PROMPT}</div></div>`;
    timerTotal = 60;
    if (prepTimeEnabled) {
      document.getElementById('prep-prompt-label').textContent = '';
      document.getElementById('prep-prompt-display').innerHTML =
        `<div class="word-item">${GRATITUDE_PROMPT}</div>`;
      showScreen('screen-prep');
      startPrepTimer();
      schedulePrepFade();
      return;
    }
    startActiveChallenge();
    return;
  } else if (currentChallenge === 'tongue') {
    const tw = pickRandom(TWISTERS, 1)[0];
    usedPromptText = tw;
    renderTwister(tw);
    timerTotal = 30;
  } else if (currentChallenge === 'articulation') {
    const item = pickRandom(ARTICULATIONS, 1)[0];
    usedPromptText = item.name;
    renderArticulation(item);
    timerTotal = 30;
  } else if (currentChallenge === 'articulation2') {
    const item = pickRandom(ARTICULATIONS, 1)[0];
    usedPromptText = item.name;
    renderArticulation2(item);
    timerTotal = 30;
  }

  // Prep time for fall-through challenges (tongue, articulation, articulation2)
  if (prepTimeEnabled) {
    const prepLabels = {
      tongue: 'Your twister', articulation: usedPromptText, articulation2: usedPromptText,
    };
    document.getElementById('prep-prompt-label').textContent = prepLabels[currentChallenge] || '';
    document.getElementById('prep-prompt-display').innerHTML =
      document.getElementById('prompt-display').innerHTML;
    showScreen('screen-prep');
    startPrepTimer();
    schedulePrepFade();
    return;
  }

  startActiveChallenge();
}

// -Time's up screen —

function showTimesUp() {
  fwkChallengeEndTime = challengeNow();

  const title      = document.querySelector('.timesup-title');
  const sub        = document.querySelector('.timesup-sub');
  const completion = document.getElementById('timesup-completion');
  const prompt     = document.getElementById('timesup-prompt');

  // Always use compact header title for all challenges
  title.textContent = "Time's up!";
  title.className   = 'timesup-title timesup-title-compact';
  const timesupScreen = document.getElementById('screen-timesup');
  timesupScreen.classList.remove('art2-mode');
  timesupScreen.classList.remove('gratitude-mode');

  // Always hide the art2 score section; shown only for articulation2
  const scoreSection = document.getElementById('art2-score-section');
  scoreSection.classList.remove('visible');

  // Render framework zone and challenge ratings (generic, data-driven)
  renderFrameworkZone();
  renderChallengeRatings();

  if (currentChallenge === 'articulation2') {
    const reached = artLineIdx + 1;
    const pct = artTotalLines > 0 ? Math.round((reached / artTotalLines) * 100) : 0;

    document.getElementById('screen-timesup').classList.add('art2-mode');
    sub.style.display        = 'none';
    prompt.style.display     = 'none';
    completion.style.display = 'none';
    scoreSection.classList.add('visible');

    // Progress bar — no track, pct floats just off the right edge of the fill
    const fill  = document.getElementById('art2-progress-fill');
    const pctEl = document.getElementById('art2-progress-pct');
    fill.style.width  = '0%';
    pctEl.textContent = `${pct}%`;

    if (pct > 80) {
      pctEl.classList.add('inside');
      pctEl.style.left = '';
    } else {
      pctEl.classList.remove('inside');
      pctEl.style.left = `${pct}%`;
    }

    setTimeout(() => { fill.style.width = `${pct}%`; }, 60);

    // Generate star rows (reset each time; currentColor picks up CSS colour)
    ['art2-stars-accuracy', 'art2-stars-flow'].forEach(id => {
      const container = document.getElementById(id);
      container.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const btn = document.createElement('button');
        btn.className = 'art2-star';
        btn.setAttribute('data-value', i);
        btn.innerHTML = '<svg viewBox=”0 0 24 24” fill=”currentColor” stroke=”currentColor” stroke-width=”1.5” stroke-linecap=”round” stroke-linejoin=”round”><polygon points=”12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2”/></svg>';
        btn.onclick = () => {
          const val = parseInt(btn.getAttribute('data-value'));
          container.querySelectorAll('.art2-star').forEach((s, idx) => {
            s.classList.toggle('filled', idx < val);
          });
        };
        container.appendChild(btn);
      }
    });

  } else {
    const ratings = CHALLENGE_RATINGS[currentChallenge] || [];
    title.textContent = currentChallenge === 'gratitude' ? "That's time" : "Time's up!";
    if (currentChallenge === 'gratitude') timesupScreen.classList.add('gratitude-mode');
    const hideReflection = currentFramework?.mode === 'counter';
    if (hideReflection) {
      sub.style.display = 'none';
    } else {
      sub.textContent   = (currentChallenge === 'gratitude' || ratings.length === 0)
                          ? 'How did you find that?' : 'How did you do?';
      sub.style.display = '';
    }
    prompt.style.display     = 'none';
    completion.style.display = 'none';
  }

  showScreen('screen-timesup');
}
